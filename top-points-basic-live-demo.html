<!--
  Same proof-of-concept pattern as top-points-prism-live-demo.html, applied to the Basic v2 design
  (from the same separate design-only Claude session, shared with the owner as an Artifact). See that
  file's header comment for what this proves and does not prove — identical here, just a different skin
  over the same /api/overlay-access/<token>/points contract.
-->
<title>Top gifters basic v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0f16; --text-dim: #8892a0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', system-ui, sans-serif; }

  .canvas432 {
    width: 432px; height: 768px; margin: 0 auto; position: relative;
    background: radial-gradient(circle at 25% 20%, rgba(120,90,220,.15), transparent 55%), #05070b;
    overflow: hidden; padding: 28px 16px 0;
  }

  .conn-badge {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 10px; padding: 3px 10px; border-radius: 999px; letter-spacing: .04em;
    display: flex; align-items: center; gap: 5px;
  }
  .conn-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .conn-badge.live { color: #6dffb0; background: rgba(109,255,176,.1); border: 1px solid rgba(109,255,176,.3); }
  .conn-badge.live .dot { background: #6dffb0; box-shadow: 0 0 6px #6dffb0; animation: pulseDot 1.6s ease-in-out infinite; }
  .conn-badge.error { color: #ff8f8f; background: rgba(255,80,80,.1); border: 1px solid rgba(255,80,80,.3); }
  .conn-badge.error .dot { background: #ff8f8f; }
  .conn-badge.loading { color: var(--text-dim); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); }
  .conn-badge.loading .dot { background: var(--text-dim); }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .empty-state {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; color: var(--text-dim); font-size: 13px; text-align: center;
    padding: 0 40px;
  }
  .empty-state[hidden] { display: none; } /* see prism-live-demo.html's comment on this footgun */
  .empty-state strong { color: #fff; font-size: 16px; font-weight: 800; }

  .list { display: flex; flex-direction: column; gap: 36px; margin-top: 20px; }

  .ts-row {
    display: flex; align-items: center; gap: 26px;
    opacity: 0; transform: translateY(10px);
    animation: rowIn .45s ease-out forwards;
  }
  @keyframes rowIn { to { opacity: 1; transform: translateY(0); } }

  .avatar-section { position: relative; width: 58px; height: 58px; flex: 0 0 auto; }

  .ring-wrap { position: absolute; inset: -22px; pointer-events: none; }
  .ring-backlight {
    position: absolute; inset: -4px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, rgba(255,224,150,.4) 0%, rgba(212,175,55,.2) 45%, transparent 70%);
    filter: blur(2px);
    animation: backlightPulse 2.4s ease-in-out infinite;
  }
  @keyframes backlightPulse { 0%, 100% { opacity: .5; transform: scale(.94); } 50% { opacity: .9; transform: scale(1.04); } }
  .ring-img {
    position: absolute; inset: 0;
    background-image: url(gold-crystal-crown.png);
    background-size: contain; background-repeat: no-repeat; background-position: center;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.5));
  }

  .avatar-frame {
    position: absolute; inset: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .pulse-glow {
    position: absolute; inset: -4px; border-radius: 50%; z-index: 0;
    background: radial-gradient(circle, #ffd97a 0%, transparent 70%);
    animation: pulseGlow 2s ease-in-out infinite;
  }
  @keyframes pulseGlow { 0%, 100% { opacity: .3; transform: scale(.85); } 50% { opacity: .7; transform: scale(1.12); } }
  .avatar-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid rgba(0,0,0,.7);
    box-shadow: 0 0 12px -2px #ffd97a; object-fit: cover; display: block; background: #171b26; position: relative; z-index: 1; }

  .rank-num {
    position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle, rgba(8,9,15,.92) 55%, rgba(8,9,15,0) 100%);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; color: #ffe9a8; z-index: 3;
    text-shadow: 0 0 4px #ffd97a, 0 0 9px #d4af37, 0 0 14px #d4af37;
  }

  .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .player-name { font-weight: 700; font-size: 17px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name-led {
    height: 2.5px; border-radius: 2px; width: 60%;
    background: linear-gradient(90deg, #ffe9a8, #d4af37, transparent);
    box-shadow: 0 0 5px #d4af37;
    animation: ledPulse 1.8s ease-in-out infinite;
  }
  @keyframes ledPulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  .score { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 16px; color: #fbbf24; }
</style>

<div class="canvas432">
  <span class="conn-badge loading" id="connBadge"><span class="dot"></span><span id="connText">Ansluter…</span></span>
  <div class="list" id="list"></div>
  <div class="empty-state" id="emptyState" hidden>
    <strong>Ingen på listan än</strong>
    <span>Top Points fylls på när tittare tjänar poäng — väntar på första händelsen.</span>
  </div>
</div>

<script>
  const ACCESS = new URLSearchParams(location.search).get('access') || '';
  const POLL_MS = 4000;

  function avatarSVG(bg, fg) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="${bg}"/>
      <circle cx="50" cy="38" r="18" fill="${fg}"/>
      <ellipse cx="50" cy="88" rx="30" ry="26" fill="${fg}"/>
    </svg>`;
    return 'data:image/svg+xml;base64,' + btoa(svg);
  }

  function fmt(n) { return Math.round(n).toLocaleString('sv-SE'); }

  function setBadge(state, text) {
    const el = document.getElementById('connBadge');
    el.className = 'conn-badge ' + state;
    document.getElementById('connText').textContent = text;
  }

  function rowHTML(item, index) {
    const avatar = item.avatarUrl || avatarSVG('#171b26', '#ffd97a');
    const name = item.displayName || (item.viewerId ? '@' + item.viewerId.slice(0, 14) : 'Okänd tittare');
    return `
      <div class="ts-row" style="animation-delay:${index * 0.15}s">
        <div class="avatar-section">
          <div class="ring-wrap">
            <div class="ring-backlight"></div>
            <div class="ring-img"></div>
          </div>
          <div class="avatar-frame">
            <div class="pulse-glow"></div>
            <img class="avatar-img" src="${avatar}" alt="" onerror="this.src='${avatarSVG('#171b26', '#ffd97a')}'">
          </div>
          <span class="rank-num">${index + 1}</span>
        </div>
        <div class="info">
          <span class="player-name">${name}</span>
          <div class="name-led"></div>
          <span class="score">${fmt(item.points)}</span>
        </div>
      </div>
    `;
  }

  let lastSignature = '';

  function render(rows) {
    const list = document.getElementById('list');
    const empty = document.getElementById('emptyState');
    // Basic's original design showed 4 rows in the demo data — kept as the visual cap here;
    // the API's own ?limit is the real ceiling, set to 4 below.
    rows = rows.slice(0, 4);
    if (!rows.length) { list.innerHTML = ''; empty.hidden = false; lastSignature = ''; return; }
    empty.hidden = true;
    const signature = rows.map(r => r.viewerId + ':' + r.points).join('|');
    if (signature === lastSignature) return;
    lastSignature = signature;
    list.innerHTML = rows.map(rowHTML).join('');
  }

  async function poll() {
    if (!ACCESS) { setBadge('error', 'Ingen ?access=-token i länken'); return; }
    try {
      const res = await fetch(`/api/overlay-access/${encodeURIComponent(ACCESS)}/points?limit=4`, { cache: 'no-store' });
      if (res.status === 402) { setBadge('error', 'Kräver VYRA Premium'); return; }
      if (res.status === 401) { setBadge('error', 'Länken är ogiltig eller har gått ut'); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'okänt fel');
      setBadge('live', 'Live');
      render(data.points || []);
    } catch (e) {
      setBadge('error', 'Tappade anslutningen — försöker igen');
      console.warn('[top-points-basic] poll misslyckades:', e && e.message);
    }
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
