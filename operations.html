<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYRA Operations</title><link rel="stylesheet" href="legal.css"><link rel="stylesheet" href="auth-client.css"><style>main{width:min(1180px,calc(100% - 40px))}.ops-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.panel{padding:20px;border:1px solid #3b2545;border-radius:16px;background:#100817}.ticket{display:grid;gap:8px;padding:15px 0;border-bottom:1px solid #302039}.ticket header{position:static;padding:0;border:0;background:none;backdrop-filter:none}.ticket select,.panel input,.panel textarea,.panel select{padding:10px;border:1px solid #51305e;border-radius:9px;background:#09040d;color:#fff}.ticket-controls{display:flex;gap:8px}.panel form{display:grid;gap:12px}.panel label{display:grid;gap:6px}.panel textarea{min-height:130px}.panel button{padding:11px;border:0;border-radius:9px;background:#9b36dc;color:#fff;font-weight:800;cursor:pointer}@media(max-width:850px){.ops-grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html"><i>V</i>VYRA Operations</a><a href="status.html" target="_blank">Publik status ↗</a></header><main><h1>Driftcentral</h1><p class="lead">Supportkö och incidentpublicering. Endast plattformsadministratörer.</p><div class="ops-grid"><section class="panel"><h2>Supportkö</h2><div id="ticketQueue">Laddar…</div></section><section class="panel"><h2>Publicera incident</h2><form id="incidentForm"><label>Titel<input name="title" maxlength="160" required></label><label>Påverkan<select name="impact"><option value="minor">Mindre</option><option value="major">Stor</option><option value="critical">Kritisk</option></select></label><label>Status<select name="status"><option value="investigating">Undersöker</option><option value="identified">Identifierad</option><option value="monitoring">Övervakar</option><option value="resolved">Löst</option></select></label><label>Publik information<textarea name="message" maxlength="3000" required></textarea></label><button>Publicera</button><p id="opsError"></p></form></section></div></main><script src="auth-client.js"></script><script src="operations.js"></script></body></html>
