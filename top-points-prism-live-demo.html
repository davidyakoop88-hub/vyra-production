<!--
  Proof-of-concept: the Prism vertical ranking design (from a separate design-only Claude session,
  shared with the owner as Artifacts) wired to the REAL points-runtime API — /api/overlay-access/
  <token>/points — using the exact same ?access=<token> URL convention every other OBS widget uses
  (overlay-access.js, server/index.js:301). Point this file's URL at a running VYRA server with a
  real overlay-access token to see genuine data.

  What this proves: the fetch/poll/render loop against the real API contract, empty-state handling,
  error/reconnect handling, and the avatar/display-name join added to points-runtime.js's readTop().
  What this does NOT prove: it is not registered in the widget factory (public/widgets/base-widget.js)
  or studio.html's render pipeline yet — that integration is a separate, larger step. It also has not
  been click-tested against a REAL running server+Postgres (only against a throwaway local mock
  server returning the same JSON shape) — the same environment limitation noted on this branch's
  earlier commits.

  Ring artwork (gold-ruby-wreath.png) is not included here; copy it alongside this file from the
  Prism Artifact if you want the ring rendered instead of a blank/missing-image gap.
-->
<title>Top Points — Prism (live data)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0f16; --text-dim: #8892a0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', system-ui, sans-serif; }

  .canvas432 {
    width: 432px; height: 768px; margin: 0 auto; position: relative;
    background:
      radial-gradient(circle at 25% 15%, rgba(120,90,220,.18), transparent 55%),
      radial-gradient(circle at 80% 85%, rgba(20,160,200,.12), transparent 55%),
      #05070b;
    overflow: hidden;
  }

  .conn-badge {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 10px; padding: 3px 10px; border-radius: 999px; letter-spacing: .04em;
    display: flex; align-items: center; gap: 5px;
  }
  .conn-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .conn-badge.live { color: #6dffb0; background: rgba(109,255,176,.1); border: 1px solid rgba(109,255,176,.3); }
  .conn-badge.live .dot { background: #6dffb0; box-shadow: 0 0 6px #6dffb0; animation: pulseDot 1.6s ease-in-out infinite; }
  .conn-badge.error { color: #ff8f8f; background: rgba(255,80,80,.1); border: 1px solid rgba(255,80,80,.3); }
  .conn-badge.error .dot { background: #ff8f8f; }
  .conn-badge.loading { color: var(--text-dim); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); }
  .conn-badge.loading .dot { background: var(--text-dim); }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .empty-state {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; color: var(--text-dim); font-size: 13px; text-align: center;
    padding: 0 40px;
  }
  /* .empty-state's own display:flex above is an author rule and beats the UA default
     [hidden]{display:none} outright — the hidden attribute alone does nothing on its own here.
     Needs its own explicit rule (same footgun as vyra_panelens_important_lager). */
  .empty-state[hidden] { display: none; }
  .empty-state strong { color: #fff; font-size: 16px; font-weight: 800; }

  #list { position: absolute; top: 36px; left: 0; right: 0; padding: 0 16px;
    display: flex; flex-direction: column; gap: 0.55em; font-size: 14px; }

  .ns-row { position: relative; }
  .ns-row-inner { position: relative; display: flex; align-items: center; gap: 0.7em;
    opacity: 0; transform: translateX(-24px);
    animation: rowIn .5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rowIn { to { opacity: 1; transform: translateX(0); } }

  .avatar-wrap { position: relative; width: 52px; height: 52px; flex: 0 0 auto; }

  .flame-ring { position: absolute; inset: -9px; pointer-events: none; }
  .ring-backlight {
    position: absolute; inset: -6px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, color-mix(in srgb, var(--c) 45%, transparent) 0%, color-mix(in srgb, var(--c2) 22%, transparent) 45%, transparent 68%);
    filter: blur(2px);
    animation: backlightPulse 2.4s ease-in-out infinite;
  }
  @keyframes backlightPulse {
    0%, 100% { opacity: .5; transform: scale(.94); }
    50%      { opacity: .85; transform: scale(1.02); }
  }
  .metal-ring {
    position: absolute; inset: 0;
    background-image: url(gold-ruby-wreath.png);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
  }

  .avatar-core {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 44px; height: 44px;
  }
  .avatar-frame {
    position: absolute; inset: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; z-index: 1;
  }
  .pulse-glow {
    position: absolute; inset: -5px; border-radius: 50%; z-index: 0;
    background: radial-gradient(circle, var(--c) 0%, transparent 70%);
    animation: pulseGlow 2s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: .35; transform: scale(.85); }
    50%      { opacity: .85; transform: scale(1.15); }
  }
  .avatar-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid rgba(0,0,0,.7);
    box-shadow: 0 0 14px -2px var(--c), 0 0 0 2px rgba(0,0,0,.4); object-fit: cover; display: block; background: #0c0c16; position: relative; z-index: 1; }

  .rank-badge { position: absolute; bottom: -6px; left: -3px; width: 18px; height: 16px; z-index: 3;
    background: none; box-shadow: none;
    color: #ffd97a; font-weight: 900; font-size: 11px;
    text-shadow: 0 0 4px #ffd97a, 0 0 8px #d4af37, 0 0 14px #d4af37;
    display: flex; align-items: center; justify-content: center; }

  .meta { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0.2em; }
  .player-name { font-weight: 700; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name-led {
    height: 2.5px; border-radius: 2px; width: 100%;
    background: linear-gradient(90deg, #ffe9a8, #d4af37, #8a1f1f);
    box-shadow: 0 0 5px #d4af37, 0 0 8px #8a1f1f;
    animation: ledPulse 1.8s ease-in-out infinite;
  }
  @keyframes ledPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  .score { flex: 0 0 auto; height: 26px; padding: 0 10px; border-radius: 9px;
    border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
    background: linear-gradient(120deg, color-mix(in srgb, var(--c) 22%, #0b0b14), rgba(8,9,15,.9));
    box-shadow: 0 4px 10px rgba(0,0,0,.45), 0 0 10px -2px var(--c);
    display: flex; align-items: center; justify-content: center; }
  .score-value { color: #fbbf24; font-weight: 900; font-size: 12px; white-space: nowrap; }
</style>

<div class="canvas432">
  <span class="conn-badge loading" id="connBadge"><span class="dot"></span><span id="connText">Ansluter…</span></span>
  <div id="list"></div>
  <div class="empty-state" id="emptyState" hidden>
    <strong>Ingen på listan än</strong>
    <span>Top Points fylls på när tittare tjänar poäng — väntar på första händelsen.</span>
  </div>
</div>

<script>
  // Samma URL-konvention som riktiga OBS-widgetar (overlay-access.js): länken bär ?access=<token>,
  // och all data hämtas via /api/overlay-access/<token>/... — aldrig ett arbetsyte-id i klartext,
  // token BÄR sitt eget workspace_id på serversidan (se server/index.js:301).
  const ACCESS = new URLSearchParams(location.search).get('access') || '';
  const POLL_MS = 4000;
  const TIERS = [
    { c: '#ffa23c', c2: '#ffe36a' }, { c: '#3cbfff', c2: '#ff7a3c' },
    { c: '#ff3ca0', c2: '#3cffb0' }, { c: '#8a5cff', c2: '#3cffb0' },
    { c: '#c8ff3c', c2: '#ffe36a' }, { c: '#3cd9ff', c2: '#ff7a3c' },
    { c: '#3c7bff', c2: '#3cffe0' }, { c: '#ff5c3c', c2: '#8a3cff' },
  ];

  function avatarSVG(bg, fg) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="${bg}"/>
      <circle cx="50" cy="38" r="18" fill="${fg}"/>
      <ellipse cx="50" cy="88" rx="30" ry="26" fill="${fg}"/>
    </svg>`;
    return 'data:image/svg+xml;base64,' + btoa(svg);
  }

  function fmt(n) {
    return Math.round(n).toLocaleString('sv-SE');
  }

  function setBadge(state, text) {
    const el = document.getElementById('connBadge');
    el.className = 'conn-badge ' + state;
    document.getElementById('connText').textContent = text;
  }

  function rowHTML(item, index) {
    const tier = TIERS[index % TIERS.length];
    const avatar = item.avatarUrl || avatarSVG('#171b26', tier.c);
    const name = item.displayName || (item.viewerId ? '@' + item.viewerId.slice(0, 14) : 'Okänd tittare');
    return `
      <div class="ns-row" style="--c:${tier.c};--c2:${tier.c2}">
        <div class="ns-row-inner" style="animation-delay:${index * 0.1}s">
          <div class="avatar-wrap">
            <div class="flame-ring">
              <div class="ring-backlight"></div>
              <div class="metal-ring"></div>
            </div>
            <div class="avatar-core">
              <div class="avatar-frame">
                <div class="pulse-glow"></div>
                <img class="avatar-img" src="${avatar}" alt="" onerror="this.src='${avatarSVG('#171b26', tier.c)}'">
              </div>
              <div class="rank-badge">${index + 1}</div>
            </div>
          </div>
          <div class="meta">
            <span class="player-name">${name}</span>
            <div class="name-led"></div>
          </div>
          <div class="score">
            <span class="score-value">${fmt(item.points)}</span>
          </div>
        </div>
      </div>
    `;
  }

  let lastSignature = '';

  function render(rows) {
    const list = document.getElementById('list');
    const empty = document.getElementById('emptyState');
    if (!rows.length) {
      list.innerHTML = '';
      empty.hidden = false;
      lastSignature = '';
      return;
    }
    empty.hidden = true;
    // Bygg om DOM:en bara när ordning/siffror faktiskt ändrats — annars startar
    // inflygningsanimationen om var 4:e sekund och det ser ut som att widgeten hackar.
    const signature = rows.map(r => r.viewerId + ':' + r.points).join('|');
    if (signature === lastSignature) return;
    lastSignature = signature;
    list.innerHTML = rows.map(rowHTML).join('');
  }

  async function poll() {
    if (!ACCESS) {
      setBadge('error', 'Ingen ?access=-token i länken');
      return;
    }
    try {
      const res = await fetch(`/api/overlay-access/${encodeURIComponent(ACCESS)}/points?limit=10`, { cache: 'no-store' });
      if (res.status === 402) { setBadge('error', 'Kräver VYRA Premium'); return; }
      if (res.status === 401) { setBadge('error', 'Länken är ogiltig eller har gått ut'); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'okänt fel');
      setBadge('live', 'Live');
      render(data.points || []);
    } catch (e) {
      setBadge('error', 'Tappade anslutningen — försöker igen');
      console.warn('[top-points] poll misslyckades:', e && e.message);
    }
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
