<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Gift Counter Overlay – Anpassningsbar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0e0e12;
    color: #eee;
    display: flex;
    min-height: 100vh;
  }

  /* ---------- PREVIEW (simulerar din hemsida) ---------- */
  .preview-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 30% 20%, #1c1c26 0%, #0e0e12 60%);
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16 / 9;
    background: #14141c url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="%2314141c"/><rect width="20" height="20" fill="%2318181f"/><rect x="20" y="20" width="20" height="20" fill="%2318181f"/></svg>') repeat;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    mix-blend-mode: screen; /* tar bort den svarta bakgrunden i klippet */
    pointer-events: none;
  }

  /* Räknaren – detta är det EDITERBARA textlagret ovanpå videon */
  .counter {
    position: absolute;
    left: 50%;
    bottom: 14%;
    transform: translateX(-50%);
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(0,0,0,.6), 0 0 30px currentColor;
    white-space: nowrap;
    transition: color .15s ease, font-size .15s ease, opacity .2s ease;
    pointer-events: none;
  }
  .counter .label {
    display: block;
    font-size: 0.32em;
    opacity: .85;
    letter-spacing: 3px;
    margin-bottom: 2px;
  }

  /* ---------- KONTROLLPANEL ---------- */
  .panel {
    width: 320px;
    flex-shrink: 0;
    background: #16161d;
    border-left: 1px solid #262633;
    padding: 22px 20px;
    overflow-y: auto;
  }
  .panel h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #9a9ac0;
    margin: 0 0 18px;
  }
  .field { margin-bottom: 20px; }
  .field label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #c8c8dc;
    margin-bottom: 8px;
  }
  .field input[type="range"] { width: 100%; }
  .field input[type="color"] {
    width: 100%;
    height: 36px;
    border: none;
    border-radius: 8px;
    background: none;
    cursor: pointer;
  }
  .field input[type="text"], .field input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #2c2c3a;
    background: #0e0e14;
    color: #eee;
    font-size: 14px;
  }

  /* Toggle-switch för "Visa coins" */
  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0e0e14;
    border: 1px solid #2c2c3a;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .switch-row span { font-size: 13px; color: #c8c8dc; }
  .switch {
    position: relative;
    width: 44px;
    height: 24px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-toggle {
    position: absolute; cursor: pointer; inset: 0;
    background: #3a3a48; border-radius: 24px; transition: .2s;
  }
  .slider-toggle::before {
    content: ""; position: absolute; height: 18px; width: 18px;
    left: 3px; top: 3px; background: white; border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider-toggle { background: #ff2d78; }
  .switch input:checked + .slider-toggle::before { transform: translateX(20px); }

  .swatches { display: flex; gap: 8px; margin-top: 8px; }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255,255,255,.2);
  }

  .code-box {
    margin-top: 26px;
    background: #0e0e14;
    border: 1px solid #2c2c3a;
    border-radius: 10px;
    padding: 12px;
    font-size: 11px;
    color: #8a8aa5;
    line-height: 1.5;
  }
  .code-box button {
    width: 100%;
    margin-top: 10px;
    padding: 9px;
    background: #ff2d78;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .code-box button:hover { background: #ff4d8d; }
</style>
</head>
<body>

  <div class="preview-wrap">
    <div class="stage" id="stage">
      <video id="giftVideo" src="anime_Gift_Counter.mp4" autoplay muted loop playsinline></video>
      <div class="counter" id="counter">
        <span class="label">GIFTS MOTTAGNA</span>
        <span id="counterValue">1 248</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Anpassa overlay</h2>

    <div class="switch-row">
      <span>Visa coins/räknare</span>
      <label class="switch">
        <input type="checkbox" id="toggleCoins" checked>
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="field">
      <label>Etikett-text</label>
      <input type="text" id="labelText" value="GIFTS MOTTAGNA">
    </div>

    <div class="field">
      <label>Räknarvärde</label>
      <input type="text" id="counterText" value="1 248">
    </div>

    <div class="field">
      <label>Textfärg</label>
      <input type="color" id="colorPicker" value="#ff2d78">
      <div class="swatches">
        <div class="swatch" style="background:#ff2d78" data-color="#ff2d78"></div>
        <div class="swatch" style="background:#ffd23f" data-color="#ffd23f"></div>
        <div class="swatch" style="background:#3ff2e0" data-color="#3ff2e0"></div>
        <div class="swatch" style="background:#7c4dff" data-color="#7c4dff"></div>
        <div class="swatch" style="background:#ffffff" data-color="#ffffff"></div>
      </div>
    </div>

    <div class="field">
      <label>Textstorlek <span id="sizeVal">54px</span></label>
      <input type="range" id="sizeSlider" min="20" max="120" value="54">
    </div>

    <div class="code-box">
      Så här lägger du in overlayn på din hemsida: ladda upp videofilen och klistra in HTML-koden nedan där du vill visa den. Justera värdena i style-attributen så de matchar dina inställningar ovan.
      <button id="copyBtn">Kopiera embed-kod</button>
    </div>
  </div>

<script>
const counterEl   = document.getElementById('counter');
const counterVal  = document.getElementById('counterValue');
const labelInput  = document.getElementById('labelText');
const counterInput= document.getElementById('counterText');
const colorPicker = document.getElementById('colorPicker');
const sizeSlider  = document.getElementById('sizeSlider');
const sizeVal     = document.getElementById('sizeVal');
const toggleCoins = document.getElementById('toggleCoins');
const swatches    = document.querySelectorAll('.swatch');
const copyBtn     = document.getElementById('copyBtn');

function updateColor(c){
  colorPicker.value = c;
  counterEl.style.color = c;
}
colorPicker.addEventListener('input', e => counterEl.style.color = e.target.value);
swatches.forEach(s => s.addEventListener('click', () => updateColor(s.dataset.color)));

sizeSlider.addEventListener('input', e => {
  counterEl.style.fontSize = e.target.value + 'px';
  sizeVal.textContent = e.target.value + 'px';
});

labelInput.addEventListener('input', e => {
  counterEl.querySelector('.label').textContent = e.target.value;
});
counterInput.addEventListener('input', e => {
  counterVal.textContent = e.target.value;
});

toggleCoins.addEventListener('change', e => {
  counterEl.style.opacity = e.target.checked ? '1' : '0';
});

// init
updateColor('#ff2d78');
counterEl.style.fontSize = '54px';

copyBtn.addEventListener('click', () => {
  const label = labelInput.value;
  const value = counterInput.value;
  const color = colorPicker.value;
  const size  = sizeSlider.value;
  const visible = toggleCoins.checked ? '1' : '0';

  const code = `<div style="position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;">
  <video src="anime_Gift_Counter.mp4" autoplay muted loop playsinline
    style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;"></video>
  <div style="position:absolute;left:50%;bottom:14%;transform:translateX(-50%);
    font-weight:800;color:${color};font-size:${size}px;opacity:${visible};
    text-shadow:0 0 12px rgba(0,0,0,.6),0 0 30px currentColor;white-space:nowrap;
    font-family:'Segoe UI',system-ui,sans-serif;text-align:center;">
    <span style="display:block;font-size:0.32em;opacity:.85;letter-spacing:3px;margin-bottom:2px;">${label}</span>
    ${value}
  </div>
</div>`;

  navigator.clipboard.writeText(code).then(() => {
    copyBtn.textContent = 'Kopierat!';
    setTimeout(() => copyBtn.textContent = 'Kopiera embed-kod', 1500);
  });
});
</script>

</body>
</html>
