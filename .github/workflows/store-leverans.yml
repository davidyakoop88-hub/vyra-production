name: VYRA Store-leverans (manuell)
# MANUELL LEVERANS TILL PARTNER CENTER.
#
# Flödet BYGGER och VERIFIERAR ett Store-paket och lämnar det som en privat Actions-artefakt. Det
# skapar ingen tagg, ingen GitHub-release och anropar inte SignPath. Microsoft signerar paketet
# först efter godkänd certifiering.
#
# UPPLADDNINGEN TILL PARTNER CENTER sker av flödet självt OM de fyra Store-hemligheterna finns
# (se sista stegen). Saknas de hoppas uppladdningen över och paketet laddas upp för hand ur
# artefakten, precis som förut. Förvalt stannar paketet som UTKAST i Partner Center.
#
# ENDAST workflow_dispatch. Flödet får inte kunna trigga på push eller pull_request: en 314 MB
# artefakt per körning är precis det som 2026-08-06 fyllde artefaktkvoten och började fälla PR:er
# som inte hade med desktop-appen att göra.
on:
  workflow_dispatch:
    inputs:
      # FÖRVALT ÄR UTKAST. Paketet laddas upp till Partner Center men skickas inte till
      # certifiering förrän någon trycker på knappen där. Kryssas rutan i skickas det in direkt —
      # då är det den som startar körningen som är den mänskliga grinden.
      skicka_in:
        description: 'Skicka in till certifiering direkt (annars stannar paketet som utkast)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  store-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-app
    steps:
      # BARA FRÅN MAIN. workflow_dispatch låter den som startar välja gren, och ett Store-paket
      # byggt ur en feature-gren ser identiskt ut men innehåller kod som ingen granskat. Villkoret
      # är det enda som skiljer dem åt efteråt.
      - name: Kräv main
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw "Store-leverans får bara köras från main. Kördes från: ${{ github.ref }}"
          }
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - run: npm ci
      - run: npm test

      # Versionen kommer ur package.json — den höjs i en PR, inte här. Ett flöde som själv sätter
      # versionen kan leverera ett paket vars version inte finns i historiken.
      - name: Läs version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw 'package.json saknar version.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Bygger Store-paket for version $version"

      - name: Bygg Store-paket
        run: npm run build:store

      # MANIFESTET ÄR DET STORE LÄSER. Att konfigurationen ser rätt ut bevisar inte att värdena
      # hamnade i paketet, och ett paket med fel identitet kan i värsta fall gå igenom som en ANNAN
      # produkt. Kontrollen sker FÖRE uppladdningen, så en felaktig artefakt aldrig blir hämtbar.
      - name: Verifiera AppX-manifestet
        shell: pwsh
        run: |
          $paket = Get-ChildItem 'dist2' -Filter '*.appx' | Select-Object -First 1
          if (-not $paket) { throw 'Inget AppX-paket byggdes.' }

          $vantad = Get-Content 'store-identitet.json' -Raw | ConvertFrom-Json
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $arkiv = [System.IO.Compression.ZipFile]::OpenRead($paket.FullName)
          try {
            $post = $arkiv.GetEntry('AppxManifest.xml')
            if (-not $post) { throw 'AppxManifest.xml saknas i paketet.' }
            $lasare = New-Object System.IO.StreamReader($post.Open())
            $manifest = $lasare.ReadToEnd()
            $lasare.Dispose()
          } finally { $arkiv.Dispose() }

          $xml = [xml]$manifest
          $identity = $xml.Package.Identity
          $fel = @()
          if ($identity.Name -ne $vantad.identityName) { $fel += "Identity/Name matchar inte store-identitet.json" }
          if ($identity.Publisher -ne $vantad.publisher) { $fel += "Identity/Publisher matchar inte store-identitet.json" }
          if ($xml.Package.Properties.PublisherDisplayName -ne $vantad.publisherDisplayName) {
            $fel += "PublisherDisplayName matchar inte store-identitet.json"
          }
          # Versionen i manifestet ar fyrdelad (x.y.z.0) — jamfor de tre forsta mot package.json.
          $manifestVersion = ($identity.Version -split '\.')[0..2] -join '.'
          if ($manifestVersion -ne '${{ steps.version.outputs.version }}') {
            $fel += "Manifestets version ar $($identity.Version), vantade ${{ steps.version.outputs.version }}.x"
          }
          if ($fel.Count -gt 0) { throw ($fel -join '; ') }
          Write-Host "Manifestet bar ratt identitet och version $($identity.Version)"

      # BRICKORNA I DET FARDIGA PAKETET MASTE VARA VARA.
      #
      # Steget ovan verifierar identiteten men inte bilderna, och det var den luckan som lat
      # electron-builders SampleAppx-exempelbilder na Microsoft. Saknas en bricka i build/appx/
      # lagger app-builder-lib in en exempelbild UTAN ETT ORD I LOGGEN (se
      # vendorAssetsForDefaultAssets i out/targets/AppxTarget.js), och certifieringen faller pa
      # policy 10.1.1.11 On Device Tiles — en vecka senare, med ett gront bygge bakom sig.
      #
      # Jamforelsen ar BYTEIDENTITET mot kallfilerna, inte "filen finns": en exempelbild har
      # ratt namn och ratt matt. Bara innehallet skiljer dem at.
      - name: Verifiera brickorna i paketet
        shell: pwsh
        run: |
          $paket = Get-ChildItem 'dist2' -Filter '*.appx' | Select-Object -First 1
          if (-not $paket) { throw 'Inget AppX-paket byggdes.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $arkiv = [System.IO.Compression.ZipFile]::OpenRead($paket.FullName)
          $fel = @()
          try {
            $kallor = Get-ChildItem 'build/appx' -Filter '*.png'
            if ($kallor.Count -eq 0) { throw 'build/appx/ ar tom — paketet skulle fyllas med exempelbilder.' }
            foreach ($k in $kallor) {
              $post = $arkiv.Entries | Where-Object { $_.Name -eq $k.Name } | Select-Object -First 1
              if (-not $post) { $fel += "$($k.Name): finns inte i paketet"; continue }
              $strom = $post.Open()
              $minne = New-Object System.IO.MemoryStream
              $strom.CopyTo($minne); $strom.Dispose()
              $iPaket = [System.BitConverter]::ToString(
                [System.Security.Cryptography.SHA256]::Create().ComputeHash($minne.ToArray()))
              $minne.Dispose()
              $iKallan = [System.BitConverter]::ToString(
                [System.Security.Cryptography.SHA256]::Create().ComputeHash([System.IO.File]::ReadAllBytes($k.FullName)))
              if ($iPaket -ne $iKallan) {
                $fel += "$($k.Name): innehallet i paketet skiljer sig fran build/appx/ — sannolikt en SampleAppx-exempelbild"
              }
            }
            Write-Host "Kontrollerade $($kallor.Count) brickor mot paketet."
          } finally { $arkiv.Dispose() }
          if ($fel.Count -gt 0) { throw ($fel -join "`n") }

      # Checksumman gor det mojligt att verifiera att filen som laddas upp till Partner Center ar
      # exakt den CI byggde — nedladdning genom webblasare och vidare uppladdning ar annars ett
      # steg utan kvitto.
      - name: Skapa SHA256SUMS.txt
        shell: pwsh
        run: |
          $paket = Get-ChildItem 'dist2' -Filter '*.appx' | Select-Object -First 1
          $hash = (Get-FileHash $paket.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($paket.Name)" | Set-Content 'dist2/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'dist2/SHA256SUMS.txt'

      # PRIVAT ARTEFAKT, ETT DYGN. Actions-artefakter ar bara atkomliga for den som har tillgang till
      # repot — de blir aldrig en publik nedladdning. Retention pa 1 dygn racker for en manuell
      # uppladdning samma dag och haller artefaktkvoten nere.
      - name: Ladda upp Store-paketet (privat, for manuell uppladdning)
        uses: actions/upload-artifact@v4
        with:
          name: VYRA-Store-${{ steps.version.outputs.version }}
          path: |
            electron-app/dist2/VYRA-Store-${{ steps.version.outputs.version }}.appx
            electron-app/dist2/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

      # ── UPPLADDNING TILL PARTNER CENTER ────────────────────────────────────────────────────
      #
      # Allt nedan ligger SIST: ett paket som fallit på manifestet eller brickorna får aldrig nå
      # Microsoft. Stegen kör bara om hemligheterna finns, så flödet beter sig som förut tills
      # någon lagt in dem.
      #
      # HEMLIGHETERNA NÅR BARA DE STEG SOM BEHÖVER DEM. De sätts som env på just de stegen, inte
      # på jobbet — annars hade npm ci, proven och electron-builder (tredjepartskod) haft
      # klienthemligheten i sin miljö.
      - name: Finns Store-nycklarna?
        id: nycklar
        shell: pwsh
        working-directory: .
        env:
          STORE_TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          STORE_KLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          STORE_HEMLIGHET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          STORE_SALJARE: ${{ secrets.SELLER_ID }}
        run: |
          $saknas = @()
          if (-not $env:STORE_TENANT) { $saknas += 'AZURE_AD_TENANT_ID' }
          if (-not $env:STORE_KLIENT) { $saknas += 'AZURE_AD_APPLICATION_CLIENT_ID' }
          if (-not $env:STORE_HEMLIGHET) { $saknas += 'AZURE_AD_APPLICATION_SECRET' }
          if (-not $env:STORE_SALJARE) { $saknas += 'SELLER_ID' }
          if ($saknas.Count -eq 0) {
            "finns=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'Store-nycklarna finns — paketet laddas upp till Partner Center.'
          } else {
            "finns=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $rad = "Uppladdningen till Partner Center hoppades over. Saknade hemligheter: $($saknas -join ', '). Paketet finns som artefakt."
            Write-Host "::warning::$rad"
            $rad | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Installera Microsoft Store Developer CLI
        if: steps.nycklar.outputs.finns == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.1

      # msstore publish BYGGER INTE OM. Den letar upp .appx-filen i dist2 — samma fil som
      # verifierades och checksummades ovan — och laddar upp den till produkten i
      # store-identitet.json.
      #
      # OBS: har produkten redan ett väntande utkast i Partner Center raderar publish det och
      # skapar ett nytt ur den senast publicerade inlämningen. Osparade textändringar i ett
      # sådant utkast försvinner alltså.
      - name: Ladda upp till Partner Center
        if: steps.nycklar.outputs.finns == 'true'
        shell: pwsh
        env:
          STORE_TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          STORE_KLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          STORE_HEMLIGHET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          STORE_SALJARE: ${{ secrets.SELLER_ID }}
          SKICKA_IN: ${{ inputs.skicka_in }}
          PAKETVERSION: ${{ steps.version.outputs.version }}
        run: |
          $produkt = (Get-Content 'store-identitet.json' -Raw | ConvertFrom-Json).storeProductId
          if (-not $produkt) { throw 'store-identitet.json saknar storeProductId.' }

          msstore reconfigure --tenantId $env:STORE_TENANT --sellerId $env:STORE_SALJARE --clientId $env:STORE_KLIENT --clientSecret $env:STORE_HEMLIGHET
          if ($LASTEXITCODE -ne 0) { throw 'msstore reconfigure misslyckades — kontrollera de fyra Store-hemligheterna.' }

          $argument = @('publish', '.', '--inputDirectory', 'dist2', '--appId', $produkt)
          if ($env:SKICKA_IN -ne 'true') { $argument += '--noCommit' }
          msstore @argument
          if ($LASTEXITCODE -ne 0) { throw "msstore publish misslyckades (kod $LASTEXITCODE)." }

          if ($env:SKICKA_IN -eq 'true') {
            $rad = "Version $env:PAKETVERSION ar inskickad till certifiering for $produkt."
          } else {
            $rad = "Version $env:PAKETVERSION ligger som UTKAST i Partner Center for $produkt. Skicka in den darifran."
          }
          Write-Host $rad
          $rad | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
