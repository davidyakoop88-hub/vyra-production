name: Dependency Review
on: [pull_request]
permissions:
  contents: read
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        # Private repositories without GitHub Advanced Security do not expose
        # Dependency Review. The mandatory high-severity npm audit remains in
        # ci.yml, so this additional platform check must not block the build
        # when GitHub reports the feature as unsupported.
        continue-on-error: true
        with:
          fail-on-severity: high

