name: VYRA Windows release
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read
jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Match app version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $current = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # npm version faller med "Version not changed" om package.json redan star pa taggen.
          # Steget ska garantera att de matchar, inte att de skiljde sig innan — en release dar
          # versionen hojdes i en PR fore taggen ar det normala flodet, inte ett fel.
          if ($current -eq $version) { Write-Host "package.json ar redan $version" }
          else { npm version $version --no-git-tag-version }
      - name: Configure production update API
        shell: pwsh
        env:
          VYRA_UPDATE_API_ORIGIN: ${{ vars.VYRA_UPDATE_API_ORIGIN }}
        run: |
          if (-not $env:VYRA_UPDATE_API_ORIGIN -or -not $env:VYRA_UPDATE_API_ORIGIN.StartsWith('https://')) {
            throw 'Repository variable VYRA_UPDATE_API_ORIGIN must be a production HTTPS origin.'
          }
          @{ apiOrigin = $env:VYRA_UPDATE_API_ORIGIN.TrimEnd('/'); channel = 'stable' } |
            ConvertTo-Json | Set-Content 'update-config.json' -Encoding utf8
      - run: npm test
      - name: Build NSIS installer
        run: npm run build -- --win nsis --x64
      # STORE-PAKETET BYGGS PA VARJE PR, precis som NSIS-installern — bygget ar beviset.
      #
      # Paketet laddas ALDRIG upp. Dels ar det ~314 MB mot artefaktkvoten, som 2026-08-06 borjade
      # FALLA PR:er som inte hade med desktop-appen att gora (tests/ci-artifact-budget.test.js
      # vaktar det). Dels ar det en TESTARTEFAKT: den ska inte ga att hamta och installera som om
      # den vore en release. Manifestkontrollen nedan gor bygget bevisande utan att nagot lamnar
      # korningen.
      #
      # Identiteten kommer ur den incheckade store-identitet.json, sa steget kraver inga
      # miljovariabler och ger samma paket for samma commit.
      - name: Build Store package (AppX, testartefakt — publiceras inte)
        run: npm run build:store
      - name: Verify AppX manifest identity
        shell: pwsh
        run: |
          $paket = Get-ChildItem 'dist2' -Filter '*.appx' | Select-Object -First 1
          if (-not $paket) { throw 'Inget AppX-paket byggdes.' }

          $vantad = Get-Content 'store-identitet.json' -Raw | ConvertFrom-Json
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $arkiv = [System.IO.Compression.ZipFile]::OpenRead($paket.FullName)
          try {
            $post = $arkiv.GetEntry('AppxManifest.xml')
            if (-not $post) { throw 'AppxManifest.xml saknas i paketet.' }
            $lasare = New-Object System.IO.StreamReader($post.Open())
            $manifest = $lasare.ReadToEnd()
            $lasare.Dispose()
          } finally { $arkiv.Dispose() }

          # Manifestet ar det som Store faktiskt laser. Att konfigurationen SER ratt ut i
          # package.json bevisar inte att vardena hamnade i paketet.
          $xml = [xml]$manifest
          $identity = $xml.Package.Identity
          $visningsnamn = $xml.Package.Properties.PublisherDisplayName

          $fel = @()
          if ($identity.Name -ne $vantad.identityName) {
            $fel += "Identity/Name ar '$($identity.Name)', vantade '$($vantad.identityName)'"
          }
          if ($identity.Publisher -ne $vantad.publisher) {
            $fel += "Identity/Publisher matchar inte store-identitet.json"
          }
          if ($visningsnamn -ne $vantad.publisherDisplayName) {
            $fel += "PublisherDisplayName ar '$visningsnamn', vantade '$($vantad.publisherDisplayName)'"
          }
          if ($fel.Count -gt 0) { throw ($fel -join '; ') }

          Write-Host "AppX-manifestet bar ratt Store-identitet. Version: $($identity.Version)"
      - name: Validate SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $missing = @()
          if ($env:SIGNPATH_ENABLED -ne 'true') { $missing += 'SIGNPATH_ENABLED=true' }
          if (-not $env:SIGNPATH_API_TOKEN) { $missing += 'SIGNPATH_API_TOKEN' }
          if (-not $env:SIGNPATH_ORGANIZATION_ID) { $missing += 'SIGNPATH_ORGANIZATION_ID' }
          if (-not $env:SIGNPATH_PROJECT_SLUG) { $missing += 'SIGNPATH_PROJECT_SLUG' }
          if (-not $env:SIGNPATH_SIGNING_POLICY_SLUG) { $missing += 'SIGNPATH_SIGNING_POLICY_SLUG' }

          $tag = '${{ github.ref_name }}'
          $isTag = '${{ github.ref }}'.StartsWith('refs/tags/v')
          # En osignerad publik release kraver ett godkannande som namnger EXAKT den har taggen.
          # En generell pa/av-flagga hade blivit kvar oppen efter att nodlaget passerat; det har
          # slocknar av sig sjalvt sa fort nasta version taggas.
          $unsignedApproved = $isTag -and ('${{ vars.UNSIGNED_RELEASE }}' -eq $tag)
          if ($isTag -and $missing.Count -gt 0 -and -not $unsignedApproved) {
            throw "Public releases require SignPath. Missing GitHub configuration: $($missing -join ', '). For att slappa $tag osignerad, satt repovariabeln UNSIGNED_RELEASE=$tag."
          }
          if ($unsignedApproved) {
            Write-Warning "OSIGNERAD RELEASE: $tag publiceras utan kodsignatur (UNSIGNED_RELEASE=$tag). Windows SmartScreen kommer att varna."
          }

          if ($missing.Count -gt 0) {
            Write-Warning "Unsigned manual test build. Missing GitHub configuration: $($missing -join ', ')"
          }
      # Samma villkor som signeringssteget nedan, med flit. SignPath ar den ENDA konsumenten av den
      # har artefakten (den laser artifact-id harifran), och signeringen kor bara pa taggar. Utan
      # taggvillkoret laddades 268 MB upp pa varje pull request for att sedan aldrig lasas av nagon.
      # Villkoren maste folja varandra: uppladdning utan signering ar slosat utrymme, och signering
      # utan uppladdning ar ett trasigt bygge.
      - name: Upload unsigned installer for SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') && vars.UNSIGNED_RELEASE != github.ref_name }}
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: VYRA-Windows-Installer-Unsigned
          path: electron-app/dist2/VYRA-Setup.exe
          if-no-files-found: error
          retention-days: 1
      # Signing runs on release tags only. A pull request builds and tests the same installer but
      # does not sign it: SignPath's REST API is a third party, and when it is down (repeated 503s
      # through the whole retry budget, as in August 2026) an unsigned PR check turns red for a
      # reason that has nothing to do with the code under review. Tag builds still require it —
      # "Validate SignPath configuration" above throws on a tag with the config missing.
      - name: Sign installer with SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') && vars.UNSIGNED_RELEASE != github.ref_name }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: electron-app/dist2/signed
      # Same gate as the signing step itself — this reads dist2/signed, which only exists once
      # SignPath has returned something.
      - name: Use signed installer
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') && vars.UNSIGNED_RELEASE != github.ref_name }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem 'dist2/signed' -Recurse -Filter 'VYRA-Setup.exe' | Select-Object -First 1
          if (-not $signed) { throw 'SignPath did not return VYRA-Setup.exe.' }
          Copy-Item $signed.FullName 'dist2/VYRA-Setup.exe' -Force
      - name: Verify Authenticode signature
        if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.UNSIGNED_RELEASE != github.ref_name }}
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'dist2/VYRA-Setup.exe'
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }
      - name: Create checksum and release metadata
        shell: pwsh
        run: |
          $file = Get-Item 'dist2/VYRA-Setup.exe'
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VYRA-Setup.exe" | Set-Content 'dist2/VYRA-Setup.exe.sha256' -Encoding ascii
          $appVersion = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          @{ version = $appVersion; sizeBytes = $file.Length; sha256 = $hash; platform = 'windows-x64' } | ConvertTo-Json | Set-Content 'dist2/latest.json' -Encoding utf8
      # Bara pa taggar. En pull request BYGGER fortfarande installern — steget "Build NSIS installer"
      # ovan ar beviset att bygget gar — men ingen laddar ner en installer fran en PR, och 268 MB per
      # korning fyllde GitHubs artefaktkvot tills den 2026-08-06 borjade FALLA PR:er som inte hade
      # nagot med desktop-appen att gora (97 levande artefakter, 24,6 GB).
      # Publiceringen nedan laser filerna fran DISK, inte harifran, sa releasen ar oberoende av det
      # har steget.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: VYRA-Windows-Installer
          path: |
            electron-app/dist2/VYRA-Setup.exe
            electron-app/dist2/VYRA-Setup.exe.sha256
            electron-app/dist2/latest.json
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist2/VYRA-Setup.exe dist2/VYRA-Setup.exe.sha256 dist2/latest.json --title "VYRA ${{ github.ref_name }}${{ vars.UNSIGNED_RELEASE == github.ref_name && ' (unsigned)' || '' }}" --generate-notes --verify-tag
