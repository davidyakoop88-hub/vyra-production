name: VYRA CI
# Runs on pull requests and on pushes to main — deliberately not on the integration branches.
#
# So the live-goals work does not exercise this job while it is being built: its proof is the
# "Goal runtime · Postgres 18" workflow, which runs on every push to integration/live-goals-base and
# provisions both a Postgres 18 and a Redis of its own. The first real run of THIS job for that work
# happens when the collected draft PR is opened; the `npm run migrate` step below was added ahead of
# that, because the ingest path now writes goal progress to Postgres before it publishes and the
# Redis-backed ingest tests reach it. The trigger is not to be widened just to force an early run —
# that would put the whole main suite, including the backup/restore proof, on every intermediate
# commit of a branch that is not ready for it.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # ubuntu-latest currently ships the PostgreSQL 16 client used by the
        # backup/restore proof below. Keep the CI server on the matching major
        # so pg_dump can create a portable verified backup.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vyra
          POSTGRES_USER: vyra
          POSTGRES_PASSWORD: ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U vyra -d vyra"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://vyra:ci-password@127.0.0.1:5432/vyra
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: vyra
      PGPASSWORD: ci-password
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_REQUIRED: "true"
      APP_ORIGIN: http://127.0.0.1:8080
      TIKTOK_INGEST_TOKEN: ci-ingest-token-with-at-least-32-characters
      METRICS_TOKEN: ci-metrics-token-with-at-least-32-characters
      MEDIA_SCAN_TOKEN: ci-scanner-token-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Before the suite, not after: ingest now applies goal progress in Postgres before it publishes
      # anything, so the Redis-backed ingest tests need the schema to exist. The idempotency proof
      # further down still runs the migration twice on top of this one.
      - run: npm run migrate
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate JavaScript syntax
        run: find .. -maxdepth 2 -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Apply database schema twice
        run: npm run migrate && npm run migrate
      - name: API readiness smoke test
        run: |
          node index.js > /tmp/vyra-ci.log 2>&1 &
          pid=$!
          trap 'kill -TERM "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health/ready && break; sleep 1; done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/live)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/ready)" = 200
          kill -TERM "$pid"
          wait "$pid"
      - name: Prove database backup and restore
        working-directory: .
        run: bash scripts/verify-backup-restore.sh

  # The client files at the repository root: the session owner, the goal runtime and the DOM patcher.
  # Until now this suite only ever ran on a developer machine. jsdom is the single devDependency and
  # ships nowhere — server/Dockerfile builds from the server/ context, and the electron builder
  # excludes package.json, node_modules and tests from extraResources.
  #
  # The audit here runs WITH devDependencies, unlike server and bridge: jsdom is a test tool that
  # executes on this CI runner, which is exactly where a vulnerability in it would matter.
  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      # Billigast forst, sa ett brutet kontrakt namnges innan hela sviten hinner koras. Alla tre
      # stegen kor filer ur tests/, sa `npm test` tacker dem redan — de tva forsta finns for att
      # felet ska ha ett NAMN i CI-vyn, inte for att ge extra tackning. Kostar ~1 s.
      - name: 'Kontrakt · brygga -> moln -> klient'
        run: npm run test:contract

      - name: 'Fuzz · 1000 seedade events'
        run: npm run test:fuzz

      - name: 'Hela klientsviten'
        run: npm test

      # Lackagevakten kors i en RIKTIG webblasare, inte i jsdom.
      #
      # jsdom har ingen Web Locks-implementation, sa session-state faller tillbaka pa read-only och
      # save() skriver aldrig — ett lackage som gar via save() ar osynligt dar. Det var precis
      # darfor widgetarna som dok upp i Davids OBS-overlay (#86) kunde ligga bakom en gron vakt.
      # jsdom har inte heller nagon layout, sa fragan "syns den har widgeten?" gar inte att stalla.
      #
      # ubuntu-latest levereras med Google Chrome; playwright-core startar den utan att ladda ner
      # nagon egen webblasare. Hittas ingen hoppar testet hogljutt i stallet for att falla.
      - name: 'Lackage · riktig webblasare'
        run: npm run test:browser

      # Coverage kors informativt och far inte falla bygget. Siffran ar aven MISSVISANDE hogt
      # avgransad: node instrumenterar bara moduler den sjalv laddar, sa media.js, cloud-sync.js,
      # gift-event-images.js, live-client.js och last-x-alerts.js — filerna dar veckans buggar bodde
      # — syns inte alls, eftersom de laddas som <script> i jsdom. Se docs/ci.md.
      - name: 'Coverage (informativ, tacker inte widgetfilerna)'
        continue-on-error: true
        run: npm run test:coverage 2>&1 | sed -n '/start of coverage/,/end of coverage/p'

      - run: npm audit --audit-level=high

  # Caddyfilen ar det enda i repot som kan ta ner HELA sajten utan att nagot test marker det:
  # den kopieras rakt in i imagen av Dockerfile:55 och las forst av Caddy vid start. Ett syntaxfel
  # upptacktes alltsa tidigast vid deploy. tests/static-cache-headers.test.js laser filens TEXT och
  # kan darfor inte se om Caddy faktiskt accepterar den - det ar vad det har steget gor.
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Caddy · konfigurationen gar att lasa'
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            caddy:2-alpine caddy validate --adapter caddyfile --config Caddyfile

      # tests/security-headers.test.js laser Caddyfilens TEXT. Det bevisar inte att Caddy faktiskt
      # SKICKAR nagot - en syntaktiskt giltig fil kan tiga. Har startas servern pa riktigt och
      # headrarna hamtas ur svaret. Det var precis den skillnaden som lat HSTS och CSP saknas i
      # produktion i manader utan att nagot test markte det.
      - name: 'Caddy · headrarna skickas faktiskt'
        run: |
          set -eu
          mkdir -p /tmp/vyra-site
          printf '<!doctype html><title>headertest</title>' > /tmp/vyra-site/index.html
          docker run -d --name vyra-caddy -p 8080:80 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v /tmp/vyra-site:/app:ro caddy:2-alpine
          for i in $(seq 40); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -sSI http://127.0.0.1:8080/ | tr -d '\r' > /tmp/vyra-headers.txt
          docker logs vyra-caddy || true
          docker rm -f vyra-caddy > /dev/null
          echo '--- svarsheaders ---'; cat /tmp/vyra-headers.txt
          krav() {
            if ! grep -qi "$1" /tmp/vyra-headers.txt; then
              echo "SAKNAS I SVARET: $1"; exit 1
            fi
          }
          krav 'strict-transport-security: max-age=86400'
          krav "content-security-policy:.*frame-ancestors 'self'"
          krav "content-security-policy:.*base-uri 'self'"
          krav "content-security-policy:.*form-action 'self'"
          krav "content-security-policy:.*object-src 'none'"
          krav 'x-content-type-options: nosniff'
          # Steg 1 far inte smyga vidare i trappan.
          if grep -qiE 'strict-transport-security:.*(includesubdomains|preload)' /tmp/vyra-headers.txt; then
            echo 'HSTS gick forbi steg 1 - includeSubDomains/preload ska beslutas separat'; exit 1
          fi

      # Bevisar att event-strommen inte komprimeras — mot en RIKTIG Caddy med en riktig SSE-server
      # bakom. Steget finns for att gissningen inte gick att lita pa: en forsta fix med
      # `not path /api/*/events/stream` validerade rent, gick igenom alla textbaserade tester, och
      # gjorde noll skillnad i produktion. Ett `*` mitt i en sokvag korsar inte snedstreck.
      #
      # Utan buffring kommer headers direkt (200). Buffras strommen kommer ingenting alls och curl
      # rapporterar 000 — precis det som gjorde overlayn dod.
      - name: 'Caddy · event-strommen komprimeras inte'
        run: |
          set -eu
          cat > /tmp/sse-stub.js <<'STUB'
          const http = require('http');
          http.createServer((req, res) => {
            res.writeHead(200, { 'content-type': 'text/event-stream; charset=utf-8', 'cache-control': 'no-cache' });
            res.flushHeaders();
            res.write(': ping\n\n');
            setInterval(() => res.write(': ping\n\n'), 1000);
          }).listen(8080, '127.0.0.1');
          STUB
          node /tmp/sse-stub.js &
          STUB_PID=$!
          for i in $(seq 20); do curl -sf -o /dev/null --max-time 1 http://127.0.0.1:8080/ && break || sleep 1; done

          mkdir -p /tmp/vyra-site
          printf '<!doctype html><title>sse</title>%.0s' $(seq 1 40) > /tmp/vyra-site/index.html
          docker run -d --name vyra-sse --network host --add-host api:127.0.0.1 -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v /tmp/vyra-site:/app:ro caddy:2-alpine
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1/ && break || sleep 1; done

          stream() {
            curl -sS -N --max-time 6 -H 'Accept: text/event-stream' -H "Accept-Encoding: $1" -o /dev/null -w '%{http_code}' "http://127.0.0.1/api/overlay-access/T0KEN/events/stream" || true
          }
          GZIP=$(stream 'gzip, deflate, br, zstd')
          IDENT=$(stream 'identity')
          ENC=$(curl -sSI -H 'Accept-Encoding: gzip' http://127.0.0.1/index.html | tr -d '\r' | grep -i '^content-encoding:' || true)

          docker logs vyra-sse 2>&1 | tail -5 || true
          docker rm -f vyra-sse > /dev/null
          kill $STUB_PID 2>/dev/null || true

          echo "gzip=$GZIP identity=$IDENT statisk=${ENC:-ingen}"
          if [ "$IDENT" != "200" ]; then echo 'FEL: strommen svarar inte ens utan komprimering'; exit 1; fi
          if [ "$GZIP" != "200" ]; then echo 'FEL: strommen buffras nar klienten ber om gzip'; exit 1; fi
          case "$ENC" in *gzip*) : ;; *) echo 'FEL: komprimeringen slutade fungera for vanliga filer'; exit 1 ;; esac

  test-tiktok-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiktok-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tiktok-bridge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  # Sanningens karta over widgetkatalogen, regenererad vid varje push till main — alltsa vid varje
  # deploy, eftersom Railway bygger pa main.
  #
  # Kartan genereras ur den KORANDE katalogen i en riktig webblasare, inte ur kallkoden. Det ar hela
  # poangen: rubriker som pastod fel antal, knappar utan katalognyckel och tva sektioner som aldrig
  # byggdes sag alla korrekta ut i koden.
  #
  # Kor bara pa push till main, inte pa pull requests: en PR-gren ska inte fa en commit tillbaka i
  # ansiktet mitt under granskning. Pushar gjorda med GITHUB_TOKEN startar inga nya workflows, sa
  # jobbet kan inte trigga sig sjalvt.
  katalogkarta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      # ubuntu-latest levereras med Google Chrome; playwright-core startar den utan egen
      # nedladdning. Hittas ingen webblasare avbryter generatorn hellre an skriver en halvsann
      # karta — darfor far steget falla.
      - name: 'Generera kartan'
        run: npm run karta

      - name: 'Committa om nagot andrats'
        run: |
          if [ -z "$(git status --porcelain docs/katalogkarta.md)" ]; then
            echo 'kartan ar oforandrad'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/katalogkarta.md
          git commit -m 'Uppdatera sanningens karta [skip ci]'
          git push
