<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA · Widget-testsida</title>
<style>
  html,body{margin:0;background:#0b0614;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100%}
  header{padding:24px 28px 4px}
  h1{margin:0 0 4px;font-size:22px}
  header>p{margin:0;color:#b9a6dd;font-size:14px}

  section.widget-block{border-top:1px solid #241a38;padding-bottom:6px}
  section.widget-block h2{margin:0;padding:16px 28px 4px;font-size:16px}
  section.widget-block .file-path{padding:0 28px;margin:0 0 10px;font-size:12px;color:#7a6a9e;font-family:ui-monospace,monospace}

  #controls,.controls{display:flex;flex-wrap:wrap;gap:10px;padding:0 28px 16px}
  button{
    appearance:none;border:1px solid #8d3cff;background:rgba(141,60,255,.12);color:#fff;
    padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
  }
  button:hover{background:rgba(141,60,255,.28)}
  button:active{transform:translateY(1px)}

  .stage{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid #241a38}
  .stage.stage-single{grid-template-columns:1fr}
  .pane{position:relative;display:flex;flex-direction:column;min-width:0}
  .pane+.pane{border-left:1px solid #241a38}
  .pane .pane-label{
    padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:#d9c9ff;background:#140b22;
  }
  .pane iframe{
    flex:1;border:0;width:100%;
    /* Checkerboard so each widget's real transparent background is visible, same trick OBS's
       own preview uses to show through an alpha channel. */
    background-image:
      linear-gradient(45deg,#1c1330 25%,transparent 25%),
      linear-gradient(-45deg,#1c1330 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#1c1330 75%),
      linear-gradient(-45deg,transparent 75%,#1c1330 75%);
    background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;
    background-color:#241a38;
  }
</style>
</head>
<body>
<header>
  <h1>VYRA Widget-testsida</h1>
  <p>Triggar test-events lokalt i varje widgets båda varianter samtidigt — ingen backend eller inloggning krävs.</p>
</header>

<main id="widget-blocks"></main>

<script>
(function(){
  'use strict';

  const NAMES=['StreamFan92','LunaLive','KingOfChat','Sparkle_TT','NightOwl','MiraDances'];
  const GIFTS=[{giftName:'Rose',value:50},{giftName:'Lion',value:5000},{giftName:'Galaxy',value:25000}];

  function randomName(){return NAMES[Math.floor(Math.random()*NAMES.length)]}
  function baseEvent(type,overrides={}){
    return{id:`test-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,type,at:Date.now(),...overrides};
  }

  // Shared by every goal theme. The events a theme's ?type= does not match are deliberately
  // included so the buttons also prove the filtering holds instead of only moving the bar.
  const GOAL_BUTTONS=[
    {label:'👤 +1 följare',event:()=>baseEvent('follow',{username:randomName()})},
    {label:'👥 +10 följare',events:()=>Array.from({length:10},()=>baseEvent('follow',{username:randomName()}))},
    {label:'❤️ +250 likes',event:()=>baseEvent('like',{username:randomName(),count:250})},
    {label:'🔁 +1 share',event:()=>baseEvent('share',{username:randomName()})},
    {label:'💎 Gåva 900 (räknas bara vid type=gifts/diamonds)',event:()=>baseEvent('gift',{username:randomName(),giftName:'Lion',value:900})},
    {label:'↺ Nollställ',reset:true}
  ];

  // One config entry per widget — the section markup, buttons, and both variant iframes are all
  // generated from this list instead of hand-duplicating near-identical HTML five times.
  const WIDGETS=[
    {
      key:'gift-alert',title:'Gift Alert',file:'widgets/gift-alert.html',hook:'VyraGiftAlertWidget',height:'230px',
      buttons:[
        {label:'🌹 Rose — 50 diamonds',event:()=>baseEvent('gift',{username:randomName(),giftName:'Rose',value:50,count:1})},
        {label:'🦁 Lion — 5 000 diamonds',event:()=>baseEvent('gift',{username:randomName(),giftName:'Lion',value:5000,count:1})},
        {label:'🌌 Galaxy — 25 000 diamonds',event:()=>baseEvent('gift',{username:randomName(),giftName:'Galaxy',value:25000,count:1})},
        {label:'🎲 Slumpad gåva',event:()=>{const g=GIFTS[Math.floor(Math.random()*GIFTS.length)];return baseEvent('gift',{username:randomName(),giftName:g.giftName,value:Math.round(g.value*(0.5+Math.random())),count:1})}}
      ]
    },
    {
      key:'follow-alert',title:'Follow Alert',file:'widgets/follow-alert.html',hook:'VyraFollowAlertWidget',height:'150px',
      buttons:[
        {label:'👤 Ny följare',event:()=>baseEvent('follow',{username:randomName()})},
        {label:'👥 3 följare i rad',events:()=>[0,1,2].map(()=>baseEvent('follow',{username:randomName()}))}
      ]
    },
    {
      key:'like-counter',title:'Like Counter',file:'widgets/like-counter.html',hook:'VyraLikeCounterWidget',height:'120px',
      state:{total:0},
      buttons:[
        {label:'+100 likes',event:(state)=>{state.total+=100;return baseEvent('like',{value:state.total,count:100})}},
        {label:'+1 000 likes',event:(state)=>{state.total+=1000;return baseEvent('like',{value:state.total,count:1000})}},
        {label:'↺ Nollställ',reset:true}
      ]
    },
    {
      key:'top-gifters',title:'Top Gifters',file:'widgets/top-gifters.html',hook:'VyraTopGiftersWidget',height:'320px',
      buttons:[
        {label:'🎲 Slumpad gåva till topplistan',event:()=>{const g=GIFTS[Math.floor(Math.random()*GIFTS.length)];return baseEvent('gift',{username:randomName(),giftName:g.giftName,value:Math.round(g.value*(0.3+Math.random()))})}},
        {label:'💎 Stor gåva till "StreamFan92"',event:()=>baseEvent('gift',{username:'StreamFan92',giftName:'Galaxy',value:40000})},
        {label:'↺ Nollställ topplistan',reset:true}
      ]
    },
    {
      key:'combo-counter',title:'Combo Counter',file:'widgets/combo-counter.html',hook:'VyraComboCounterWidget',height:'220px',
      buttons:[
        {label:'5x COMBO',event:()=>baseEvent('gift',{username:randomName(),giftName:'Rose',count:5,value:250})},
        {label:'10x MEGA COMBO',event:()=>baseEvent('gift',{username:randomName(),giftName:'Rose',count:10,value:500})},
        {label:'20x LEGENDARY',event:()=>baseEvent('gift',{username:randomName(),giftName:'Rose',count:20,value:1000})},
        {label:'35x LEGENDARY+',event:()=>baseEvent('gift',{username:randomName(),giftName:'Rose',count:35,value:1750})}
      ]
    },
    {
      key:'goal-tracker',title:'Goal Tracker',file:'widgets/goal-tracker.html',hook:'VyraGoalTrackerWidget',height:'140px',
      query:'goal=500&type=diamonds',
      buttons:[
        {label:'+50 diamonds',event:()=>baseEvent('gift',{username:randomName(),giftName:'Rose',value:50})},
        {label:'+200 diamonds',event:()=>baseEvent('gift',{username:randomName(),giftName:'Lion',value:200})},
        {label:'🎯 Hoppa till målet',event:()=>baseEvent('gift',{username:randomName(),giftName:'Galaxy',value:500})},
        {label:'↺ Nollställ',reset:true}
      ]
    },
    {
      key:'diamond-counter',title:'Diamond Counter',file:'widgets/diamond-counter.html',hook:'VyraDiamondCounterWidget',height:'140px',
      buttons:[
        {label:'+50 diamonds',event:()=>baseEvent('gift',{username:randomName(),giftName:'Rose',value:50})},
        {label:'+450 (korsar 100 & når 500)',event:()=>baseEvent('gift',{username:randomName(),giftName:'Lion',value:450})},
        {label:'+4 500 (korsar 1000 & 5000)',event:()=>baseEvent('gift',{username:randomName(),giftName:'Galaxy',value:4500})},
        {label:'↺ Nollställ',reset:true}
      ]
    },
    {
      key:'vip-zone',title:'VIP Zone',file:'widgets/vip-zone.html',hook:'VyraVipZoneWidget',height:'380px',
      buttons:[
        {label:'💎 Gåva (30 diamonds) till slumpad',event:()=>baseEvent('gift',{username:randomName(),giftName:'Rose',value:30})},
        {label:'💎 Stor gåva (1 200) till "StreamFan92"',event:()=>baseEvent('gift',{username:'StreamFan92',giftName:'Diamond',value:1200})},
        {label:'👤 Follow (+50p) till "LunaLive"',event:()=>baseEvent('follow',{username:'LunaLive'})},
        {label:'🔁 Share (+20p) till "KingOfChat"',event:()=>baseEvent('share',{username:'KingOfChat'})},
        {label:'❤️ 500 likes (+50p) till "NightOwl"',event:()=>baseEvent('like',{username:'NightOwl',count:500})},
        {label:'↺ Nollställ',reset:true}
      ]
    },
    {
      key:'welcome-viewer',title:'Welcome Viewer',file:'widgets/welcome-viewer.html',hook:'VyraWelcomeViewerWidget',height:'150px',
      buttons:[
        {label:'👋 Ny tittare ansluter',event:()=>baseEvent('viewer',{username:randomName()})},
        {label:'📊 Rumsuppdatering (ska INTE visas)',event:()=>baseEvent('viewer',{count:1234})}
      ]
    },
    {
      key:'screen-takeover',title:'Screen Takeover',file:'widgets/screen-takeover.html',hook:'VyraScreenTakeoverWidget',height:'320px',
      buttons:[
        {label:'✨ Mega gift — 150 diamonds',event:()=>baseEvent('gift',{username:randomName(),giftName:'Lion',value:150})},
        {label:'🌌 Ultra mega — 10 000 diamonds',event:()=>baseEvent('gift',{username:randomName(),giftName:'Galaxy',value:10000})},
        {label:'🌹 Vanlig gåva — 50 diamonds (ska INTE trigga)',event:()=>baseEvent('gift',{username:randomName(),giftName:'Rose',value:50})}
      ]
    },
    {
      key:'crystal-garden',title:'Crystal Garden (Gift Campaign)',file:'widgets/crystal-garden.html',hook:'VyraCrystalGardenWidget',height:'440px',
      noVariant:true,
      buttons:[
        {label:'🌹 +5 Rose (→ Rose Quartz)',event:()=>baseEvent('gift',{username:randomName(),giftName:'Rose',count:5})},
        {label:'💜 +3 Perfume (→ Amethyst)',event:()=>baseEvent('gift',{username:randomName(),giftName:'Perfume',count:3})},
        {label:'💎 +2 Galaxy (→ Sapphire)',event:()=>baseEvent('gift',{username:randomName(),giftName:'Galaxy',count:2})},
        {label:'🦁 +1 Lion (→ Golden Lotus)',event:()=>baseEvent('gift',{username:randomName(),giftName:'Lion',count:1})},
        {label:'↺ Nollställ',reset:true}
      ]
    },
    // Goal themes: one file per design, with the goal type as a URL parameter — so the same file
    // serves follower/like/share/gift/diamond goals, in either orientation. Each theme therefore
    // gets two sections here rather than a cyber/celestial variant pair.
    ...[
      ['crystal-path','1 · Crystal Path'],
      ['neon-pulse','4 · Neon Pulse']
    ].flatMap(([slug,title])=>[
      {
        key:'goal-'+slug,title:'Goal '+title+' — liggande',file:'widgets/goal-'+slug+'.html',
        hook:'VyraGoalWidget',height:'320px',noVariant:true,
        query:'type=follows&goal=1000',buttons:GOAL_BUTTONS
      },
      {
        key:'goal-'+slug+'-vertical',title:'Goal '+title+' — stående',file:'widgets/goal-'+slug+'.html',
        hook:'VyraGoalWidget',height:'820px',noVariant:true,
        query:'type=likes&goal=50000&orientation=vertical',buttons:GOAL_BUTTONS
      }
    ]),
    // Last-X alerts: one file serves all four types via ?type= — each section pins a different
    // entrance so all four motion variants are visible at once. The "3 snabba" buttons prove the
    // coalescing: mid-hold events swap the card content in place instead of queueing a backlog.
    ...[
      ['gifter','Last Gifter','slide-left',[
        {label:'🌹 Rose ×1',event:()=>baseEvent('gift',{username:randomName(),giftName:'Rose',count:1})},
        {label:'🌌 Galaxy ×5',event:()=>baseEvent('gift',{username:randomName(),giftName:'Galaxy',count:5})},
        {label:'⚡ 3 snabba gåvor (coalescing)',events:()=>GIFTS.map(g=>baseEvent('gift',{username:randomName(),giftName:g.giftName,count:1}))}
      ]],
      ['liker','Last Liker','slide-right',[
        {label:'❤️ 250 likes',event:()=>baseEvent('likes',{username:randomName(),count:250})},
        {label:'❤️ 1 000 likes',event:()=>baseEvent('likes',{username:randomName(),count:1000})},
        {label:'⚡ 3 snabba likes (coalescing)',events:()=>[50,120,400].map(count=>baseEvent('likes',{username:randomName(),count}))}
      ]],
      ['sharer','Last Sharer','pop',[
        {label:'🔁 Delar liven',event:()=>baseEvent('share',{username:randomName()})},
        {label:'⚡ 3 snabba shares (coalescing)',events:()=>[0,1,2].map(()=>baseEvent('share',{username:randomName()}))}
      ]],
      ['subscriber','Last Subscriber','fade',[
        {label:'⭐ Ny subscriber',event:()=>baseEvent('subscribe',{username:randomName()})},
        {label:'👋 Member/room join (ska INTE visas)',event:()=>baseEvent('member',{username:randomName()})}
      ]]
    ].map(([slug,title,entrance,buttons])=>({
      key:'last-x-'+slug,title:'Last-X · '+title+' — entrance='+entrance,
      file:'widgets/last-x-alerts.html',hook:'VyraLastXWidget',height:'180px',
      noVariant:true,query:'type='+slug+'&entrance='+entrance,buttons
    })),
    {
      key:'battle-mvp',title:'Battle MVP (9s hyllningssekvens)',file:'widgets/battle-mvp.html',hook:'VyraBattleMvpWidget',height:'520px',
      noVariant:true,
      buttons:[
        {label:'🏆 Kör hyllning (StreamFan92 · 15 000p)',event:()=>({username:'StreamFan92',score:15000})},
        {label:'🏆 Kör hyllning (anpassad text)',event:()=>({username:'MiraDances',thanks:'TACK SÅ MYCKET',subtitle:'FÖR ATT DU STÖTTAR STREAMEN',label:'TOP SUPPORTER',score:8420})}
      ]
    }
  ];

  const container=document.getElementById('widget-blocks');
  const frameRefs={}; // key -> {cyber, celestial}

  for(const widget of WIDGETS){
    const extraQuery=widget.query?`&${widget.query}`:'';
    const section=document.createElement('section');
    section.className='widget-block';
    if(widget.noVariant){
      // Widgets with their own fixed design (no cyber/celestial toggle) get a single full-width
      // preview pane instead of the usual side-by-side variant comparison.
      section.innerHTML=`
        <h2>${widget.title}</h2>
        <p class="file-path">public/${widget.file}${widget.query?' ?'+widget.query:''}</p>
        <div class="controls"></div>
        <div class="stage stage-single" style="height:${widget.height}">
          <div class="pane">
            <div class="pane-label">förhandsgranskning</div>
            <iframe data-slot="single" src="${widget.file}${widget.query?'?'+widget.query:''}" title="${widget.title}"></iframe>
          </div>
        </div>`;
      container.append(section);
      frameRefs[widget.key]={single:section.querySelector('iframe[data-slot="single"]')};
    }else{
      section.innerHTML=`
        <h2>${widget.title}</h2>
        <p class="file-path">public/${widget.file}${widget.query?' ?'+widget.query:''}</p>
        <div class="controls"></div>
        <div class="stage" style="height:${widget.height}">
          <div class="pane">
            <div class="pane-label">variant=cyber</div>
            <iframe data-variant="cyber" src="${widget.file}?variant=cyber${extraQuery}" title="${widget.title} — cyber"></iframe>
          </div>
          <div class="pane">
            <div class="pane-label">variant=celestial</div>
            <iframe data-variant="celestial" src="${widget.file}?variant=celestial${extraQuery}" title="${widget.title} — celestial"></iframe>
          </div>
        </div>`;
      container.append(section);
      frameRefs[widget.key]={
        cyber:section.querySelector('iframe[data-variant="cyber"]'),
        celestial:section.querySelector('iframe[data-variant="celestial"]')
      };
    }

    const controlsEl=section.querySelector('.controls');
    for(const buttonDef of widget.buttons){
      const button=document.createElement('button');
      button.textContent=buttonDef.label;
      button.addEventListener('click',()=>fireWidget(widget,buttonDef));
      controlsEl.append(button);
    }
  }

  function framesFor(key){
    return Object.values(frameRefs[key]).filter(f=>f?.contentWindow);
  }

  function fireWidget(widget,buttonDef){
    const frames=framesFor(widget.key);
    if(buttonDef.reset){
      for(const frame of frames)frame.contentWindow[widget.hook]?.reset?.();
      return;
    }
    // Build the event(s) exactly ONCE, then replay the identical object(s) into every frame —
    // calling buttonDef.event() separately per frame would double-apply any stateful side effect
    // (e.g. like-counter's running total) and make the two variants drift apart from each other.
    const events=buttonDef.events?buttonDef.events():[buttonDef.event(widget.state)];
    for(const frame of frames){
      const hook=frame.contentWindow[widget.hook];
      if(!hook){console.warn('[VyraWidgetTest] hooken är inte redo än:',widget.hook);continue}
      events.forEach(event=>hook.render(event));
    }
  }
})();
</script>
</body>
</html>
