<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA · Battle MVP Premium</title>
<!--
  Premium Battle MVP tribute.

  Splits the work where each medium is strongest: the EMBLEM is the user's own rendered artwork
  (public/widgets/assets/battle-mvp/*.png), while every glow, ray, particle and letterform is drawn
  in CSS. That is deliberate — the mock-up's soft halo could not be extracted from its painted
  checkerboard without visible artefacts, so instead of recovering a glow it is rebuilt here, which
  is resolution-independent, tintable per theme, and cannot band or checker.

  Everything is editable via query params:
    theme        crystal-tribute | royal-ascension | diamond-throne | celestial-honor |
                 emerald-legacy | dragon-crest | velvet-spotlight
    username, label, subtitle, thanks, score, scoreUnit   (text; scoreUnit e.g. POÄNG / COINS)
    showThanks, showLabel, showSubtitle, showScore         (0/1 — hide any line)
    nameSize, labelSize, subSize, scoreSize, emblemWidth   (px)
    accent, glow                                            (colour, glow radius px)
    duration     tribute hold in ms (default 5000) -> total = 4000 + duration
    profile      photo URL
    auto=1       play immediately (for preview)
-->
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%;width:100%}
  body{display:flex;align-items:center;justify-content:center;height:100vh;
       font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif}

  #stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
         align-items:center;justify-content:center}

  /* ---------- Phase 1 · Ljus ---------- */
  #rays{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
  #stage.p1 #rays,#stage.p2 #rays,#stage.p3 #rays{opacity:1}
  #stage.p4 #rays{opacity:0;transition:opacity 1s ease}
  .ray{
    position:absolute;left:50%;top:50%;width:2px;height:62vh;transform-origin:50% 100%;
    background:linear-gradient(0deg,var(--accent) 0%,var(--accent2) 40%,transparent 88%);
    filter:blur(1px);opacity:0;
    transform:translate(-50%,-100%) rotate(var(--a)) scaleY(0);
    animation:ray 1.1s cubic-bezier(.2,.85,.2,1) forwards var(--d,0s);
  }
  @keyframes ray{0%{opacity:0;transform:translate(-50%,-100%) rotate(var(--a)) scaleY(0)}
                 55%{opacity:.9}100%{opacity:.5;transform:translate(-50%,-100%) rotate(var(--a)) scaleY(1)}}
  /* Volumetric core: three stacked blurred discs read as real bloom rather than a flat dot. */
  #core{position:absolute;left:50%;top:50%;width:1px;height:1px}
  #core i{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%) scale(0);
          animation:core .9s cubic-bezier(.2,.9,.2,1) forwards}
  #core i:nth-child(1){width:26px;height:26px;background:#fff;filter:blur(6px)}
  #core i:nth-child(2){width:130px;height:130px;background:var(--accent);filter:blur(34px);opacity:.85}
  #core i:nth-child(3){width:320px;height:320px;background:var(--accent2);filter:blur(80px);opacity:.5}
  @keyframes core{to{transform:translate(-50%,-50%) scale(1)}}

  /* ---------- Phase 2 · Entré ---------- */
  #emblem{
    position:relative;width:var(--emblem-w,40rem);
    opacity:0;transform:scale(.5) translateY(18px);filter:blur(6px);
  }
  #stage.p2 #emblem,#stage.p3 #emblem{
    opacity:1;transform:none;filter:blur(0);
    transition:opacity .9s cubic-bezier(.2,.9,.2,1),transform 1s cubic-bezier(.2,1.3,.3,1),filter .7s ease;
  }
  #stage.p4 #emblem{opacity:0;transform:scale(1.1) translateY(-22px);filter:blur(4px);
                    transition:opacity 1s ease,transform 1s ease,filter 1s ease}

  /* The rebuilt halo — layered drop-shadows behind the artwork, so it scales cleanly. */
  #emblem-art{
    position:relative;display:block;width:100%;height:auto;z-index:2;
    filter:drop-shadow(0 0 calc(var(--glow) * .5) var(--accent))
           drop-shadow(0 0 var(--glow) var(--accent2))
           drop-shadow(0 6px 14px rgba(0,0,0,.65));
    animation:shimmer 6s ease-in-out infinite;
  }
  @keyframes shimmer{0%,100%{filter:drop-shadow(0 0 calc(var(--glow) * .45) var(--accent))
                                     drop-shadow(0 0 calc(var(--glow) * .85) var(--accent2))
                                     drop-shadow(0 6px 14px rgba(0,0,0,.65))}
                     50%{filter:drop-shadow(0 0 calc(var(--glow) * .7) var(--accent))
                                drop-shadow(0 0 calc(var(--glow) * 1.25) var(--accent2))
                                drop-shadow(0 6px 14px rgba(0,0,0,.65))}}

  /* Photo sits UNDER the emblem so the artwork's own ring overlaps its edge. */
  #photo{
    position:absolute;z-index:1;border-radius:50%;overflow:hidden;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 32%,#2b2340,#140d22 75%);
    box-shadow:inset 0 0 3rem rgba(0,0,0,.85), 0 0 2rem var(--accent);
  }
  #photo img{width:100%;height:100%;object-fit:cover;display:block}
  #photo svg{width:100%;height:100%;padding:16%;box-sizing:border-box;fill:#4a4266}
  /* Light wash across the portrait so it reads as lit by the emblem, not pasted behind it. */
  #photo::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 45%)}

  /* ---------- Phase 3 · Hyllning ---------- */
  #text{position:relative;z-index:3;margin-top:-2.5%;text-align:center;width:max-content;max-width:94vw}
  #text>*{opacity:0;transform:translateY(18px) scale(.97);
          transition:opacity .6s ease,transform .7s cubic-bezier(.2,.85,.2,1)}
  #stage.p3 #thanks   {opacity:1;transform:none;transition-delay:.05s}
  #stage.p3 #labelWrap{opacity:1;transform:none;transition-delay:.18s}
  #stage.p3 #name     {opacity:1;transform:none;transition-delay:.40s}
  #stage.p3 #sub      {opacity:1;transform:none;transition-delay:.68s}
  #stage.p3 #scoreWrap{opacity:1;transform:none;transition-delay:.92s}
  #stage.p4 #text>*{opacity:0;transform:translateY(-14px);transition:opacity .75s ease,transform .75s ease}
  .hidden{display:none !important}

  #thanks{font-size:1.2rem;letter-spacing:.55em;text-transform:uppercase;color:var(--soft);
          text-shadow:0 0 1.2rem var(--accent);margin-bottom:.45rem}

  /* Engraved metal lettering: gradient fill for the metal, stacked shadows for the bevel. */
  .metal{
    background:linear-gradient(180deg,#fffdf4 0%,#ffeec2 26%,#e8bf72 50%,#a97a2c 62%,
                               #f3d693 78%,#fff8e0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 1px 0 rgba(255,255,255,.22), 0 -1px 0 rgba(0,0,0,.5), 0 3px 6px rgba(0,0,0,.75);
  }
  #labelWrap{display:inline-flex;align-items:center;gap:.85rem;padding:.2rem 1.6rem;border-radius:.2rem;
    background:linear-gradient(180deg,var(--banner1),var(--banner2));
    box-shadow:0 .35rem 1.4rem rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14);
    border-top:1px solid rgba(255,225,160,.6);border-bottom:1px solid rgba(255,225,160,.45)}
  #labelWrap::before,#labelWrap::after{content:'';width:1.5rem;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,224,160,.9))}
  #labelWrap::after{background:linear-gradient(270deg,transparent,rgba(255,224,160,.9))}
  #label{font-size:var(--label-size,1.6rem);font-weight:700;letter-spacing:.14em;text-transform:uppercase}

  /* The person owns the scene: biggest, brightest, with its own bloom. */
  #name{font-size:var(--name-size,4rem);font-weight:700;line-height:1.02;margin:.2rem 0 .12rem;
        filter:drop-shadow(0 0 1.8rem var(--accent)) drop-shadow(0 0 3.4rem var(--accent2))}
  #sub{font-size:var(--sub-size,1.05rem);letter-spacing:.2em;text-transform:uppercase;
       color:#f6efff;text-shadow:0 2px 6px rgba(0,0,0,.9);margin-bottom:.7rem}

  #scoreWrap{display:inline-flex;align-items:center;gap:.6rem;padding:.24rem 1.3rem;border-radius:999px;
    background:linear-gradient(180deg,rgba(14,8,22,.94),rgba(32,18,48,.94));
    border:1px solid rgba(226,186,110,.75);box-shadow:0 .25rem .9rem rgba(0,0,0,.55)}
  #scoreWrap .gem{width:.5rem;height:.5rem;background:var(--accent);transform:rotate(45deg);
                  box-shadow:0 0 .5rem var(--accent)}
  #score{font-size:var(--score-size,1rem);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
         color:#ffeec6;font-variant-numeric:tabular-nums}

  /* ---------- Phase 4 · Avslut ---------- */
  #motes{position:absolute;inset:0;pointer-events:none;z-index:4}
  .mote{position:absolute;bottom:42%;border-radius:50%;opacity:0;
    background:radial-gradient(circle,#fff8e8 0 35%,var(--accent) 60%,transparent 72%);
    animation:mote var(--md,1.6s) cubic-bezier(.25,.6,.3,1) forwards var(--mdl,0s)}
  @keyframes mote{0%{opacity:0;transform:translate(0,0) scale(.3)}
                  12%{opacity:1}
                  100%{opacity:0;transform:translate(var(--mx,0),-32rem) scale(1.15)}}
</style>
</head>
<body>
  <div id="stage">
    <div id="rays"></div>
    <div id="core"><i></i><i></i><i></i></div>
    <div id="emblem">
      <div id="photo"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-9 2.2-9 5v3h18v-3c0-2.8-4.6-5-9-5Z"/></svg></div>
      <img id="emblem-art" alt="">
    </div>
    <div id="text">
      <div id="thanks">TACK</div>
      <div><span id="labelWrap"><span id="label" class="metal">BATTLE MVP</span></span></div>
      <div id="name" class="metal">@ANVÄNDARNAMN</div>
      <div id="sub">DU GJORDE SKILLNADEN</div>
      <div><span id="scoreWrap"><i class="gem"></i><span id="score">15 000 POÄNG</span><i class="gem"></i></span></div>
    </div>
    <div id="motes"></div>
  </div>

<script src="base-widget.js"></script>
<script>
(function(){
  'use strict';
  const P = new URLSearchParams(location.search);
  const num = (v,f)=> (v===null||v===''?f:(Number.isFinite(+v)?+v:f));
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const on = (v,def)=> v===null? def : !(v==='0'||v==='false');

  // Palettes tuned to each emblem's own material so the rebuilt glow matches its artwork.
  const THEMES = {
    'crystal-tribute' : {accent:'#c9a0ff', accent2:'#f6c76b', soft:'#e2d4ff', banner1:'#4a2170', banner2:'#26123f'},
    'royal-ascension' : {accent:'#ffd98a', accent2:'#f0a6d8', soft:'#f7e6c4', banner1:'#48206e', banner2:'#241038'},
    'diamond-throne'  : {accent:'#bfe4ff', accent2:'#8fd0ff', soft:'#e2f1ff', banner1:'#1d3856', banner2:'#0c1c2e'},
    'celestial-honor' : {accent:'#cbd8ff', accent2:'#9a7bff', soft:'#d8e0ff', banner1:'#232a5c', banner2:'#101336'},
    'emerald-legacy'  : {accent:'#7cf0bb', accent2:'#f6d68e', soft:'#cdf6e2', banner1:'#0f5540', banner2:'#06301e'},
    'dragon-crest'    : {accent:'#ffcf7f', accent2:'#ff7a6a', soft:'#f8dcc8', banner1:'#7a1420', banner2:'#3f0a11'},
    'velvet-spotlight': {accent:'#ffe0b0', accent2:'#ff8fa0', soft:'#f8dbe0', banner1:'#7d1226', banner2:'#420913'}
  };
  const themeName = THEMES[P.get('theme')] ? P.get('theme') : 'crystal-tribute';
  const theme = THEMES[themeName];

  const S = document.documentElement.style;
  S.setProperty('--accent',  P.get('accent') || theme.accent);
  S.setProperty('--accent2', theme.accent2);
  S.setProperty('--soft',    theme.soft);
  S.setProperty('--banner1', theme.banner1);
  S.setProperty('--banner2', theme.banner2);
  S.setProperty('--glow', clamp(num(P.get('glow'),46),0,140)+'px');
  S.setProperty('--emblem-w', clamp(num(P.get('emblemWidth'),640),240,1600)/16+'rem');
  S.setProperty('--name-size',  clamp(num(P.get('nameSize'),64),18,160)/16+'rem');
  S.setProperty('--label-size', clamp(num(P.get('labelSize'),26),10,64)/16+'rem');
  S.setProperty('--sub-size',   clamp(num(P.get('subSize'),17),8,44)/16+'rem');
  S.setProperty('--score-size', clamp(num(P.get('scoreSize'),16),8,44)/16+'rem');

  const stage=document.getElementById('stage');
  const art=document.getElementById('emblem-art');
  const photo=document.getElementById('photo');
  const raysEl=document.getElementById('rays');
  const motesEl=document.getElementById('motes');

  const hold = clamp(num(P.get('duration'),5000),1500,30000);
  const T = {p1:0, p2:1100, p3:3000, p4:3000+hold, done:3000+hold+1100};

  // Per-emblem portrait geometry ships with the artwork, so the photo lands inside the ring for
  // whichever emblem is selected without hand-tuning here.
  let geom=null;
  async function loadEmblem(){
    art.src = `assets/battle-mvp/${themeName}.png`;
    try{
      const all = await (await fetch('assets/battle-mvp/meta.json')).json();
      geom = all.find(m=>m.name===themeName) || null;
    }catch(e){ VyraWidget.warn('kunde inte läsa emblem-meta',e) }
    placePhoto();
  }
  function placePhoto(){
    if(!geom) return;
    photo.style.left  = (geom.portrait.cx*100)+'%';
    photo.style.top   = (geom.portrait.cy*100)+'%';
    photo.style.width = (geom.portrait.r*2*100)+'%';
    photo.style.aspectRatio='1';
  }

  function buildRays(){
    let h='';
    for(let i=0;i<10;i++) h+=`<div class="ray" style="--a:${i*36}deg;--d:${(Math.random()*.25).toFixed(2)}s"></div>`;
    raysEl.innerHTML=h;
  }
  function buildMotes(){
    let h='';
    for(let i=0;i<38;i++){
      const s=(2.5+Math.random()*6).toFixed(1);
      h+=`<div class="mote" style="width:${s}px;height:${s}px;left:${(42+Math.random()*16).toFixed(1)}%;`+
         `--mx:${(Math.random()*220-110).toFixed(0)}px;--md:${(1.3+Math.random()*1).toFixed(2)}s;`+
         `--mdl:${(Math.random()*.7).toFixed(2)}s"></div>`;
    }
    motesEl.innerHTML=h;
  }

  function applyText(d){
    const set=(id,val)=>{document.getElementById(id).textContent=val};
    set('thanks', d.thanks ?? P.get('thanks') ?? 'TACK');
    set('label',  d.label  ?? P.get('label')  ?? 'BATTLE MVP');
    set('name',   d.username ? '@'+String(d.username).replace(/^@/,'') : '@ANVÄNDARNAMN');
    set('sub',    d.subtitle ?? P.get('subtitle') ?? 'DU GJORDE SKILLNADEN');
    const raw = d.score ?? P.get('score') ?? 15000;
    const n=Number(raw);
    const unit = d.scoreUnit ?? P.get('scoreUnit') ?? 'POÄNG';
    set('score', (Number.isFinite(n)? n.toLocaleString('sv-SE') : raw)+' '+unit);

    // Any line can be switched off entirely — score included, per the brief.
    document.getElementById('thanks').classList.toggle('hidden', !on(P.get('showThanks'),true));
    document.getElementById('labelWrap').parentElement.classList.toggle('hidden', !on(P.get('showLabel'),true));
    document.getElementById('sub').classList.toggle('hidden', !on(P.get('showSubtitle'),true));
    document.getElementById('scoreWrap').parentElement.classList.toggle('hidden', !on(P.get('showScore'),true));

    photo.querySelector('img')?.remove();
    const src = d.profileUrl || P.get('profile');
    if(src){
      const img=document.createElement('img');
      img.src=src; img.alt='';
      img.onerror=()=>img.remove();       // falls back to the silhouette underneath
      photo.append(img);
    }
  }

  let playing=false; const queue=[];
  function play(d){
    playing=true;
    applyText(d); buildRays(); motesEl.innerHTML='';
    stage.className=''; void stage.offsetWidth;
    setTimeout(()=>stage.classList.add('p1'), T.p1);
    setTimeout(()=>stage.classList.add('p2'), T.p2);
    setTimeout(()=>stage.classList.add('p3'), T.p3);
    setTimeout(()=>{stage.classList.add('p4'); buildMotes()}, T.p4);
    setTimeout(()=>{
      stage.className=''; motesEl.innerHTML=''; raysEl.innerHTML='';
      playing=false;
      const nxt=queue.shift(); if(nxt) play(nxt);
    }, T.done);
  }
  function trigger(d){ if(!d) return; if(playing){queue.push(d); return} play(d) }

  // Real Battle-MVP path: gift value accumulates per user, and the leader can be crowned on demand
  // or when a battle ends (opt-in, since battleStatus wording comes from an unofficial library).
  const contrib=new Map();
  function recordGift(e){
    const k=String(e.userId||e.username||'').toLowerCase(); if(!k) return;
    const p=contrib.get(k)||{username:e.username||e.userId,score:0,profileUrl:e.profileUrl};
    p.score+=Number(e.value)||0; if(e.profileUrl)p.profileUrl=e.profileUrl;
    contrib.set(k,p);
  }
  function triggerTop(extra){
    let best=null; for(const v of contrib.values()) if(!best||v.score>best.score) best=v;
    if(!best){ VyraWidget.warn('Ingen gåvogivare registrerad — kan inte utse MVP.'); return false }
    trigger({username:best.username,score:Math.round(best.score),profileUrl:best.profileUrl,...(extra||{})});
    return true;
  }
  window.VyraBattleMvpWidget={render:trigger,trigger,triggerTopContributor:triggerTop,recordGift,
    contributions:()=>[...contrib.values()].sort((a,b)=>b.score-a.score),
    resetContributions:()=>contrib.clear(), theme:()=>themeName, themes:Object.keys(THEMES)};

  loadEmblem();
  const autoBattle = on(P.get('autoBattle'),false);
  const uid=P.get('uid');
  if(uid){
    VyraWidget.connect({uid,onEvent(e){
      if(!e) return;
      if(e.type==='gift') recordGift(e);
      if(autoBattle && e.type==='battle' && /end|finish|over|complete/i.test(String(e.battleStatus||''))) triggerTop();
    }});
  }else{
    VyraWidget.warn('Inget uid — ansluter inte till någon live-ström (förhandsgranskningsläge).');
  }
  if(on(P.get('auto'),false)) trigger({username:P.get('username')||'Användarnamn', score:P.get('score')||15000});
})();
</script>
</body>
</html>
