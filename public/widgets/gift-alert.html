<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA · Gift Alert</title>
<style>
  /* Transparent background is required for an OBS browser source — any opaque background here
     would show up as a solid box over the stream instead of just the alert card. */
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%}
  body{
    display:flex;align-items:flex-end;justify-content:center;
    height:100vh;font-family:'Segoe UI',system-ui,sans-serif;
  }

  /* ---- Variant themes — everything below reads only these custom properties, so adding a
     third variant later is just adding another [data-variant="..."] block, no other code changes. */
  :root{
    --accent-a:#8d3cff;--accent-b:#25e2ff;--text:#fff;--sub:#d9c9ff;
    --card-bg:linear-gradient(135deg,rgba(30,10,50,.92),rgba(10,6,30,.92));
    --glow:0 0 40px rgba(141,60,255,.55),0 0 80px rgba(37,226,255,.25);
    --diamond:#25e2ff;
  }
  html[data-variant="celestial"]{
    --accent-a:#f6c76b;--accent-b:#ffe9c2;--text:#fff8ec;--sub:#f0d9a8;
    --card-bg:linear-gradient(135deg,rgba(70,42,10,.92),rgba(40,20,4,.92));
    --glow:0 0 40px rgba(246,199,107,.55),0 0 80px rgba(255,233,194,.25);
    --diamond:#ffd98a;
  }

  #alert-card{
    position:relative;margin-bottom:6vh;min-width:360px;max-width:70vw;
    padding:18px 28px;border-radius:20px;
    background:var(--card-bg);
    border:1px solid color-mix(in srgb,var(--accent-a) 60%,transparent);
    box-shadow:var(--glow);
    display:flex;align-items:center;gap:18px;
    /* Only transform/opacity are animated — both are compositor-only properties, so this stays
       at a full 60 FPS even on modest OBS-host hardware, no layout/paint thrash. */
    opacity:0;transform:translateY(24px) scale(.94);
    will-change:transform,opacity;
    transition:opacity .32s cubic-bezier(.2,.8,.2,1),transform .32s cubic-bezier(.2,.8,.2,1);
  }
  #alert-card.show{opacity:1;transform:translateY(0) scale(1)}
  #alert-card.hide{opacity:0;transform:translateY(-16px) scale(.96);transition-duration:.28s}

  #alert-card::before{
    content:'';position:absolute;inset:0;border-radius:20px;padding:1px;
    background:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    opacity:.9;pointer-events:none;
  }

  #gift-icon{
    width:64px;height:64px;border-radius:16px;flex:none;
    background:radial-gradient(circle at 35% 30%,var(--accent-b),var(--accent-a));
    display:flex;align-items:center;justify-content:center;font-size:32px;
    box-shadow:0 0 24px color-mix(in srgb,var(--accent-a) 70%,transparent);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
  }

  #text{display:flex;flex-direction:column;gap:2px;min-width:0}
  #username{
    font-size:19px;font-weight:700;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  #gift-line{font-size:15px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #gift-name{color:var(--text);font-weight:600}
  #diamonds{
    display:flex;align-items:center;gap:6px;margin-top:2px;
    font-size:15px;font-weight:700;color:var(--diamond);
  }
  #diamonds svg{width:16px;height:16px;flex:none}
</style>
</head>
<body>
  <div id="alert-card" aria-hidden="true">
    <div id="gift-icon">🎁</div>
    <div id="text">
      <div id="username">—</div>
      <div id="gift-line">skickade <span id="gift-name">—</span></div>
      <div id="diamonds">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0l4 5-4 11L4 5z"/></svg>
        <span id="diamond-count">0</span>
      </div>
    </div>
  </div>

<script src="base-widget.js"></script>
<script>
(function(){
  'use strict';
  const params=VyraWidget.getParams();
  document.documentElement.dataset.variant=params.variant==='celestial'?'celestial':'cyber';

  const card=document.getElementById('alert-card');
  const els={
    username:document.getElementById('username'),
    giftName:document.getElementById('gift-name'),
    diamonds:document.getElementById('diamond-count')
  };

  const HOLD_MS=4200,FADE_OUT_MS=280;
  const queue=[];
  let showing=false;

  function formatDiamonds(n){
    n=Math.max(0,Math.round(Number(n)||0));
    return n.toLocaleString('sv-SE');
  }

  function playNext(){
    if(showing||!queue.length)return;
    showing=true;
    const gift=queue.shift();
    els.username.textContent=gift.username||'Anonym';
    els.giftName.textContent=gift.giftName||'en gåva';
    els.diamonds.textContent=formatDiamonds(gift.diamonds);
    card.classList.remove('hide');
    // Force a reflow so re-triggering the same class on back-to-back gifts still animates.
    void card.offsetWidth;
    card.classList.add('show');

    setTimeout(()=>{
      card.classList.remove('show');
      card.classList.add('hide');
      setTimeout(()=>{
        showing=false;
        playNext();
      },FADE_OUT_MS);
    },HOLD_MS);
  }

  // Public rendering hook — used directly by public/test-widgets.html to preview both variants
  // without needing a real SSE connection, and reused internally for real "gift" events.
  function render(event){
    if(!event)return;
    queue.push({
      username:String(event.username||event.userId||'Anonym').slice(0,60),
      giftName:String(event.giftName||'en gåva').slice(0,60),
      diamonds:Number(event.value??event.diamonds??0)
    });
    playNext();
  }
  window.VyraGiftAlertWidget={render};

  // Only open a real connection when a uid was actually provided — the test/preview page embeds
  // this file without one and drives it purely through VyraGiftAlertWidget.render() instead, so
  // no doomed reconnect loop should run while previewing.
  if(params.uid){
    VyraWidget.connect({
      uid:params.uid,
      onEvent(event){
        if(event?.type==='gift')render(event);
      }
    });
  }else{
    VyraWidget.warn('Inget uid — ansluter inte till någon live-ström (förhandsgranskningsläge).');
  }
})();
</script>
</body>
</html>
