<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA · Last-X Alert</title>
<style>
  /* Transparent background is required for an OBS browser source — any opaque background here
     would show up as a solid box over the stream instead of just the alert card. */
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%}
  body{display:flex;align-items:center;justify-content:flex-start;height:100vh;font-family:'Segoe UI',system-ui,sans-serif}

  /* --last-x is set from JS (per-type theme via ?variant=, overridable via ?accent=; in multi-type
     mode it switches per alert) — every colour below derives from it, so all four types and all
     themes share this one stylesheet. */
  :root{
    --last-x:#ff58d6;
    --text:#f7f2ff;--sub:#b9a6dd;
    --card-bg:linear-gradient(145deg,rgba(28,16,40,.92),rgba(19,11,28,.92));
  }

  /* #card is the motion shell: entrance/exit transforms + the 3D camera (perspective). The
     visible plate lives in #tilt so each design's 3D signature motion can run on the plate
     without ever fighting the entrance transition. Everything animates transform/opacity only —
     compositor-only, stays smooth at 60 FPS in OBS. */
  #card{
    position:relative;margin-left:5vw;max-width:70vw;
    perspective:900px;
    opacity:0;will-change:transform,opacity;
    transition:opacity .32s ease,transform .38s cubic-bezier(.22,1,.36,1);
  }

  /* ---- entrance/exit variants (?entrance=slide-left|slide-right|pop|fade) — each sets its own
     resting transform; .show settles to identity, .hide eases back out the way it came in. */
  html[data-entrance="slide-left"] #card{transform:translateX(-48px)}
  html[data-entrance="slide-right"] #card{transform:translateX(48px)}
  html[data-entrance="pop"] #card{transform:scale(.85)}
  html[data-entrance="fade"] #card{transform:none}
  #card.show{opacity:1;transform:translateX(0) scale(1)}
  #card.hide{
    opacity:0;
    transition:opacity .34s ease,transform .34s cubic-bezier(.4,0,.68,0);
  }
  html[data-entrance="slide-left"] #card.hide{transform:translateX(-48px)}
  html[data-entrance="slide-right"] #card.hide{transform:translateX(48px)}
  html[data-entrance="pop"] #card.hide{transform:scale(.85)}

  /* ---- the plate ---- */
  #tilt{
    position:relative;display:flex;align-items:center;gap:14px;
    min-width:340px;padding:14px 22px 14px 14px;border-radius:18px;
    background:var(--card-bg);
    box-shadow:0 10px 30px rgba(3,1,4,.4),0 0 28px -8px color-mix(in srgb,var(--last-x),transparent 30%);
    transform-style:preserve-3d;will-change:transform;
  }

  /* the sheen is glass on top of the plate: clipped by #glass so the plate can stay unclipped
     for 3D depth, and it only moves its own transform/opacity. */
  #glass{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
  #sheen{
    position:absolute;inset:-40% -60%;opacity:0;
    background:linear-gradient(115deg,transparent 42%,color-mix(in srgb,var(--last-x),transparent 78%) 50%,transparent 58%);
    will-change:transform,opacity;
  }
  #card.show #sheen{animation:sheen 3.4s ease-in-out infinite}
  @keyframes sheen{
    0%,55%,100%{opacity:0;transform:translateX(-30%)}
    70%{opacity:1}
    85%{opacity:0;transform:translateX(30%)}
  }

  #avatar{
    position:relative;flex:none;width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--last-x),white 20%),color-mix(in srgb,var(--last-x),black 40%));
    box-shadow:0 0 0 2px color-mix(in srgb,var(--last-x),transparent 15%),0 0 16px -4px var(--last-x);
    display:flex;align-items:center;justify-content:center;
    transform:translateZ(var(--az,0px));
  }
  #avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:none}
  #avatar[data-has-image] img{display:block}
  #avatar[data-has-image] #initial{display:none}
  #initial{font-size:24px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}

  #copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;transform:translateZ(var(--cz,0px))}
  #copy.swap{animation:swap .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes swap{
    0%{opacity:.2;transform:translateZ(var(--cz,0px)) translateY(6px) scale(.97)}
    100%{opacity:1;transform:translateZ(var(--cz,0px)) translateY(0) scale(1)}
  }
  #label{
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--sub);
  }
  #name{
    font-size:23px;font-weight:800;line-height:1.15;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  #message{
    font-size:12.5px;font-weight:600;line-height:1.3;color:var(--last-x);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* --ez lifts the emblem off the plate in 3D; the twirl keyframes carry it so the two never
     fight over transform. */
  #emblem{
    flex:none;font-size:20px;color:var(--last-x);
    filter:drop-shadow(0 0 8px color-mix(in srgb,var(--last-x),transparent 30%));
    opacity:.85;will-change:transform;transform:translateZ(var(--ez,0px));
  }
  #card.show #emblem{animation:twirl 5s ease-in-out infinite}
  @keyframes twirl{
    0%,100%{transform:translateZ(var(--ez,0px)) rotate(0) scale(1)}
    50%{transform:translateZ(var(--ez,0px)) rotate(180deg) scale(1.12)}
  }

  /* ---- designs (?design=card|stack|skew|badge) — same DOM and phase machine for all four; a
     design restyles/rearranges the plate AND owns a 3D signature motion. None of them draws a
     frame — VYRA widgets float, they don't sit in boxes. */

  /* card — holographic panel: the plate slow-tilts in 3D while avatar, text and emblem sit at
     different depths, so the whole thing reads as a floating hologram. */
  html[data-design="card"] #tilt{--az:26px;--cz:12px;--ez:34px}
  html[data-design="card"] #card.show #tilt{animation:holo 8s ease-in-out infinite}
  @keyframes holo{
    0%,100%{transform:rotateY(-6deg) rotateX(3deg)}
    50%{transform:rotateY(6deg) rotateX(-3deg)}
  }

  /* stack — centred column, no backing panel: the avatar coin-spins in and the whole stack
     hovers with a light 3D lean. */
  html[data-design="stack"] #tilt{
    flex-direction:column;text-align:center;gap:10px;min-width:240px;padding:10px;
    background:none;box-shadow:none;--az:18px;
  }
  html[data-design="stack"] #glass{display:none}
  html[data-design="stack"] #avatar{width:80px;height:80px}
  html[data-design="stack"] #initial{font-size:34px}
  html[data-design="stack"] #copy{align-items:center;gap:3px}
  html[data-design="stack"] #label{text-shadow:0 1px 6px rgba(0,0,0,.8)}
  html[data-design="stack"] #name{font-size:26px;text-shadow:0 2px 12px rgba(0,0,0,.85),0 1px 2px rgba(0,0,0,.6)}
  html[data-design="stack"] #message{text-shadow:0 1px 8px rgba(0,0,0,.8)}
  html[data-design="stack"] #emblem{font-size:16px}
  html[data-design="stack"] #card.show #tilt{animation:hover3d 5s ease-in-out infinite}
  html[data-design="stack"] #card.show #avatar{animation:coin .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes hover3d{
    0%,100%{transform:rotateX(4deg) translateY(0)}
    50%{transform:rotateX(-2deg) translateY(-6px)}
  }
  @keyframes coin{
    0%{transform:translateZ(18px) rotateY(540deg) scale(.5);opacity:0}
    100%{transform:translateZ(18px) rotateY(0) scale(1);opacity:1}
  }

  /* skew — angled esports plate: swings in from a hard 3D angle, then keeps banking side to
     side; the accent slash pulses underneath. Filled shapes only, no outline. */
  html[data-design="skew"] #tilt{
    background:none;box-shadow:none;isolation:isolate;
    padding:14px 34px;min-width:380px;
  }
  html[data-design="skew"] #glass{display:none}
  html[data-design="skew"] #tilt::before{
    content:'';position:absolute;inset:0;z-index:-1;transform:skewX(-12deg);
    background:linear-gradient(120deg,rgba(24,13,36,.95),rgba(19,11,28,.9));
    box-shadow:0 10px 26px rgba(3,1,4,.45),0 0 26px -10px color-mix(in srgb,var(--last-x),transparent 30%);
  }
  html[data-design="skew"] #tilt::after{
    content:'';position:absolute;left:6%;right:34%;bottom:-7px;height:5px;z-index:-1;
    transform:skewX(-12deg);background:var(--last-x);
    box-shadow:0 0 16px color-mix(in srgb,var(--last-x),transparent 35%);
  }
  html[data-design="skew"] #avatar{width:52px;height:52px;border-radius:12px}
  html[data-design="skew"] #avatar img{border-radius:12px}
  html[data-design="skew"] #initial{font-size:22px}
  html[data-design="skew"] #label{color:var(--last-x);letter-spacing:.22em}
  html[data-design="skew"] #name{font-size:24px;text-transform:uppercase;letter-spacing:.03em;font-style:italic}
  html[data-design="skew"] #message{font-size:12px;letter-spacing:.08em}
  html[data-design="skew"] #emblem{font-size:18px}
  html[data-design="skew"] #card.show #tilt{
    animation:swing3d .55s cubic-bezier(.2,.8,.2,1) both,bank 6s ease-in-out .55s infinite;
  }
  html[data-design="skew"] #card.show #tilt::after{animation:slashpulse 2.2s ease-in-out infinite}
  @keyframes swing3d{
    0%{transform:rotateY(58deg)}
    100%{transform:rotateY(0)}
  }
  @keyframes bank{
    0%,100%{transform:rotateY(0)}
    25%{transform:rotateY(-6deg)}
    75%{transform:rotateY(6deg)}
  }
  @keyframes slashpulse{
    0%,100%{opacity:.7}
    50%{opacity:1}
  }

  /* badge — the MVP-emblem composition with medal physics: coin-flips in, then hangs from a
     pivot above the avatar and sways with a slow 3D shimmer. */
  html[data-design="badge"] #tilt{
    flex-direction:column;text-align:center;gap:0;min-width:250px;padding:8px;
    background:none;box-shadow:none;transform-origin:50% -24px;
  }
  html[data-design="badge"] #glass{display:none}
  html[data-design="badge"] #avatar{width:92px;height:92px;z-index:1}
  html[data-design="badge"] #initial{font-size:38px}
  html[data-design="badge"] #copy{
    flex:none;align-items:center;gap:2px;margin-top:-20px;padding:24px 26px 14px;
    border-radius:18px;
    background:linear-gradient(160deg,rgba(28,16,40,.95),rgba(19,11,28,.95));
    box-shadow:0 10px 26px rgba(3,1,4,.5),0 0 22px -10px var(--last-x);
  }
  /* capsule reads name → händelse → typ, so the label moves below the message */
  html[data-design="badge"] #label{order:3;margin-top:4px;color:var(--last-x);font-size:8.5px;letter-spacing:.2em}
  html[data-design="badge"] #name{font-size:22px}
  html[data-design="badge"] #message{font-size:11.5px}
  html[data-design="badge"] #emblem{margin-top:-11px;font-size:19px;z-index:1}
  html[data-design="badge"] #card.show #tilt{
    animation:flipin .8s cubic-bezier(.2,.8,.2,1) both,medal 7s ease-in-out .8s infinite;
  }
  @keyframes flipin{
    0%{transform:rotateY(420deg) translateY(-26px);opacity:0}
    100%{transform:rotateY(0) translateY(0);opacity:1}
  }
  @keyframes medal{
    0%,50%,100%{transform:rotate(0) rotateY(0)}
    20%{transform:rotate(2.6deg) rotateY(9deg)}
    72%{transform:rotate(-2.6deg) rotateY(-9deg)}
  }

  @media (prefers-reduced-motion:reduce){
    #card{transition-duration:.01ms}
    #card.show #sheen,#card.show #emblem,#copy.swap,
    #card.show #tilt,#card.show #avatar,#card.show #tilt::after{animation:none !important}
  }
</style>
</head>
<body>
  <div id="card" aria-hidden="true">
    <div id="tilt">
      <div id="glass"><div id="sheen"></div></div>
      <div id="avatar"><span id="initial">✦</span><img alt=""></div>
      <div id="copy">
        <div id="label">LAST GIFTER</div>
        <div id="name">—</div>
        <div id="message">—</div>
      </div>
      <div id="emblem">✦</div>
    </div>
  </div>

<script src="base-widget.js"></script>
<script>
(function(){
  'use strict';

  // Same four templates as Studio's last-x-alerts.js (labels, themes, message formats) so the
  // OBS widget and the Studio overlay speak the same visual language. multiAccent is each type's
  // signature colour in multi-type mode — all four solo defaults are the same neon pink, which
  // would make a shared stage unreadable, so multi mode picks a distinct colour per type from
  // that type's own theme palette instead.
  // Note: Studio also routes "member" (room join) to Last Subscriber; that fires on every viewer
  // entering the room, so this widget deliberately listens to real "subscribe" events only.
  const TYPES={
    gifter:{
      label:'LAST GIFTER',events:['gift'],multiAccent:'#ffd35d',
      themes:{neon:'#ff58d6',gold:'#ffd35d',emerald:'#3ddc84'},
      message:e=>`SENT ${String(e.giftName||e.gift||'A GIFT').toUpperCase().slice(0,40)} ×${Math.max(1,Math.round(Number(e.count??e.repeatCount)||1))}`
    },
    liker:{
      label:'LAST LIKER',events:['like','likes'],multiAccent:'#ff58d6',
      themes:{neon:'#ff58d6',blue:'#4fc3ff',lime:'#a3e635'},
      message:e=>`SENT ${Math.max(1,Math.round(Number(e.count??e.value)||1)).toLocaleString('sv-SE')} LIKES`
    },
    sharer:{
      label:'LAST SHARER',events:['share'],multiAccent:'#2dd4bf',
      themes:{neon:'#ff58d6',teal:'#2dd4bf',orange:'#ff9d16'},
      message:()=>'SHARED THE LIVE'
    },
    subscriber:{
      label:'LAST SUBSCRIBER',events:['subscribe'],multiAccent:'#4fc3ff',
      themes:{neon:'#ff58d6',ocean:'#4fc3ff',gold:'#ffd35d'},
      message:()=>'JOINED THE CLUB'
    }
  };

  const params=VyraWidget.getParams();

  // ?type= accepts one type, a comma list ("gifter,liker"), or "all" — and "all" is the default:
  // dropped into OBS without parameters, the card is a shared stage where every alert type plays
  // in the same spot, one after another, each type keeping its own latest-event slot so nothing
  // ever backlogs. A single ?type= narrows it to one dedicated alert instead.
  const rawType=VyraWidget.get('type','all').toLowerCase();
  const active=rawType==='all'
    ?Object.keys(TYPES)
    :rawType.split(',').map(s=>s.trim()).filter(k=>TYPES[k]);
  if(!active.length)active.push('gifter');
  const multi=active.length>1;

  const accentParam=VyraWidget.get('accent','');
  const forcedAccent=/^[0-9a-f]{6}$/i.test(accentParam)?'#'+accentParam:'';
  function accentFor(typeKey){
    if(forcedAccent)return forcedAccent;
    const cfg=TYPES[typeKey];
    if(multi)return cfg.multiAccent;
    const themeKeys=Object.keys(cfg.themes);
    const theme=themeKeys.includes(params.variant)?params.variant:themeKeys[0];
    return cfg.themes[theme];
  }
  // ?label= only makes sense for a dedicated card — on a shared stage each alert brings its own.
  function labelFor(typeKey){
    return (multi?TYPES[typeKey].label:VyraWidget.get('label',TYPES[typeKey].label)).slice(0,40);
  }
  document.documentElement.style.setProperty('--last-x',accentFor(active[0]));

  const ENTRANCES=['slide-left','slide-right','pop','fade'];
  const entranceParam=VyraWidget.get('entrance','slide-left');
  document.documentElement.dataset.entrance=ENTRANCES.includes(entranceParam)?entranceParam:'slide-left';

  // ?design= picks the visual skin (value maps to the design's emblem glyph). Same DOM and phase
  // machine underneath, so designs combine freely with type, theme, accent and entrance — each
  // design owns its own 3D signature motion on the #tilt plate.
  const DESIGNS={card:'✦',stack:'✦',skew:'✦',badge:'◆'};
  const designParam=VyraWidget.get('design','card').toLowerCase();
  const design=DESIGNS[designParam]?designParam:'card';
  document.documentElement.dataset.design=design;
  document.getElementById('emblem').textContent=DESIGNS[design];

  const card=document.getElementById('card');
  const els={
    avatar:document.getElementById('avatar'),
    img:document.querySelector('#avatar img'),
    initial:document.getElementById('initial'),
    copy:document.getElementById('copy'),
    label:document.getElementById('label'),
    name:document.getElementById('name'),
    message:document.getElementById('message')
  };
  els.label.textContent=labelFor(active[0]);
  els.img.onerror=()=>delete els.avatar.dataset.hasImage;

  // Studio clamps visningstiden to 4–6 s — keep the exact same envelope here.
  const HOLD_MS=Math.max(4,Math.min(6,Number(VyraWidget.get('hold','5'))||5))*1000;
  const ENTER_MS=400,EXIT_MS=360;

  // ---- enter → hold → exit phase machine over per-type latest-event slots. "Last X" means
  // exactly one thing per type is ever worth showing: the newest event. A new event for the type
  // on stage swaps the card content in place and restarts the hold; a new event for another type
  // waits its turn in arrival order and gets a full enter→hold→exit of its own (with its own
  // label and accent) once the current hold runs out. Within a type, newer always replaces older
  // — so a like-spam can never backlog the stage.
  let phase='idle',showingType=null,phaseTimer=null,holdTimer=null;
  const slots=Object.create(null); // typeKey -> newest normalized event waiting to play
  const order=[];                  // typeKeys with a waiting slot, in arrival order

  function apply(typeKey,data,swap){
    document.documentElement.style.setProperty('--last-x',accentFor(typeKey));
    els.label.textContent=labelFor(typeKey);
    els.name.textContent=data.username;
    els.message.textContent=data.message;
    els.initial.textContent=(data.username[0]||'✦').toUpperCase();
    if(data.avatar){els.img.src=data.avatar;els.avatar.dataset.hasImage='1'}
    else delete els.avatar.dataset.hasImage;
    if(swap){
      els.copy.classList.remove('swap');
      void els.copy.offsetWidth; // restart the swap pulse even on back-to-back events
      els.copy.classList.add('swap');
    }
  }

  function startHold(){
    clearTimeout(holdTimer);
    holdTimer=setTimeout(exit,HOLD_MS);
  }

  function enter(){
    phase='enter';
    card.classList.remove('hide');
    void card.offsetWidth;
    card.classList.add('show');
    card.setAttribute('aria-hidden','false');
    phaseTimer=setTimeout(()=>{phase='hold';startHold()},ENTER_MS);
  }

  function exit(){
    phase='exit';
    clearTimeout(holdTimer);
    card.classList.remove('show');
    card.classList.add('hide');
    card.setAttribute('aria-hidden','true');
    phaseTimer=setTimeout(()=>{
      card.classList.remove('hide'); // back to the resting entrance transform for the next enter
      phase='idle';
      showingType=null;
      advance();
    },EXIT_MS);
  }

  function advance(){
    if(!order.length)return;
    if(phase==='idle'){
      const typeKey=order.shift();
      const data=slots[typeKey];slots[typeKey]=null;
      showingType=typeKey;
      apply(typeKey,data,false);
      enter();
    }else if(phase==='enter'||phase==='hold'){
      // Only the type already on stage may jump the queue — it swaps in place. Other types stay
      // queued until the current hold runs out, then exit's own timer re-enters with the next.
      const i=order.indexOf(showingType);
      if(i===-1)return;
      order.splice(i,1);
      const data=slots[showingType];slots[showingType]=null;
      apply(showingType,data,true);
      if(phase==='hold')startHold(); // newest event owns a full hold window
    }
    // phase 'exit': leave everything queued — exit's completion calls advance().
  }

  function normalize(typeKey,event){
    return{
      username:String(event.username||event.name||event.userId||'Anonym').slice(0,60),
      avatar:String(event.profileImage||event.avatar||'').slice(0,1200),
      message:TYPES[typeKey].message(event)
    };
  }

  function routeType(event){
    const t=String(event?.type||'').toLowerCase();
    if(!t)return multi?null:active[0]; // typeless events are only routable on a dedicated card
    return active.find(k=>TYPES[k].events.includes(t))||null;
  }

  // Public rendering hook — same convention as the other widgets, used by public/test-widgets.html
  // to preview without a live connection. The type routing lives here (not only in the SSE
  // listener) so the preview page proves the filtering too, same as welcome-viewer.
  function render(event){
    if(!event)return;
    const typeKey=routeType(event);
    if(!typeKey)return;
    slots[typeKey]=normalize(typeKey,event);
    if(!order.includes(typeKey))order.push(typeKey);
    advance();
  }
  window.VyraLastXWidget={render};

  if(params.uid){
    VyraWidget.connect({uid:params.uid,onEvent:render});
  }else{
    VyraWidget.warn('Inget uid — ansluter inte till någon live-ström (förhandsgranskningsläge).');
  }
})();
</script>
</body>
</html>
