<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA · Crystal Garden</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%;width:100%}
  body{
    display:flex;align-items:center;justify-content:center;height:100vh;
    font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif;
    color:#f3e9d2;
  }

  /* Root font-size is set in JS (rem-scaling) so every measurement below, written in rem, scales
     proportionally with whatever pixel size the OBS Browser Source actually is — this is what
     makes the whole widget "ändringsbar storlek" instead of clipping or staying a fixed size. */
  #canvas{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:1.4rem;
    padding:1.2rem 2.2rem 1.6rem;
  }

  /* ---------- Ornate gold header ---------- */
  #title-block{text-align:center;position:relative;z-index:2}
  #crest{width:13rem;height:3.4rem;display:block;margin:0 auto -.2rem}
  #crest .pulse-gem{animation:crest-shimmer 4.5s ease-in-out infinite}
  @keyframes crest-shimmer{0%,100%{opacity:.75}50%{opacity:1}}

  /* Metallic gold gradient text — a real gradient clipped to the glyphs, not a flat gold fill,
     so the lettering reads as engraved metal the way the design's title does. */
  #title{
    margin:0;font-size:var(--title-size,2.1rem);letter-spacing:.16em;font-weight:400;
    background:linear-gradient(180deg,#fff6dc 0%,#f7d692 38%,#c9973f 58%,#f4d99b 78%,#fff6dc 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 var(--glow-px,14px) rgba(246,199,107,.5));
  }
  #subtitle-row{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.3rem}
  #subtitle-row .rule{width:2.6rem;height:1px;background:linear-gradient(90deg,transparent,#c9a25f)}
  #subtitle-row .rule.right{background:linear-gradient(270deg,transparent,#c9a25f)}
  #subtitle-row .diamond{width:.3rem;height:.3rem;background:#f6c76b;transform:rotate(45deg)}
  #subtitle{font-size:.7rem;letter-spacing:.3em;color:#cbb891;text-transform:uppercase}

  /* ---------- Goals ---------- */
  #goals-shell{position:relative}
  /* The connecting vines are drawn into this layer AFTER layout, by measuring each ring's real
     centre — so the curves stay correct for any goal count, ring size or layout. */
  #vines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
  #goals{display:flex;gap:1.9rem;position:relative;z-index:1}
  html[data-layout="list"] #goals{flex-direction:column;align-items:center;gap:1.1rem}
  html[data-layout="row"] #goals{flex-direction:row;align-items:flex-start;flex-wrap:wrap;justify-content:center}

  .goal{display:flex;flex-direction:column;align-items:center;gap:.5rem;min-width:0}

  .ring-wrap{position:relative;width:var(--ring-size,7.5rem);height:var(--ring-size,7.5rem)}
  .ring-wrap>svg.rings{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .ring-outline{fill:none;stroke:rgba(246,199,107,.22);stroke-width:.7}
  .ring-track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:5}
  .ring-fill{
    fill:none;stroke-width:5;stroke-linecap:round;
    filter:drop-shadow(0 0 var(--glow-px,14px) var(--goal-color));
    transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);
  }

  /* Numbered gold badge, upper-left of the ring exactly as in the design */
  .badge{
    position:absolute;left:-.15rem;top:-.15rem;width:1.55rem;height:1.55rem;
    display:flex;align-items:center;justify-content:center;z-index:3;
  }
  .badge svg{position:absolute;inset:0;width:100%;height:100%}
  .badge span{
    position:relative;font-size:.72rem;color:#f7dfa8;
    text-shadow:0 0 6px rgba(246,199,107,.7);
  }

  .crystal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .crystal svg,.crystal img{width:76%;height:76%;object-fit:contain}
  .crystal svg{filter:drop-shadow(0 0 calc(var(--glow-px,14px) * .8) var(--goal-color))}
  /* Slow specular drift across every crystal — opacity-only, so it's compositor-cheap. */
  .crystal .shine{animation:crystal-shine 6s ease-in-out infinite}
  @keyframes crystal-shine{0%,100%{opacity:.25}50%{opacity:.7}}

  .goal-name{
    font-size:var(--name-size,.95rem);color:var(--goal-color);letter-spacing:.03em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:12rem;
    text-shadow:0 0 10px color-mix(in srgb,var(--goal-color) 45%,transparent);
  }
  .goal-count{font-size:1.2rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
  .goal-count small{font-size:.75rem;font-weight:400;color:#a2957c;margin-left:.2rem}
  .goal-pct{
    font-size:.7rem;font-weight:700;padding:.16rem .6rem;border-radius:999px;letter-spacing:.04em;
    border:1px solid var(--goal-color);color:var(--goal-color);
    background:color-mix(in srgb,var(--goal-color) 12%,transparent);
  }
</style>
</head>
<body>
  <div id="canvas">
    <div id="title-block">
      <svg id="crest" viewBox="0 0 260 68" aria-hidden="true"></svg>
      <h1 id="title">GIFT CAMPAIGN</h1>
      <div id="subtitle-row">
        <span class="rule"></span><span class="diamond"></span>
        <span id="subtitle">GROW THE CRYSTAL GARDEN</span>
        <span class="diamond"></span><span class="rule right"></span>
      </div>
    </div>
    <div id="goals-shell">
      <svg id="vines" aria-hidden="true"></svg>
      <div id="goals"></div>
    </div>
  </div>

<script src="base-widget.js"></script>
<script>
(function(){
  'use strict';

  const DEFAULT_GOALS = [
    { name: 'Rose Quartz',  gift: 'Rose',        target: 250, color: '#ff8fc2', shape: 'lotus'   },
    { name: 'Amethyst',     gift: 'Perfume',     target: 100, color: '#b478ff', shape: 'cluster' },
    { name: 'Sapphire',     gift: 'Galaxy',      target: 50,  color: '#5ec8ff', shape: 'prism'   },
    { name: 'Golden Lotus', gift: 'Lion',        target: 20,  color: '#f6c76b', shape: 'bloom'   },
    { name: 'Emerald',      gift: 'Universe',    target: 10,  color: '#6bf6a8', shape: 'cluster' },
    { name: 'Ruby',         gift: 'Drama Queen', target: 5,   color: '#ff6b6b', shape: 'prism'   }
  ];

  // Number(null) and Number('') are both 0 — a valid, finite number — so a naive Number(value)
  // check can't tell "param absent, use fallback" apart from "param explicitly set to 0". Missing
  // URLSearchParams values are null, so that's checked first.
  function num(value, fallback) { if (value === null || value === '') return fallback; const n = Number(value); return Number.isFinite(n) ? n : fallback }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)) }

  const params = new URLSearchParams(location.search);
  const count = clamp(Math.round(num(params.get('count'), 4)), 1, 6);
  const layout = params.get('layout') === 'list' ? 'list' : 'row';
  const ringSize = clamp(num(params.get('ringSize'), 120), 60, 260);
  const glowPx = clamp(num(params.get('glow'), 14), 0, 30);
  const titleSize = clamp(num(params.get('titleSize'), 34), 16, 72);
  const nameSize = clamp(num(params.get('nameSize'), 15), 8, 32);

  document.documentElement.dataset.layout = layout;
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty('--ring-size', ringSize / 16 + 'rem');
  rootStyle.setProperty('--glow-px', glowPx + 'px');
  rootStyle.setProperty('--title-size', titleSize / 16 + 'rem');
  rootStyle.setProperty('--name-size', nameSize / 16 + 'rem');

  document.getElementById('title').textContent = params.get('title') || 'GIFT CAMPAIGN';
  document.getElementById('subtitle').textContent = params.get('subtitle') || 'GROW THE CRYSTAL GARDEN';

  const goals = [];
  for (let i = 1; i <= count; i++) {
    const fallback = DEFAULT_GOALS[i - 1] || DEFAULT_GOALS[DEFAULT_GOALS.length - 1];
    goals.push({
      name: params.get(`g${i}_name`) || fallback.name,
      gift: (params.get(`g${i}_gift`) || fallback.gift).toLowerCase(),
      target: Math.max(1, num(params.get(`g${i}_target`), fallback.target)),
      value: Math.max(0, num(params.get(`g${i}_value`), 0)),
      color: params.get(`g${i}_color`) || fallback.color,
      shape: params.get(`g${i}_shape`) || fallback.shape,
      image: params.get(`g${i}_image`) || ''
    });
  }

  /* ==================================================================================
     Crystal artwork — hand-authored faceted SVG, one distinct silhouette per shape.
     Every facet is a separate polygon over a shared gradient stack so a single accent
     colour drives the whole gem: light stops lift a facet toward white, dark stops sink
     it toward black, and a low-opacity white "shine" layer drifts across the top. That
     is what reads as cut stone rather than a flat symbol.
     ================================================================================== */

  // Facet shading is derived from the accent colour itself rather than hard-coded near-black, so
  // every gem stays luminous and inside its own colour family — mixing toward black instead is
  // what made the first attempt's petals read as a dark disc rather than lit stone.
  function shade(color, amount) {
    const hex = String(color).trim();
    const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hex);
    if (!m) return color; // non-hex (named colour etc.) — use as-is rather than corrupting it
    let h = m[1];
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const rgb = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
    const target = amount < 0 ? 0 : 255, k = Math.abs(amount);
    const out = rgb.map(v => Math.round(v + (target - v) * k));
    return '#' + out.map(v => v.toString(16).padStart(2, '0')).join('');
  }

  function gradients(id, color) {
    const deep = shade(color, -0.55), mid = shade(color, -0.3), soft = shade(color, 0.25);
    return `
      <defs>
        <linearGradient id="lit${id}" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
          <stop offset=".4" stop-color="${soft}"/>
          <stop offset="1" stop-color="${color}"/>
        </linearGradient>
        <linearGradient id="mid${id}" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0" stop-color="${color}"/>
          <stop offset="1" stop-color="${mid}"/>
        </linearGradient>
        <linearGradient id="dark${id}" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${deep}"/>
          <stop offset="1" stop-color="${mid}"/>
        </linearGradient>
        <linearGradient id="leaf${id}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3f8a76"/>
          <stop offset="1" stop-color="#1b4740"/>
        </linearGradient>
        <radialGradient id="core${id}" cx=".5" cy=".38" r=".5">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
          <stop offset="1" stop-color="${color}" stop-opacity="0"/>
        </radialGradient>
      </defs>`;
  }

  // Layered bloom (Rose Quartz): fanned outer petals, tighter inner petals, glowing core.
  function lotusArt(id, color) {
    const petal = 'M50 86 C 40 66 38 42 50 18 C 62 42 60 66 50 86 Z';
    const outer = [-52, -34, -17, 0, 17, 34, 52];
    const inner = [-26, -9, 9, 26];
    return `<svg viewBox="0 0 100 100">${gradients(id, color)}
      <g>
        <path d="M50 88 C 30 84 16 74 10 62 C 26 62 40 70 50 82 Z" fill="url(#leaf${id})" opacity=".9"/>
        <path d="M50 88 C 70 84 84 74 90 62 C 74 62 60 70 50 82 Z" fill="url(#leaf${id})" opacity=".9"/>
      </g>
      <g>${outer.map(a => `<path d="${petal}" fill="url(#dark${id})" transform="rotate(${a} 50 88) scale(1 .96)" transform-origin="50 88"/>`).join('')}</g>
      <g>${inner.map(a => `<path d="${petal}" fill="url(#mid${id})" transform="rotate(${a} 50 88) scale(.82 .8)" transform-origin="50 88"/>`).join('')}</g>
      <path d="${petal}" fill="url(#lit${id})" transform="scale(.6 .62)" transform-origin="50 88"/>
      <ellipse cx="50" cy="52" rx="19" ry="24" fill="url(#core${id})" class="shine"/>
    </svg>`;
  }

  // Angular prism cluster (Amethyst / Emerald): three crystals of differing height, each with a
  // lit face, a shadowed face and a visible top table.
  function clusterArt(id, color) {
    function prism(cx, top, halfW, bottom, tilt) {
      const l = cx - halfW, r = cx + halfW, shoulder = top + (bottom - top) * 0.22;
      return `<g transform="rotate(${tilt} ${cx} ${bottom})">
        <path d="M${l} ${bottom} L${l} ${shoulder} L${cx} ${top} L${r} ${shoulder} L${r} ${bottom} Z" fill="url(#mid${id})"/>
        <path d="M${l} ${bottom} L${l} ${shoulder} L${cx} ${top} L${cx} ${bottom} Z" fill="url(#lit${id})" opacity=".95"/>
        <path d="M${cx} ${top} L${r} ${shoulder} L${r} ${bottom} L${cx} ${bottom} Z" fill="url(#dark${id})"/>
        <path d="M${l} ${shoulder} L${cx} ${top} L${r} ${shoulder} L${cx} ${shoulder + 4} Z" fill="#ffffff" opacity=".22"/>
      </g>`;
    }
    return `<svg viewBox="0 0 100 100">${gradients(id, color)}
      ${prism(30, 40, 11, 90, -8)}
      ${prism(70, 34, 10, 90, 9)}
      ${prism(50, 14, 14, 92, 0)}
      <path d="M36 30 L50 16 L58 30 L50 40 Z" fill="#ffffff" opacity=".3" class="shine"/>
      <ellipse cx="50" cy="88" rx="28" ry="5" fill="url(#core${id})" opacity=".5"/>
    </svg>`;
  }

  // Single tall brilliant (Sapphire / Ruby): crown, table and pavilion facets.
  function prismArt(id, color) {
    return `<svg viewBox="0 0 100 100">${gradients(id, color)}
      <path d="M28 40 L50 8 L72 40 L50 94 Z" fill="url(#mid${id})"/>
      <path d="M28 40 L50 8 L50 94 Z" fill="url(#lit${id})" opacity=".9"/>
      <path d="M50 8 L72 40 L50 94 Z" fill="url(#dark${id})"/>
      <path d="M28 40 L50 8 L72 40 L50 52 Z" fill="#ffffff" opacity=".2"/>
      <path d="M38 40 L50 18 L62 40 L50 48 Z" fill="#ffffff" opacity=".35" class="shine"/>
      <path d="M28 40 L72 40" stroke="#ffffff" stroke-opacity=".35" stroke-width="1"/>
      <ellipse cx="50" cy="30" rx="10" ry="14" fill="url(#core${id})"/>
    </svg>`;
  }

  // Wide many-petalled bloom (Golden Lotus): narrow pointed petals radiating in a fan.
  function bloomArt(id, color) {
    const petal = 'M50 88 C 44 68 43 44 50 22 C 57 44 56 68 50 88 Z';
    const angles = [-72, -55, -38, -20, 0, 20, 38, 55, 72];
    const front = [-40, -20, 0, 20, 40];
    return `<svg viewBox="0 0 100 100">${gradients(id, color)}
      <g>${angles.map(a => `<path d="${petal}" fill="url(#dark${id})" transform="rotate(${a} 50 88)"/>`).join('')}</g>
      <g>${front.map(a => `<path d="${petal}" fill="url(#lit${id})" opacity=".95" transform="rotate(${a} 50 88) scale(.86 .78)" transform-origin="50 88"/>`).join('')}</g>
      <path d="M50 84 L44 62 L50 40 L56 62 Z" fill="#ffffff" opacity=".4" class="shine"/>
      <ellipse cx="50" cy="62" rx="16" ry="20" fill="url(#core${id})"/>
    </svg>`;
  }

  const SHAPES = { lotus: lotusArt, cluster: clusterArt, prism: prismArt, bloom: bloomArt };
  function crystalMarkup(goal, index) {
    if (goal.image) return `<img src="${goal.image}" alt="">`;
    return (SHAPES[goal.shape] || clusterArt)(index, goal.color);
  }

  /* ---------- Ornate gold crest above the title ---------- */
  function buildCrest() {
    document.getElementById('crest').innerHTML = `
      <defs>
        <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff3cf"/><stop offset=".5" stop-color="#e0b464"/><stop offset="1" stop-color="#9d6f2c"/>
        </linearGradient>
      </defs>
      <g fill="url(#goldV)">
        <path class="pulse-gem" d="M130 6 L138 22 L130 40 L122 22 Z" fill="#f3a6cd"/>
        <path class="pulse-gem" d="M130 6 L138 22 L130 24 L122 22 Z" fill="#fff0f8" opacity=".85"/>
        <path d="M118 30 C110 26 104 30 100 38 C108 38 114 36 118 30 Z"/>
        <path d="M142 30 C150 26 156 30 160 38 C152 38 146 36 142 30 Z"/>
        <path d="M112 40 C96 40 84 44 74 52 L74 54 C86 48 98 45 112 45 Z"/>
        <path d="M148 40 C164 40 176 44 186 52 L186 54 C174 48 162 45 148 45 Z"/>
        <path d="M70 52 L60 47 L60 57 Z"/><path d="M190 52 L200 47 L200 57 Z"/>
        <circle cx="130" cy="46" r="2.6"/>
      </g>`;
  }

  /* ---------- Rings, badges, values ---------- */
  const RADIUS = 44, CIRC = 2 * Math.PI * RADIUS;
  const goalsRoot = document.getElementById('goals');

  const els = goals.map((goal, i) => {
    const article = document.createElement('div');
    article.className = 'goal';
    article.style.setProperty('--goal-color', goal.color);
    article.innerHTML = `
      <div class="ring-wrap">
        <svg class="rings" viewBox="0 0 100 100">
          <circle class="ring-outline" cx="50" cy="50" r="${RADIUS + 5}"/>
          <circle class="ring-track" cx="50" cy="50" r="${RADIUS}"/>
          <circle class="ring-fill" cx="50" cy="50" r="${RADIUS}" stroke="${goal.color}"
            stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/>
        </svg>
        <div class="crystal">${crystalMarkup(goal, i)}</div>
        <div class="badge">
          <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#140a1e" stroke="#d9ae62" stroke-width="1.6"/></svg>
          <span>${i + 1}</span>
        </div>
      </div>
      <div class="goal-name">${goal.name}</div>
      <div class="goal-count"><span class="current">0</span><small>/ ${goal.target.toLocaleString('sv-SE')}</small></div>
      <div class="goal-pct">0%</div>`;
    goalsRoot.append(article);
    return {
      goal,
      article,
      ringFill: article.querySelector('.ring-fill'),
      currentEl: article.querySelector('.current'),
      pctEl: article.querySelector('.goal-pct')
    };
  });

  function redraw(entry) {
    const pct = Math.min(1, entry.goal.value / entry.goal.target);
    entry.ringFill.style.strokeDashoffset = CIRC * (1 - pct);
    entry.currentEl.textContent = Math.round(entry.goal.value).toLocaleString('sv-SE');
    entry.pctEl.textContent = Math.round(pct * 100) + '%';
  }
  els.forEach(redraw);

  /* ---------- Connecting vines between rings ----------
     Measured from the live DOM rather than computed from config, so the curves land on the real
     ring centres for any count / ring size, and simply stay empty in list layout. */
  const vinesEl = document.getElementById('vines');
  function drawVines() {
    if (layout !== 'row' || els.length < 2) { vinesEl.innerHTML = ''; return }
    const shell = document.getElementById('goals-shell').getBoundingClientRect();
    vinesEl.setAttribute('viewBox', `0 0 ${shell.width} ${shell.height}`);
    const centres = els.map(entry => {
      const box = entry.article.querySelector('.ring-wrap').getBoundingClientRect();
      return { x: box.left - shell.left + box.width / 2, y: box.top - shell.top + box.height / 2, r: box.width / 2 };
    });
    let out = '';
    for (let i = 0; i < centres.length - 1; i++) {
      const a = centres[i], b = centres[i + 1];
      // Only connect neighbours that actually sit side by side. With enough goals the flex row
      // wraps, and joining the last item of one row to the first of the next would sweep a long
      // diagonal vine across the whole widget.
      if (Math.abs(b.y - a.y) > a.r * 0.5 || b.x < a.x) continue;
      const from = { x: a.x + a.r * 0.92, y: a.y + a.r * 0.28 };
      const to = { x: b.x - b.r * 0.92, y: b.y + b.r * 0.28 };
      const midX = (from.x + to.x) / 2;
      out += `<path d="M${from.x} ${from.y} C ${midX} ${from.y + 14}, ${midX} ${to.y - 16}, ${to.x} ${to.y}"
                 fill="none" stroke="${els[i].goal.color}" stroke-opacity=".55" stroke-width="1.4"/>`;
      out += `<path d="M${from.x} ${from.y} C ${midX} ${from.y + 22}, ${midX} ${to.y - 6}, ${to.x} ${to.y}"
                 fill="none" stroke="${els[i + 1].goal.color}" stroke-opacity=".3" stroke-width="1"/>`;
      // Sparkles riding the vine, as in the design's connecting tendrils.
      for (let s = 1; s <= 3; s++) {
        const t = s / 4, sx = from.x + (to.x - from.x) * t, sy = from.y + (to.y - from.y) * t + Math.sin(t * Math.PI) * 12;
        out += `<circle cx="${sx}" cy="${sy}" r="${1.6 - s * 0.2}" fill="#ffe9b8" opacity=".8"/>`;
      }
      // A small leaf where the vine leaves the ring.
      out += `<path d="M${from.x} ${from.y} c 5 -5 11 -5 15 -1 c -5 4 -11 5 -15 1 Z" fill="${els[i].goal.color}" opacity=".45"/>`;
    }
    vinesEl.innerHTML = out;
  }

  /* ---------- Responsive rem-scaling ---------- */
  const BASE_WIDTH = 900, BASE_FONT = 16;
  function rescale() {
    const width = document.documentElement.clientWidth || BASE_WIDTH;
    const factor = clamp(width / BASE_WIDTH, 0.45, 2.2);
    document.documentElement.style.fontSize = (BASE_FONT * factor) + 'px';
  }

  buildCrest();
  rescale();
  requestAnimationFrame(drawVines);
  new ResizeObserver(() => { rescale(); requestAnimationFrame(drawVines) }).observe(document.documentElement);

  // Public hook — accepts a TikTok-shaped "gift" event and adds its count to every goal whose
  // configured gift name matches (case-insensitive), or a {index, value} object to set one goal
  // directly for testing.
  function render(eventOrPatch) {
    if (eventOrPatch && typeof eventOrPatch.index === 'number') {
      const entry = els[eventOrPatch.index];
      if (!entry) return;
      entry.goal.value = Math.max(0, Number(eventOrPatch.value) || 0);
      redraw(entry);
      return;
    }
    const event = eventOrPatch;
    if (!event || event.type !== 'gift') return;
    const giftName = String(event.giftName || '').toLowerCase();
    if (!giftName) return;
    for (const entry of els) {
      if (entry.goal.gift !== giftName) continue;
      entry.goal.value += Number(event.count) || 1;
      redraw(entry);
    }
  }
  window.VyraCrystalGardenWidget = {
    render,
    reset() { els.forEach(entry => { entry.goal.value = 0; redraw(entry) }) }
  };

  const uid = params.get('uid');
  if (uid) {
    VyraWidget.connect({ uid, onEvent: render });
  } else {
    VyraWidget.warn('Inget uid — ansluter inte till någon live-ström (förhandsgranskningsläge).');
  }
})();
</script>
</body>
</html>
