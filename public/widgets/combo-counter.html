<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA · Combo Counter</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%}
  body{display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',system-ui,sans-serif}

  :root{
    --accent-a:#8d3cff;--accent-b:#25e2ff;--text:#fff;--glow:rgba(141,60,255,.7);
  }
  html[data-variant="celestial"]{
    --accent-a:#f6c76b;--accent-b:#ffe9c2;--text:#fff8ec;--glow:rgba(246,199,107,.7);
  }

  #combo{
    text-align:center;opacity:0;transform:scale(.7);
    will-change:transform,opacity;
    transition:opacity .2s ease,transform .2s cubic-bezier(.3,1.6,.4,1);
  }
  #combo.show{opacity:1;transform:scale(1)}

  #count{
    font-size:64px;font-weight:900;line-height:1;
    background:linear-gradient(90deg,var(--accent-a),var(--accent-b));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px var(--glow);
    /* Only transform — compositor-only, safe to run continuously at 60 FPS. */
    will-change:transform;
  }
  #tier-label{
    margin-top:2px;font-size:20px;font-weight:800;letter-spacing:.05em;color:var(--text);
    text-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  #meta{margin-top:6px;font-size:14px;color:var(--text);opacity:.85}

  /* Shake intensity grows with combo tier — amplitude/speed only, same keyframe shape. */
  @keyframes shake-combo{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-3px) rotate(-1deg)}40%{transform:translateX(3px) rotate(1deg)}60%{transform:translateX(-2px) rotate(-.6deg)}80%{transform:translateX(2px) rotate(.6deg)}}
  @keyframes shake-mega{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px) rotate(-1.4deg)}80%{transform:translateX(4px) rotate(1.4deg)}}
  @keyframes shake-legendary{0%,100%{transform:translateX(0) rotate(0) scale(1)}20%{transform:translateX(-9px) rotate(-3deg) scale(1.04)}40%{transform:translateX(9px) rotate(3deg) scale(1.04)}60%{transform:translateX(-6px) rotate(-2deg) scale(1.02)}80%{transform:translateX(6px) rotate(2deg) scale(1.02)}}
  #count.tier-combo{animation:shake-combo .5s ease-in-out infinite}
  #count.tier-mega{animation:shake-mega .42s ease-in-out infinite}
  #count.tier-legendary{animation:shake-legendary .34s ease-in-out infinite}
</style>
</head>
<body>
  <div id="combo" aria-hidden="true">
    <div id="count">5x</div>
    <div id="tier-label">COMBO!</div>
    <div id="meta">—</div>
  </div>

<script src="base-widget.js"></script>
<script>
(function(){
  'use strict';
  const params=VyraWidget.getParams();
  document.documentElement.dataset.variant=params.variant==='celestial'?'celestial':'cyber';

  const comboEl=document.getElementById('combo');
  const countEl=document.getElementById('count');
  const tierEl=document.getElementById('tier-label');
  const metaEl=document.getElementById('meta');

  const HIDE_AFTER_MS=2500; // no new event for the active streak within this window = streak over
  let activeKey=null,hideTimer=null;

  function tierFor(n){
    if(n>=20)return{cls:'tier-legendary',label:'LEGENDARY!'};
    if(n>=10)return{cls:'tier-mega',label:'MEGA COMBO!'};
    return{cls:'tier-combo',label:'COMBO!'};
  }

  // A TikTok gift-streak event already carries the streak's own live repeat count
  // (event.count, produced by tiktok-bridge/normalizer.js's giftFields()) — this widget just
  // displays it directly rather than re-counting events itself, so it stays correct even across
  // reconnect/replay.
  function show(count,username,giftName){
    const tier=tierFor(count);
    countEl.textContent=`${count}x`;
    countEl.className=tier.cls;
    tierEl.textContent=tier.label;
    metaEl.textContent=`${username||'Någon'} · ${giftName||'gåva'}`;
    comboEl.classList.add('show');

    if(hideTimer)clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>{
      comboEl.classList.remove('show');
      countEl.className='';
      activeKey=null;
    },HIDE_AFTER_MS);
  }

  // Public hook — accepts a TikTok-shaped "gift" event.
  function render(event){
    if(!event||event.type!=='gift')return;
    const count=Number(event.count)||1;
    if(count<5)return; // not a combo yet — this widget only cares once a streak is notable
    activeKey=`${event.userId||event.username||''}|${event.giftName||''}`;
    show(count,event.username,event.giftName);
  }
  window.VyraComboCounterWidget={render};

  if(params.uid){
    VyraWidget.connect({uid:params.uid,onEvent:render});
  }else{
    VyraWidget.warn('Inget uid — ansluter inte till någon live-ström (förhandsgranskningsläge).');
  }
})();
</script>
</body>
</html>
