<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA · Welcome Viewer</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%}
  body{display:flex;align-items:center;justify-content:flex-end;height:100vh;font-family:'Segoe UI',system-ui,sans-serif}

  :root{
    --accent-a:#8d3cff;--accent-b:#25e2ff;--text:#fff;--sub:#d9c9ff;
    --card-bg:linear-gradient(135deg,rgba(30,10,50,.92),rgba(10,6,30,.92));
    --glow:0 0 40px rgba(141,60,255,.55),0 0 80px rgba(37,226,255,.25);
  }
  html[data-variant="celestial"]{
    --accent-a:#f6c76b;--accent-b:#ffe9c2;--text:#fff8ec;--sub:#f0d9a8;
    --card-bg:linear-gradient(135deg,rgba(70,42,10,.92),rgba(40,20,4,.92));
    --glow:0 0 40px rgba(246,199,107,.55),0 0 80px rgba(255,233,194,.25);
  }

  #alert-card{
    position:relative;margin-right:5vw;min-width:300px;max-width:70vw;
    padding:16px 26px;border-radius:18px;
    background:var(--card-bg);
    border:1px solid color-mix(in srgb,var(--accent-a) 60%,transparent);
    box-shadow:var(--glow);
    display:flex;align-items:center;gap:14px;
    opacity:0;transform:translateX(48px);
    will-change:transform,opacity;
    transition:opacity .32s cubic-bezier(.2,.8,.2,1),transform .32s cubic-bezier(.2,.8,.2,1);
  }
  #alert-card.show{opacity:1;transform:translateX(0)}
  #alert-card.hide{opacity:0;transform:translateX(32px);transition-duration:.26s}

  #icon{font-size:30px;flex:none;animation:wave 1s ease-in-out}
  @keyframes wave{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(14deg)}80%{transform:rotate(-4deg)}}

  #text{display:flex;flex-direction:column;gap:2px;min-width:0}
  #headline{font-size:15px;font-weight:600;color:var(--sub)}
  #username{
    font-size:20px;font-weight:800;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
</style>
</head>
<body>
  <div id="alert-card" aria-hidden="true">
    <div id="text">
      <div id="headline">Välkommen!</div>
      <div id="username">@—</div>
    </div>
    <div id="icon">👋</div>
  </div>

<script src="base-widget.js"></script>
<script>
(function(){
  'use strict';
  const params=VyraWidget.getParams();
  document.documentElement.dataset.variant=params.variant==='celestial'?'celestial':'cyber';

  const card=document.getElementById('alert-card');
  const usernameEl=document.getElementById('username');

  const HOLD_MS=3000,FADE_OUT_MS=260;
  const queue=[];
  let showing=false;

  function playNext(){
    if(showing||!queue.length)return;
    showing=true;
    const viewer=queue.shift();
    usernameEl.textContent=`@${viewer.username}`;
    card.classList.remove('hide');
    void card.offsetWidth;
    card.classList.add('show');

    setTimeout(()=>{
      card.classList.remove('show');
      card.classList.add('hide');
      setTimeout(()=>{showing=false;playNext()},FADE_OUT_MS);
    },HOLD_MS);
  }

  // Public rendering hook — same convention as the other alert widgets.
  function render(event){
    if(!event)return;
    queue.push({username:String(event.username||event.userId||'Anonym').slice(0,60)});
    playNext();
  }
  window.VyraWelcomeViewerWidget={render};

  if(params.uid){
    VyraWidget.connect({
      uid:params.uid,
      // tiktok-bridge maps TWO different real events to type "viewer": a room-wide viewer-count
      // broadcast (only {count}, no username — fired constantly) and a "member joined" event
      // (WebcastEvent.MEMBER, aliased member→viewer in server/event-bus.js's cleanEvent, carries
      // a real username). Only the latter should greet anyone by name, so this widget must check
      // for a username and ignore the count-only broadcasts — otherwise it would "welcome" an
      // empty/anonymous viewer on every room-count tick.
      onEvent(event){if(event?.type==='viewer'&&event.username)render(event)}
    });
  }else{
    VyraWidget.warn('Inget uid — ansluter inte till någon live-ström (förhandsgranskningsläge).');
  }
})();
</script>
</body>
</html>
