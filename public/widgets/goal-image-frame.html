<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA · Goal — Image Frame</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%}
  *{box-sizing:border-box}
  body{display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,"Times New Roman",Times,serif}

  /* Skalar med BÅDE käll-bredd och käll-höjd: krymper OBS-källan i endera led
     följer widgeten med, med bevarat bildförhållande. */
  .widget{
    position:relative;
    height:min(94vh, calc(94vw / var(--aspect,0.36)), 900px);
    width:calc(min(94vh, calc(94vw / var(--aspect,0.36)), 900px) * var(--aspect,0.36));
    isolation:isolate;user-select:none;
  }

  .frame{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;pointer-events:none;user-select:none;z-index:3;
  }

  /* Text/ring-boxar ligger ÖVER ramen (z4) — krävs för designer med ogenomskinliga
     plattor (badges + blankark). Mätarfyllnaden ligger UNDER ramen (z2) och syns
     genom det utstansade spårfönstret, så ramens kanter behåller sin finish. */
  .box{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;z-index:4}
  .shaft-box{z-index:2}

  .title-box .goal-label{
    color:#ffe6a4;text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 10px rgba(255,200,120,.35);
    font-size:clamp(11px,3.4cqw,22px);letter-spacing:.06em;line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;
  }

  .number-box{flex-direction:column;gap:.15em}
  .number-box .goal-numbers{
    display:flex;align-items:baseline;gap:.2em;color:#fff;
    font-size:clamp(14px,4.6cqw,30px);line-height:1;white-space:nowrap;
    text-shadow:0 2px 5px rgba(0,0,0,.95);
  }
  .number-box .separator{color:#ded9e2;font-size:.7em}
  .number-box .percentage{
    color:#ffd57f;font-size:clamp(9px,2.4cqw,15px);
    text-shadow:0 0 10px rgba(255,174,58,.55),0 2px 4px rgba(0,0,0,.9);
  }

  .shaft-box{align-items:flex-end;overflow:hidden;border-radius:6% / 3%}

  .shaft-fill{
    position:relative;width:100%;height:0%;
    background:
      repeating-linear-gradient(135deg,
        rgba(255,255,255,.14) 0 2px,
        transparent 2px 10px),
      linear-gradient(180deg,
        color-mix(in srgb, var(--accent,#a866ff) 85%, white 15%) 0%,
        var(--accent,#a866ff) 55%,
        color-mix(in srgb, var(--accent,#a866ff) 70%, black 30%) 100%);
    box-shadow:inset 0 0 18px rgba(255,255,255,.35);
    transition:height 650ms cubic-bezier(.2,.9,.2,1);
  }

  .shaft-fill::after{
    content:"";position:absolute;left:0;right:0;top:0;height:3px;
    background:#fff;
    box-shadow:0 0 10px 3px rgba(255,255,255,.9),0 0 22px 6px var(--accent,#a866ff);
    opacity:.95;
  }

  /* Badge-läge: radiell progress-ring i cirkelfönstret */

  .widget[data-dark-title] .title-box .goal-label{color:#7a3b58;text-shadow:0 1px 2px rgba(255,255,255,.55)}
  .widget[data-dark-number] .number-box .goal-numbers{color:#5e2c46;text-shadow:0 1px 2px rgba(255,255,255,.55)}
  .widget[data-dark-number] .number-box .separator{color:#9c6d85}
  .widget[data-dark-number] .number-box .percentage{color:#8a4a68;text-shadow:0 1px 2px rgba(255,255,255,.5)}

  @media (prefers-reduced-motion:reduce){
    .shaft-fill{transition:none}
  }
</style>
</head>
<body>
  <main class="widget" id="widget">
    <img class="frame" id="frame-img" alt="">
    <section class="box title-box" id="title-box" style="container-type:inline-size">
      <div class="goal-label" id="goal-label">FÖLJARE MÅL</div>
    </section>
    <section class="box shaft-box" id="shaft-box">
      <div class="shaft-fill" id="shaft-fill"></div>
    </section>
    <section class="box number-box" id="number-box" style="container-type:inline-size">
      <div class="goal-numbers">
        <span id="current-value">0</span>
        <span class="separator">/</span>
        <span id="goal-value">1000</span>
      </div>
      <div class="percentage" id="percentage-value">0.0%</div>
    </section>
  </main>

<script src="base-widget.js"></script>

(function(){

eart-wings":{"label":"Heart · Wings","file":"assets/goal-image-frame/heart-wings.png","aspect":0.3593,"accent":"#e066ff","title":{"left":27.778,"top":17.964,"width":45.37,"height":8.649},"shaft":{"left":28.889,"top":26.613,"width":43.148,"height":51.364},"number":{"left":24.63,"top":77.977,"width":50.741,"height":15.236}},"moon-clouds":{"label":"Moon · Clouds","file":"assets/goal-image-frame/moon-clouds.png","aspect":0.3538,"accent":"#c07bff","title":{"left":29.24,"top":20.483,"width":42.105,"height":7.448},"shaft":{"left":30.409,"top":27.931,"width":39.766,"height":54.828},"number":{"left":19.493,"top":82.759,"width":62.378,"height":14.621}},"crystal-spike":{"label":"Crystal · Spike","file":"assets/goal-image-frame/crystal-spike.png","aspect":0.2727,"accent":"#a866ff","title":{"left":28.536,"top":22.801,"width":45.906,"height":8.187},"shaft":{"left":30.025,"top":30.988,"width":42.928,"height":53.721},"number":{"left":14.888,"top":84.709,"width":69.479,"height":12.72}},"rose-heart":{"label":"Rose · Heart","file":"assets/goal-image-frame/rose-heart.png","aspect":0.3782,"accent":"#ff5fb8","title":{"left":28.07,"top":17.585,"width":48.772,"height":10.617},"shaft":{"left":29.123,"top":28.202,"width":42.982,"height":49.768},"number":{"left":27.719,"top":77.969,"width":45.439,"height":13.603}},
"amethyst-spire":{"label":"Spire · Amethyst","file":"assets/goal-image-frame/amethyst-spire.png","aspect":0.2962,"accent":"#b083ff","title":{"left":19.439,"top":23.539,"width":61.575,"height":7.882},"shaft":{"left":38.009,"top":32.976,"width":24.434,"height":45.576},"number":{"left":14.395,"top":80.483,"width":70.679,"height":14.415}},
"luna-pearl":{"label":"Luna · Pearl","file":"assets/goal-image-frame/luna-pearl.png","aspect":0.3716,"accent":"#ffd57f","title":{"left":26.766,"top":19.89,"width":47.25,"height":10.729},"shaft":{"left":39.453,"top":32.511,"width":21.875,"height":43.832},"number":{"left":28.047,"top":78.374,"width":44.297,"height":15.239}},
"heart-crown":{"label":"Heart · Crown","file":"assets/goal-image-frame/heart-crown.png","aspect":0.3305,"accent":"#ff5fb8","title":{"left":20.661,"top":17.591,"width":61.22,"height":11.176},"shaft":{"left":38.136,"top":30.672,"width":26.271,"height":45.378},"number":{"left":27.068,"top":77.922,"width":57.305,"height":13.765}},
"rosen-arch":{"label":"Rosen · Arch","file":"assets/goal-image-frame/rosen-arch.png","aspect":0.365,"accent":"#ff8fc8","darkTitle":true,"title":{"left":29.716,"top":16.884,"width":42.483,"height":9.869},"shaft":{"left":39.847,"top":28.531,"width":21.456,"height":45.874},"number":{"left":16.107,"top":76.509,"width":68.552,"height":16.213}},
"angelic-heart":{"label":"Angelic · Heart","file":"assets/goal-image-frame/angelic-heart.png","aspect":0.3225,"accent":"#ff9fd0","darkTitle":true,"darkNumber":true,"title":{"left":26.044,"top":23.465,"width":48.786,"height":8.282},"shaft":{"left":37.555,"top":33.38,"width":22.707,"height":44.648},"number":{"left":28.437,"top":79.459,"width":41.817,"height":9.11}},
"halo-ring":{"label":"Halo · Ring","file":"assets/goal-image-frame/halo-ring.png","aspect":0.28,"accent":"#c07bff","title":{"left":22.857,"top":12.988,"width":53.793,"height":14.714},"shaft":{"left":41.379,"top":29.931,"width":16.749,"height":45.793},"number":{"left":16.611,"top":78.108,"width":65.793,"height":19.233}},
"frost-crystal":{"label":"Frost · Crystal","file":"assets/goal-image-frame/frost-crystal.png","aspect":0.3025,"accent":"#6db8ff","title":{"left":12.877,"top":18.127,"width":63.288,"height":14.851},"shaft":{"left":38.813,"top":35.221,"width":23.744,"height":41.713},"number":{"left":17.9,"top":78.989,"width":63.288,"height":15.779}},
"nordic-heart":{"label":"Nordic · Heart","file":"assets/goal-image-frame/nordic-heart.png","aspect":0.3592,"accent":"#9b5cff","title":{"left":22.727,"top":26.667,"width":54.924,"height":9.524},"shaft":{"left":40.909,"top":36.871,"width":18.939,"height":40.408},"number":{"left":21.045,"top":79.314,"width":57.909,"height":15.657}}};

  const TYPES={
    follows:{matches:e=>e.type==='follow',amount:()=>1,             label:'FÖLJARE MÅL'},
    likes:  {matches:e=>e.type==='like'||e.type==='likes',  amount:e=>Number(e.count)||1,label:'LIKE MÅL'},
    shares: {matches:e=>e.type==='share', amount:()=>1,             label:'DELNINGSMÅL'},
    gifts:  {matches:e=>e.type==='gift',  amount:()=>1,             label:'GÅVOMÅL'},
    diamonds:{matches:e=>e.type==='gift', amount:e=>Number(e.value)||0,label:'DIAMANTMÅL'}
  };

  const typeName=VyraWidget.get('type','follows').toLowerCase();
  const handler=TYPES[typeName]||TYPES.follows;
  if(!TYPES[typeName])VyraWidget.warn(`okänd ?type=${typeName} — faller tillbaka på "follows"`);

  // ?design= är den riktiga parametern; ?variant= accepteras som alias eftersom
  // Studios standalone-katalog (standalone-widgets.js) skickar sitt fritextfält så.
  const designId=VyraWidget.get('design','')||VyraWidget.get('variant','royal-gold');
  const design=DESIGNS[designId]||DESIGNS['royal-gold'];
  if(!DESIGNS[designId])VyraWidget.warn(`okänd ?design=${designId} — faller tillbaka på "royal-gold"`);

  const widgetEl=document.getElementById('widget');
  widgetEl.style.setProperty('--aspect',design.aspect);
  widgetEl.style.setProperty('--accent',design.accent);
  document.getElementById('frame-img').src=design.file;

  function place(elId,box){
    const el=document.getElementById(elId);
    el.style.left=box.left+'%';
    el.style.top=box.top+'%';
    el.style.width=box.width+'%';
    el.style.height=box.height+'%';
  }
  place('title-box',design.title);
  place('number-box',design.number);

  place('shaft-box',design.shaft);
  if(design.darkText||design.darkTitle)widgetEl.setAttribute('data-dark-title','');
  if(design.darkText||design.darkNumber)widgetEl.setAttribute('data-dark-number','');

  const goal=Math.max(1,Number(VyraWidget.get('goal',1000))||1000);

  const labelEl=document.getElementById('goal-label');
  const currentEl=document.getElementById('current-value');
  const goalEl=document.getElementById('goal-value');
  const pctEl=document.getElementById('percentage-value');
  const fillEl=document.getElementById('shaft-fill');

  labelEl.textContent=VyraWidget.get('label',handler.label);

  const fmt=n=>Math.round(n).toLocaleString('en-US').replace(/,/g,'');

  goalEl.textContent=fmt(goal);

  let total=0;

  function paint(){
    const ratio=Math.min(1,Math.max(0,total/goal));
    currentEl.textContent=fmt(total);
    pctEl.textContent=(ratio*100).toFixed(1)+'%';
    fillEl.style.height=(ratio*100)+'%';
  }

  function add(amount){
    if(!(amount>0))return;
    total+=amount;
    paint();
  }

  function render(eventOrNumber){
    if(typeof eventOrNumber==='number'){add(eventOrNumber);return}
    const event=eventOrNumber;
    if(!event||!handler.matches(event))return;
    add(handler.amount(event));
  }

  window.VyraGoalWidget={
    render,
    reset(){total=0;paint()},
    getState:()=>({type:typeName,design:designId,goal,total})
  };

  const seed=Number(VyraWidget.get('current',0))||0;
  if(seed>0)total=seed;
  paint();

  const params=VyraWidget.getParams();
  if(params.uid){
    VyraWidget.connect({uid:params.uid,onEvent:render});
  }else{
    VyraWidget.warn('Inget uid — ansluter inte till någon live-ström (förhandsgranskningsläge).');
  }
})();
</script>
</body>
</html>
