<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA · Goal — Neon Pulse</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%}

  *{box-sizing:border-box}

  body{
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }

  :root{
    --cyan:#2fe3ff;
    --cyan-dim:#0d7f99;
    --magenta:#ff4fd8;
    --hot:#ff9df0;
    --shell:#0a1420;
  }

  .widget{
    position:relative;
    width:min(100vw,1000px);height:min(100vh,320px);min-height:190px;
    isolation:isolate;user-select:none;
  }

  .head-row{
    position:absolute;top:34px;left:4%;right:4%;
    display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:24px;
    z-index:2;
  }

  .copy{min-width:0;text-shadow:0 2px 6px rgba(0,0,0,.9)}

  .label{
    margin-bottom:1px;color:var(--cyan);
    font-size:clamp(15px,2.3vw,23px);font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;white-space:nowrap;
    text-shadow:0 0 12px rgba(47,227,255,.6),0 2px 5px rgba(0,0,0,.9);
  }

  .numbers{
    display:flex;align-items:baseline;gap:.2em;color:#fff;
    font-size:clamp(30px,5vw,54px);font-weight:600;line-height:1.05;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .sep{color:#b9c6d4;font-weight:400}

  .pct{
    justify-self:start;align-self:end;padding:0 0 6px 8px;
    color:var(--cyan);font-size:clamp(18px,3vw,30px);font-weight:600;line-height:1;
    text-shadow:0 0 14px rgba(47,227,255,.7),0 2px 5px rgba(0,0,0,.9);
    white-space:nowrap;font-variant-numeric:tabular-nums;
  }

  /* ---- the bar ---- */
  .bar-wrap{
    position:absolute;left:4%;right:4%;bottom:52px;height:34px;
    display:flex;align-items:center;gap:14px;
  }

  .track{
    position:relative;flex:1 1 auto;height:26px;border-radius:4px;
    background:
      repeating-linear-gradient(90deg,
        rgba(47,227,255,.14) 0 2px,transparent 2px 26px),
      linear-gradient(180deg,rgba(10,26,40,.92),rgba(4,12,20,.94));
    border:1px solid rgba(47,227,255,.34);
    box-shadow:inset 0 0 14px rgba(0,0,0,.8),0 0 10px rgba(47,227,255,.14);
    overflow:visible;
  }

  .fill{
    position:absolute;left:1px;top:1px;bottom:1px;width:calc(var(--pct,0) * 100%);
    border-radius:3px;
    background:linear-gradient(90deg,var(--cyan) 0%,#7bb8ff 42%,var(--magenta) 100%);
    box-shadow:
      0 0 12px rgba(47,227,255,.75),
      0 0 26px rgba(255,79,216,.5),
      inset 0 0 10px rgba(255,255,255,.35);
    transition:width 520ms cubic-bezier(.2,.85,.2,1);
  }
  .fill::after{
    content:"";position:absolute;inset:0;border-radius:3px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    opacity:.5;animation:pulse-sweep 2.4s ease-in-out infinite;
  }

  .head{
    position:absolute;top:50%;left:calc(var(--pct,0) * 100%);
    width:0;height:0;
    border-top:13px solid transparent;border-bottom:13px solid transparent;
    border-left:16px solid var(--hot);
    transform:translateY(-50%);
    filter:drop-shadow(0 0 8px rgba(255,157,240,.95)) drop-shadow(0 0 18px rgba(255,79,216,.7));
    transition:left 520ms cubic-bezier(.2,.85,.2,1);
  }

  .chev{
    flex:0 0 auto;color:var(--magenta);
    font-size:clamp(15px,2.3vw,22px);font-weight:700;letter-spacing:.1em;line-height:1;
    text-shadow:0 0 10px rgba(255,79,216,.85);
  }

  @keyframes pulse-sweep{
    0%,100%{transform:translateX(-30%);opacity:.18}
    50%{transform:translateX(30%);opacity:.55}
  }

  /* ---- senaste händelsen ---- */
  .toast{
    position:absolute;top:22px;right:4%;z-index:3;
    padding:7px 15px;border-radius:999px;
    background:linear-gradient(135deg,rgba(255,79,216,.94),rgba(150,40,190,.94));
    border:1px solid rgba(255,190,245,.7);
    color:#fff;font-size:clamp(12px,1.7vw,16px);font-weight:600;letter-spacing:.03em;
    box-shadow:0 0 16px rgba(255,79,216,.6);
    opacity:0;transform:translateY(-6px) scale(.94);pointer-events:none;
    transition:opacity 220ms ease,transform 220ms ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateY(0) scale(1)}

  /* ---- stående läge ---- */
  html[data-orientation="vertical"] .widget{
    width:min(100vw,420px);height:min(100vh,900px);min-height:520px;
  }
  html[data-orientation="vertical"] .head-row{
    top:26px;grid-template-columns:1fr;justify-items:center;row-gap:4px;text-align:center;
  }
  html[data-orientation="vertical"] .numbers{justify-content:center}
  html[data-orientation="vertical"] .pct{justify-self:center;align-self:auto;padding:2px 0 0}

  html[data-orientation="vertical"] .bar-wrap{
    left:0;right:0;top:288px;bottom:44px;height:auto;
    flex-direction:column-reverse;align-items:center;gap:12px;
  }
  html[data-orientation="vertical"] .track{
    width:26px;height:auto;flex:1 1 auto;
    background:
      repeating-linear-gradient(0deg,
        rgba(47,227,255,.14) 0 2px,transparent 2px 26px),
      linear-gradient(90deg,rgba(10,26,40,.92),rgba(4,12,20,.94));
  }
  html[data-orientation="vertical"] .fill{
    left:1px;right:1px;bottom:1px;top:auto;
    width:auto;height:calc(var(--pct,0) * 100%);
    background:linear-gradient(0deg,var(--cyan) 0%,#7bb8ff 42%,var(--magenta) 100%);
    transition:height 520ms cubic-bezier(.2,.85,.2,1);
  }
  html[data-orientation="vertical"] .head{
    left:50%;top:auto;bottom:calc(var(--pct,0) * 100%);
    border-left:13px solid transparent;border-right:13px solid transparent;
    border-bottom:16px solid var(--hot);border-top:0;
    transform:translateX(-50%);
    transition:bottom 520ms cubic-bezier(.2,.85,.2,1);
  }
  html[data-orientation="vertical"] .chev{transform:rotate(-90deg)}
  html[data-orientation="vertical"] .toast{right:auto;left:50%;transform:translateX(-50%) translateY(-6px) scale(.94)}
  html[data-orientation="vertical"] .toast.show{transform:translateX(-50%) translateY(0) scale(1)}

  @media (max-width:680px){
    .head-row{column-gap:14px}
    .bar-wrap{bottom:34px}
    .track{height:20px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
  <main class="widget">
    <div class="toast" id="toast" aria-live="polite"></div>

    <section class="head-row">
      <div class="copy">
        <div class="label" id="goal-label">FOLLOWER GOAL</div>
        <div class="numbers">
          <span id="current-value">0</span>
          <span class="sep">/</span>
          <span id="goal-value">1000</span>
        </div>
      </div>

      <div class="pct" id="percentage-value">0.0%</div>
    </section>

    <section class="bar-wrap" aria-label="Progress">
      <div class="track" id="track">
        <div class="fill" id="fill"></div>
        <div class="head" id="head" aria-hidden="true"></div>
      </div>
      <div class="chev" aria-hidden="true">&gt;&gt;&gt;</div>
    </section>
  </main>

<script src="base-widget.js"></script>
<script>
(function(){
  'use strict';

  // What counts toward the goal, by how much, and what the widget calls itself.
  // Same event vocabulary the ingest endpoint validates: gift/like/chat/follow/share/member.
  const TYPES={
    follows:{matches:e=>e.type==='follow',amount:()=>1,                 label:'FOLLOWER GOAL'},
    likes:  {matches:e=>e.type==='like'||e.type==='likes',  amount:e=>Number(e.count)||1, label:'LIKE GOAL'},
    shares: {matches:e=>e.type==='share', amount:()=>1,                 label:'SHARE GOAL'},
    gifts:  {matches:e=>e.type==='gift',  amount:()=>1,                 label:'GIFT GOAL'},
    diamonds:{matches:e=>e.type==='gift', amount:e=>Number(e.value)||0, label:'DIAMOND GOAL'}
  };

  const typeName=VyraWidget.get('type','follows').toLowerCase();
  const handler=TYPES[typeName]||TYPES.follows;
  if(!TYPES[typeName])VyraWidget.warn(`okänd ?type=${typeName} — faller tillbaka på "follows"`);

  const goal=Math.max(1,Number(VyraWidget.get('goal',1000))||1000);
  const toastMs=Math.max(0,Number(VyraWidget.get('toast',2600))||0);

  const params=VyraWidget.getParams();
  document.documentElement.dataset.variant=params.variant;

  // liggande (default) eller stående
  const orientationRaw=VyraWidget.get('orientation','horizontal').toLowerCase();
  const vertical=orientationRaw==='vertical'||orientationRaw==='v'||orientationRaw==='stående';
  document.documentElement.dataset.orientation=vertical?'vertical':'horizontal';

  const trackEl=document.getElementById('track');
  const labelEl=document.getElementById('goal-label');
  const currentEl=document.getElementById('current-value');
  const goalEl=document.getElementById('goal-value');
  const pctEl=document.getElementById('percentage-value');
  const toastEl=document.getElementById('toast');

  labelEl.textContent=VyraWidget.get('label',handler.label);

  const fmt=n=>Math.round(n).toLocaleString('en-US').replace(/,/g,'');
  goalEl.textContent=fmt(goal);

  let total=0,toastTimer=null;

  function paint(){
    const ratio=Math.min(1,Math.max(0,total/goal));
    // one custom property drives the fill length and the arrow head together, so
    // they can never drift apart
    trackEl.style.setProperty('--pct',ratio.toFixed(5));
    currentEl.textContent=fmt(total);
    pctEl.textContent=(ratio*100).toFixed(1)+'%';
  }

  function showToast(amount,username){
    if(!toastMs)return;
    const who=username?' @'+String(username).slice(0,24):'';
    toastEl.textContent='+'+fmt(amount)+who;
    toastEl.classList.remove('show');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toastEl.classList.remove('show'),toastMs);
  }

  function add(amount){
    if(!(amount>0))return;
    total+=amount;
    paint();
  }

  // Accepts a TikTok-shaped event (filtered/weighted per ?type=) or a plain number
  // to add directly, for simple testing.
  function render(eventOrNumber){
    if(typeof eventOrNumber==='number'){add(eventOrNumber);return}
    const event=eventOrNumber;
    if(!event||!handler.matches(event))return;
    const amount=handler.amount(event);
    if(!(amount>0))return;
    add(amount);
    showToast(amount,event.username);
  }

  window.VyraGoalWidget={
    render,
    reset(){total=0;paint();toastEl.classList.remove('show')},
    getState:()=>({type:typeName,goal,total,ratio:Math.min(1,total/goal)})
  };

  // ?current= seeds a starting value so the widget can be previewed without a stream
  const seed=Number(VyraWidget.get('current',0))||0;
  if(seed>0)total=seed;
  paint();

  if(params.uid){
    VyraWidget.connect({uid:params.uid,onEvent:render});
  }else{
    VyraWidget.warn('Inget uid — ansluter inte till någon live-ström (förhandsgranskningsläge).');
  }
})();
</script>
</body>
</html>
