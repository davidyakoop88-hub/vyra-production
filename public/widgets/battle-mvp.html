<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA · Battle MVP</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%;width:100%}
  body{
    display:flex;align-items:center;justify-content:center;height:100vh;
    font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif;
    color:#f6e9c8;
  }

  #stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}

  /* ---- Phase 1 (0-1s): light converging to center ---- */
  #rays{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .5s ease}
  #stage.phase-light #rays,#stage.phase-entrance #rays,#stage.phase-tribute #rays{opacity:1}
  #stage.phase-end #rays{opacity:0;transition:opacity 1s ease}
  .ray{
    position:absolute;left:50%;top:50%;width:2px;height:46vh;
    background:linear-gradient(0deg,rgba(246,199,107,.85),rgba(180,120,255,.35) 45%,transparent 90%);
    transform-origin:50% 100%;
    transform:translate(-50%,-100%) rotate(var(--ray-angle)) scaleY(0);
    opacity:0;will-change:transform,opacity;
    animation:ray-grow 1s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay:var(--ray-delay,0s);
  }
  @keyframes ray-grow{0%{opacity:0;transform:translate(-50%,-100%) rotate(var(--ray-angle)) scaleY(0)}60%{opacity:1}100%{opacity:.75;transform:translate(-50%,-100%) rotate(var(--ray-angle)) scaleY(1)}}
  #spark{
    position:absolute;width:14px;height:14px;border-radius:50%;background:#fff6de;
    box-shadow:0 0 40px 14px rgba(246,199,107,.9),0 0 90px 30px rgba(180,120,255,.5);
    opacity:0;transform:scale(0);
    animation:spark-pop 1s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes spark-pop{0%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1.4)}100%{opacity:.9;transform:scale(1)}}

  /* ---- Phase 2 (1-3s): portrait + crystal wreath entrance, holds through tribute ---- */
  #portrait-wrap{position:relative;width:15rem;height:15rem;opacity:0;transform:scale(.4) translateY(10px);transition:none}
  #stage.phase-entrance #portrait-wrap,#stage.phase-tribute #portrait-wrap{
    opacity:1;transform:scale(1) translateY(0);
    transition:opacity .9s cubic-bezier(.2,.9,.2,1),transform .9s cubic-bezier(.2,1.4,.3,1);
  }
  #stage.phase-end #portrait-wrap{opacity:0;transform:scale(1.15) translateY(-16px);transition:opacity 1s ease,transform 1s ease}

  #wreath{position:absolute;inset:0}
  .gem{
    position:absolute;left:50%;top:50%;width:1.6rem;height:1.6rem;margin:-.8rem;
    transform:rotate(var(--angle)) translate(0,-7.6rem) rotate(calc(var(--angle) * -1)) scale(0);
    opacity:0;
    animation:gem-in .6s cubic-bezier(.2,1.6,.3,1) forwards;
    animation-delay:var(--gem-delay,0s);
    filter:drop-shadow(0 0 6px var(--gem-color));
  }
  @keyframes gem-in{to{opacity:1;transform:rotate(var(--angle)) translate(0,-7.6rem) rotate(calc(var(--angle) * -1)) scale(1)}}

  #portrait{
    position:absolute;inset:1.2rem;border-radius:50%;overflow:hidden;
    background:#241a38;border:3px solid #f6c76b;
    box-shadow:0 0 0 6px rgba(8,4,20,.6),0 0 40px rgba(246,199,107,.6),0 0 70px rgba(180,120,255,.4);
  }
  #portrait img{width:100%;height:100%;object-fit:cover;display:block}
  #portrait svg{width:100%;height:100%;padding:18%;box-sizing:border-box;fill:#5a5170}

  /* ---- Phase 3 (3-8s): tribute text — person-first hierarchy ---- */
  #tribute-text{
    position:absolute;top:76%;left:50%;transform:translateX(-50%);text-align:center;width:max-content;max-width:88vw;
  }
  #tribute-text>*{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
  #stage.phase-tribute #thanks{opacity:1;transform:none;transition-delay:.05s}
  #stage.phase-tribute #username{opacity:1;transform:none;transition-delay:.35s}
  #stage.phase-tribute #subtitle{opacity:1;transform:none;transition-delay:.75s}
  #stage.phase-tribute #label{opacity:1;transform:none;transition-delay:1.1s}
  #stage.phase-end #tribute-text>*{opacity:0;transform:translateY(-10px);transition:opacity .8s ease,transform .8s ease}

  #thanks{font-size:1.3rem;letter-spacing:.5em;color:#d9c9ff;text-transform:uppercase;margin-bottom:.3rem}
  /* The person IS the scene: username is the single largest, brightest element in the whole
     widget — everything else (thanks/subtitle/score) is intentionally smaller and quieter. */
  #username{
    font-size:3.4rem;font-weight:700;color:#fff6de;
    text-shadow:0 0 30px rgba(246,199,107,.8),0 0 70px rgba(180,120,255,.5);
    margin-bottom:.4rem;line-height:1.05;
  }
  #subtitle{font-size:1.15rem;letter-spacing:.12em;color:#e3d3ff;text-transform:uppercase;margin-bottom:.6rem}
  /* De-emphasized via a muted color only, NOT its own opacity — an opacity here would have the
     same CSS specificity as (and come after, so win over) the #tribute-text>* phase-visibility
     rule below, permanently pinning this element visible regardless of phase. */
  #label{font-size:.8rem;letter-spacing:.2em;color:#a597c4;text-transform:uppercase}
  #label b{color:#c9a8de;font-weight:700}

  /* ---- Phase 4 (8-9s): dissolve into rising particles ---- */
  #particles{position:absolute;inset:0;pointer-events:none}
  .mote{
    position:absolute;bottom:38%;border-radius:50%;background:radial-gradient(circle,#fff6de,#f6c76b 60%,transparent 75%);
    opacity:0;will-change:transform,opacity;
    animation:mote-rise var(--mote-duration,1.4s) ease-out forwards;
    animation-delay:var(--mote-delay,0s);
  }
  @keyframes mote-rise{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--mote-drift,0),-22rem) scale(1)}}
</style>
</head>
<body>
  <div id="stage">
    <div id="rays"></div>
    <div id="portrait-wrap">
      <div id="wreath"></div>
      <div id="portrait"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-9 2.2-9 5v3h18v-3c0-2.8-4.6-5-9-5Z"/></svg></div>
    </div>
    <div id="tribute-text">
      <div id="thanks">TACK</div>
      <div id="username">@ANVÄNDARNAMN</div>
      <div id="subtitle">DU GJORDE SKILLNADEN</div>
      <div id="label"><b id="mvp-label">BATTLE MVP</b> · <span id="mvp-score">15 000</span> POÄNG</div>
    </div>
    <div id="particles"></div>
  </div>

<script src="base-widget.js"></script>
<script>
(function(){
  'use strict';
  const params = new URLSearchParams(location.search);

  // Timeline exactly matching the design brief: 0-1s light, 1-3s entrance, 3-8s tribute (the
  // longest phase — the message matters more than the score), 8-9s dissolve, then idle.
  const PHASE_AT = { light: 0, entrance: 1000, tribute: 3000, end: 8000, done: 9000 };

  const stage = document.getElementById('stage');
  const raysEl = document.getElementById('rays');
  const wreathEl = document.getElementById('wreath');
  const portraitImgHolder = document.getElementById('portrait');
  const particlesEl = document.getElementById('particles');

  const RAY_COUNT = 8, GEM_COUNT = 12;
  const GEM_COLORS = ['#f6c76b', '#b478ff', '#5ec8ff', '#f6c76b', '#b478ff'];

  function buildRays() {
    raysEl.innerHTML = '';
    for (let i = 0; i < RAY_COUNT; i++) {
      const ray = document.createElement('div');
      ray.className = 'ray';
      ray.style.setProperty('--ray-angle', (i * (360 / RAY_COUNT)) + 'deg');
      ray.style.setProperty('--ray-delay', (Math.random() * 0.2) + 's');
      raysEl.append(ray);
    }
    const spark = document.createElement('div');
    spark.id = 'spark';
    raysEl.append(spark);
  }

  function buildWreath() {
    wreathEl.innerHTML = '';
    for (let i = 0; i < GEM_COUNT; i++) {
      const gem = document.createElement('div');
      gem.className = 'gem';
      gem.style.setProperty('--angle', (i * (360 / GEM_COUNT)) + 'deg');
      gem.style.setProperty('--gem-delay', (i * 0.06) + 's');
      gem.style.setProperty('--gem-color', GEM_COLORS[i % GEM_COLORS.length]);
      gem.innerHTML = `<svg viewBox="0 0 24 24" fill="${GEM_COLORS[i % GEM_COLORS.length]}"><path d="M12 2 3 9l9 13 9-13z" opacity=".9"/><path d="M12 2 6 9h12z" opacity=".55"/><path d="M3 9h18l-9 13z" opacity=".75"/></svg>`;
      wreathEl.append(gem);
    }
  }

  function spawnParticles() {
    particlesEl.innerHTML = '';
    const count = 26;
    for (let i = 0; i < count; i++) {
      const mote = document.createElement('div');
      mote.className = 'mote';
      const size = 3 + Math.random() * 5;
      mote.style.width = size + 'px';
      mote.style.height = size + 'px';
      mote.style.left = (46 + Math.random() * 8) + '%';
      mote.style.setProperty('--mote-drift', (Math.random() * 120 - 60) + 'px');
      mote.style.setProperty('--mote-duration', (1.1 + Math.random() * 0.9) + 's');
      mote.style.setProperty('--mote-delay', (Math.random() * 0.6) + 's');
      particlesEl.append(mote);
    }
  }

  function applyContent(data) {
    document.getElementById('thanks').textContent = data.thanks || 'TACK';
    document.getElementById('username').textContent = data.username ? `@${String(data.username).replace(/^@/, '')}` : '@ANVÄNDARNAMN';
    document.getElementById('subtitle').textContent = data.subtitle || 'DU GJORDE SKILLNADEN';
    document.getElementById('mvp-label').textContent = data.label || 'BATTLE MVP';
    const score = Number(data.score);
    document.getElementById('mvp-score').textContent = Number.isFinite(score) ? score.toLocaleString('sv-SE') : (data.score || '');

    portraitImgHolder.querySelector('img')?.remove();
    if (data.profileUrl) {
      const img = document.createElement('img');
      img.src = data.profileUrl;
      img.alt = '';
      img.onerror = () => img.remove(); // falls back to the silhouette svg underneath
      portraitImgHolder.append(img);
    }
  }

  let playing = false;
  const queue = [];
  const timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers.length = 0 }

  function playSequence(data) {
    playing = true;
    applyContent(data);
    buildRays();
    buildWreath();
    stage.className = ''; // reset any previous phase classes
    void stage.offsetWidth; // restart CSS animations even for back-to-back triggers

    timers.push(setTimeout(() => stage.classList.add('phase-light'), PHASE_AT.light));
    timers.push(setTimeout(() => stage.classList.add('phase-entrance'), PHASE_AT.entrance));
    timers.push(setTimeout(() => stage.classList.add('phase-tribute'), PHASE_AT.tribute));
    timers.push(setTimeout(() => { stage.classList.add('phase-end'); spawnParticles() }, PHASE_AT.end));
    timers.push(setTimeout(() => {
      stage.className = '';
      particlesEl.innerHTML = '';
      playing = false;
      const next = queue.shift();
      if (next) playSequence(next);
    }, PHASE_AT.done));
  }

  // Public hook — "Battle MVP" isn't a single real TikTok event (deciding who the MVP is
  // requires judgment/aggregation this widget doesn't do itself), so this is meant to be invoked
  // explicitly — from a future Studio action, a manual trigger, or a script — rather than
  // auto-firing off a guessed event type. render()/trigger() are the same function.
  function trigger(data) {
    if (!data) return;
    if (playing) { queue.push(data); return }
    playSequence(data);
  }
  window.VyraBattleMvpWidget = { render: trigger, trigger };

  const configuredTrigger = {
    username: params.get('username'),
    profileUrl: params.get('profile'),
    thanks: params.get('thanks'),
    subtitle: params.get('subtitle'),
    label: params.get('label'),
    score: params.get('score')
  };

  const uid = params.get('uid');
  if (uid) {
    // Connected for forward-compatibility (a future automation could publish a dedicated event
    // this listens for), but no default live-event auto-fires the ceremony today — see above.
    VyraWidget.connect({ uid, onEvent() {} });
  } else {
    VyraWidget.warn('Inget uid — ansluter inte till någon live-ström (förhandsgranskningsläge).');
  }

  if (params.get('auto') === '1' || params.get('auto') === 'true') {
    trigger({
      username: configuredTrigger.username || 'Användarnamn',
      profileUrl: configuredTrigger.profileUrl,
      thanks: configuredTrigger.thanks,
      subtitle: configuredTrigger.subtitle,
      label: configuredTrigger.label,
      score: configuredTrigger.score || 15000
    });
  }
})();
</script>
</body>
</html>
