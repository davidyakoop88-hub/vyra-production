<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRA · VIP Zone</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%}
  body{display:flex;align-items:flex-start;justify-content:flex-end;height:100vh;font-family:'Segoe UI',system-ui,sans-serif}

  :root{
    --accent-a:#8d3cff;--accent-b:#25e2ff;--text:#fff;--sub:#d9c9ff;
    --panel-bg:linear-gradient(180deg,rgba(30,10,50,.92),rgba(10,6,30,.92));
    --glow:0 0 30px rgba(141,60,255,.4);--row-hi:rgba(141,60,255,.35);
  }
  html[data-variant="celestial"]{
    --accent-a:#f6c76b;--accent-b:#ffe9c2;--text:#fff8ec;--sub:#f0d9a8;
    --panel-bg:linear-gradient(180deg,rgba(70,42,10,.92),rgba(40,20,4,.92));
    --glow:0 0 30px rgba(246,199,107,.4);--row-hi:rgba(246,199,107,.35);
  }

  #panel{
    margin:4vh 4vw 0 0;width:300px;border-radius:18px;overflow:hidden;
    background:var(--panel-bg);border:1px solid color-mix(in srgb,var(--accent-a) 55%,transparent);
    box-shadow:var(--glow);
  }
  #panel-title{
    padding:12px 18px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text);background:linear-gradient(90deg,var(--accent-a),var(--accent-b));
  }
  #rows{display:flex;flex-direction:column;max-height:420px;overflow:hidden}
  .row{
    display:flex;align-items:center;gap:9px;padding:7px 16px;
    border-top:1px solid color-mix(in srgb,var(--accent-a) 22%,transparent);
    background:transparent;transition:background .5s ease;
  }
  .row.flash{background:var(--row-hi);transition:background 0s}
  .row .rank{width:18px;flex:none;text-align:center;font-weight:800;font-size:13px;color:var(--sub)}
  .row .badge{width:20px;flex:none;text-align:center;font-size:15px}
  .row .name{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .score{font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
  .row.empty .name{color:var(--sub);font-weight:400;font-style:italic}
</style>
</head>
<body>
  <div id="panel">
    <div id="panel-title">VIP-zonen</div>
    <div id="rows"></div>
  </div>

<script src="base-widget.js"></script>
<script>
(function(){
  'use strict';
  const params=VyraWidget.getParams();
  document.documentElement.dataset.variant=params.variant==='celestial'?'celestial':'cyber';

  const rowsEl=document.getElementById('rows');
  const RANK_COUNT=10;

  // Ordered highest-first so the first threshold a score clears wins.
  const TIERS=[
    {name:'Legendary',min:5000,badge:'👑'},
    {name:'Diamond',min:1000,badge:'💎'},
    {name:'Gold',min:500,badge:'🥇'},
    {name:'Silver',min:200,badge:'🥈'},
    {name:'Bronze',min:50,badge:'🥉'}
  ];
  function tierFor(score){return TIERS.find(t=>score>=t.min)||null}

  // Weighted loyalty score: 1 diamond = 1pt, 1 like = 0.1pt, 1 follow = 50pt, 1 share = 20pt.
  const SCORERS={
    gift:e=>Number(e.value)||0,
    like:e=>(Number(e.count)||1)*0.1,
    follow:()=>50,
    share:()=>20
  };
  SCORERS.likes=SCORERS.like; // rå bryggtyp 'likes' — samma mönster som last-x-alerts

  const totals=new Map(); // key -> {username, score}
  let rowEls=[];

  function ensureRows(){
    if(rowEls.length)return;
    for(let i=0;i<RANK_COUNT;i++){
      const row=document.createElement('div');
      row.className='row empty';
      row.innerHTML=`<span class="rank">${i+1}</span><span class="badge"></span><span class="name">—</span><span class="score">0</span>`;
      rowsEl.append(row);
      rowEls.push(row);
    }
  }

  function topTen(){
    return[...totals.values()].sort((a,b)=>b.score-a.score).slice(0,RANK_COUNT);
  }

  function redraw(changedKey){
    ensureRows();
    const top=topTen();
    for(let i=0;i<RANK_COUNT;i++){
      const entry=top[i],row=rowEls[i];
      const badgeEl=row.querySelector('.badge'),nameEl=row.querySelector('.name'),scoreEl=row.querySelector('.score');
      if(!entry){
        row.classList.add('empty');
        badgeEl.textContent='';nameEl.textContent='—';scoreEl.textContent='0';
        continue;
      }
      row.classList.remove('empty');
      const tier=tierFor(entry.score);
      badgeEl.textContent=tier?tier.badge:'';
      nameEl.textContent=entry.username;
      scoreEl.textContent=Math.round(entry.score).toLocaleString('sv-SE');
      if(changedKey&&entry.key===changedKey){
        row.classList.remove('flash');void row.offsetWidth;row.classList.add('flash');
      }
    }
  }

  function addScore(key,username,points){
    const existing=totals.get(key)||{key,username,score:0};
    existing.username=username;
    existing.score+=points;
    totals.set(key,existing);
    redraw(key);
  }

  // Public hook — accepts any TikTok-shaped event; only gift/like/follow/share contribute score.
  function render(event){
    if(!event)return;
    const scorer=SCORERS[event.type];
    if(!scorer)return;
    const key=String(event.userId||event.username||'').toLowerCase();
    if(!key)return;
    addScore(key,String(event.username||event.userId||'Anonym').slice(0,60),scorer(event));
  }
  window.VyraVipZoneWidget={render,reset(){totals.clear();redraw()}};
  redraw();

  if(params.uid){
    VyraWidget.connect({uid:params.uid,onEvent:render});
  }else{
    VyraWidget.warn('Inget uid — ansluter inte till någon live-ström (förhandsgranskningsläge).');
  }
})();
</script>
</body>
</html>
