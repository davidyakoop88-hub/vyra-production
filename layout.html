  <script src="layout-standalone.js?v=20260724-1"></script>
  <script>
    (function () {
      var key = 'vyra-sidebar-collapsed';
      function apply(collapsed) {
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        document.querySelector('aside').classList.toggle('collapsed', collapsed);
      }
      apply(localStorage.getItem(key) === '1');
      document.querySelector('.sidebar-collapse-toggle').onclick = function () {
        var collapsed = !document.body.classList.contains('sidebar-collapsed');
        localStorage.setItem(key, collapsed ? '1' : '0');
        apply(collapsed);
      };
    })();
  </script>
