<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" role="img"
     aria-label="En knappenhet med femton knappar. Fyra är VYRA-knappar märkta scen-1, scen-2, fyrverkeri och paus.">
<!--
  ILLUSTRATION, INTE ETT PRODUKTFOTO. Elgatos egna bilder är deras och hör inte hemma på en publik
  sida. Den här är ritad i VYRA:s palett och bär information: de tända knapparna visar just de
  NYCKLAR guiden bredvid ber en fylla i.

  DJUPET ÄR MÅLAT, INTE FILTRERAT. Varje tangent har en egen toppdager och en mörk underkant, och
  plattan har en ljusfångare längs överkanten. Det ger volym utan en enda CSS-skugga per element —
  en bitmapp hade kostat femtio gånger mer och skalat sämre.
-->
  <defs>
    <linearGradient id="platta" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#2b1a3d"/><stop offset=".55" stop-color="#1b1028"/><stop offset="1" stop-color="#120a1b"/>
    </linearGradient>
    <linearGradient id="kant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tangent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241534"/><stop offset="1" stop-color="#150c1f"/>
    </linearGradient>
    <linearGradient id="vyra" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#a044d6"/><stop offset=".5" stop-color="#7c2dbe"/><stop offset="1" stop-color="#5a1f92"/>
    </linearGradient>
    <linearGradient id="dager" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/><stop offset=".45" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="spegel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c2dbe" stop-opacity=".30"/><stop offset="1" stop-color="#7c2dbe" stop-opacity="0"/>
    </linearGradient>
    <filter id="mjuk" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="kastad" x="-30%" y="-20%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- ambient sken bakom enheten -->
  <ellipse cx="140" cy="102" rx="118" ry="76" fill="#7c2dbe" opacity=".13" filter="url(#mjuk)"/>

  <g filter="url(#kastad)">
    <!-- stativ, bakom plattan -->
    <path d="M112 172h56l14 16h-84z" fill="#160d20"/>
    <path d="M112 172h56l2.5 3h-61z" fill="#2b1a3d"/>

    <!-- plattan -->
    <rect x="14" y="14" width="252" height="160" rx="17" fill="url(#platta)"/>
    <rect x="14" y="14" width="252" height="160" rx="17" fill="url(#kant)"/>
    <rect x="14.5" y="14.5" width="251" height="159" rx="16.5" fill="none" stroke="#c467df" stroke-opacity=".20"/>
  </g>

  <g font-family="Manrope, system-ui, sans-serif" text-anchor="middle">
    <!-- RAD 1 -->
    <g filter="url(#mjuk)">
      <rect x="28" y="28" width="46" height="42" rx="9" fill="url(#vyra)"/>
      <rect x="82" y="28" width="46" height="42" rx="9" fill="url(#vyra)"/>
    </g>
    <rect x="28" y="28" width="46" height="42" rx="9" fill="url(#dager)"/>
    <rect x="82" y="28" width="46" height="42" rx="9" fill="url(#dager)"/>
    <circle cx="51" cy="43" r="6" fill="#fff" fill-opacity=".95"/>
    <text x="51" y="62" font-size="7.5" font-weight="700" fill="#fff">scen-1</text>
    <circle cx="105" cy="43" r="6" fill="#fff" fill-opacity=".95"/>
    <text x="105" y="62" font-size="7.5" font-weight="700" fill="#fff">scen-2</text>

    <g fill="url(#tangent)" stroke="#301d40">
      <rect x="136" y="28" width="46" height="42" rx="9"/>
      <rect x="190" y="28" width="46" height="42" rx="9"/>
      <!-- RAD 2 -->
      <rect x="82" y="76" width="46" height="42" rx="9"/>
      <rect x="136" y="76" width="46" height="42" rx="9"/>
      <rect x="190" y="76" width="46" height="42" rx="9"/>
      <!-- RAD 3 -->
      <rect x="28" y="124" width="46" height="42" rx="9"/>
      <rect x="82" y="124" width="46" height="42" rx="9"/>
      <rect x="136" y="124" width="46" height="42" rx="9"/>
    </g>
    <!-- toppdager aven pa de slackta, annars ser de platta ut bredvid de tanda -->
    <g fill="url(#kant)">
      <rect x="136" y="28" width="46" height="42" rx="9"/><rect x="190" y="28" width="46" height="42" rx="9"/>
      <rect x="82" y="76" width="46" height="42" rx="9"/><rect x="136" y="76" width="46" height="42" rx="9"/>
      <rect x="190" y="76" width="46" height="42" rx="9"/>
      <rect x="28" y="124" width="46" height="42" rx="9"/><rect x="82" y="124" width="46" height="42" rx="9"/>
      <rect x="136" y="124" width="46" height="42" rx="9"/>
    </g>

    <g filter="url(#mjuk)"><rect x="28" y="76" width="46" height="42" rx="9" fill="url(#vyra)" fill-opacity=".9"/></g>
    <rect x="28" y="76" width="46" height="42" rx="9" fill="url(#dager)"/>
    <circle cx="51" cy="91" r="6" fill="#fff" fill-opacity=".95"/>
    <text x="51" y="110" font-size="7" font-weight="700" fill="#fff">fyrverkeri</text>

    <g filter="url(#mjuk)">
      <rect x="190" y="124" width="46" height="42" rx="9" fill="#2e1b3f" stroke="#c467df" stroke-opacity=".55"/>
    </g>
    <rect x="190" y="124" width="46" height="42" rx="9" fill="url(#kant)"/>
    <g fill="#c467df"><rect x="207" y="136" width="4.5" height="14" rx="1.6"/><rect x="214.5" y="136" width="4.5" height="14" rx="1.6"/></g>
    <text x="213" y="160" font-size="7" font-weight="700" fill="#d6c8dc">paus</text>
  </g>

  <!-- spegling i bordet: samma silhuett, tonad, aldrig skarp -->
  <g opacity=".5">
    <rect x="30" y="190" width="220" height="16" rx="8" fill="url(#spegel)"/>
  </g>
</svg>
