<!--
  Same proof-of-concept pattern as top-points-prism-live-demo.html, applied to the Voltage design
  (from the same separate design-only Claude session, shared with the owner as an Artifact). See that
  file's header comment for what this proves and does not prove — identical here, just a different skin
  over the same /api/overlay-access/<token>/points contract.
-->
<title>Top gifters exact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0f16; --text-dim: #8892a0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', system-ui, sans-serif; }

  .canvas432 {
    width: 432px; height: 768px; margin: 0 auto; position: relative;
    background:
      radial-gradient(circle at 25% 15%, rgba(120,90,220,.18), transparent 55%),
      radial-gradient(circle at 80% 85%, rgba(20,160,200,.12), transparent 55%),
      #05070b;
    overflow: hidden;
  }

  .conn-badge {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 10px; padding: 3px 10px; border-radius: 999px; letter-spacing: .04em;
    display: flex; align-items: center; gap: 5px;
  }
  .conn-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .conn-badge.live { color: #6dffb0; background: rgba(109,255,176,.1); border: 1px solid rgba(109,255,176,.3); }
  .conn-badge.live .dot { background: #6dffb0; box-shadow: 0 0 6px #6dffb0; animation: pulseDot 1.6s ease-in-out infinite; }
  .conn-badge.error { color: #ff8f8f; background: rgba(255,80,80,.1); border: 1px solid rgba(255,80,80,.3); }
  .conn-badge.error .dot { background: #ff8f8f; }
  .conn-badge.loading { color: var(--text-dim); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); }
  .conn-badge.loading .dot { background: var(--text-dim); }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .empty-state {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; color: var(--text-dim); font-size: 13px; text-align: center;
    padding: 0 40px;
  }
  .empty-state[hidden] { display: none; } /* see prism-live-demo.html's comment on this footgun */
  .empty-state strong { color: #fff; font-size: 16px; font-weight: 800; }

  #board { position: absolute; top: 36px; left: 0; right: 0; padding: 0 14px;
    display: flex; flex-direction: column; gap: 12px; }

  .cb-row {
    display: flex; flex-direction: row; align-items: center; gap: 7px;
    opacity: 0; transform: translateX(-100%);
    animation: cb-slide-in-left .6s cubic-bezier(.175,.885,.32,1.275) forwards;
  }
  @keyframes cb-slide-in-left { 0% { opacity: 0; transform: translateX(-40px); } 100% { opacity: 1; transform: translateX(0); } }

  .cb-avatar-core { position: relative; width: 42px; height: 42px; flex: 0 0 auto; order: 1;
    transform: scale(0) rotate(720deg);
    animation: cb-avatar-spin-in .6s cubic-bezier(.175,.885,.32,1.275) forwards;
    animation-delay: inherit;
  }
  @keyframes cb-avatar-spin-in { 0% { transform: scale(0) rotate(720deg); } 100% { transform: scale(1) rotate(0deg); } }

  .cb-energy-ring { position: absolute; inset: -4px; border-radius: 50%; pointer-events: none; z-index: 1; }
  .cb-ring-layer {
    position: absolute; inset: 0; border-radius: 50%;
    animation: cb-spin 2.4s linear infinite;
    will-change: transform;
  }
  .cb-ring-layer.a { background: conic-gradient(transparent, transparent, var(--c)); box-shadow: 0 0 12px var(--c); }
  .cb-ring-layer.b { inset: -1px; background: conic-gradient(transparent, var(--c), transparent 55%); opacity: .5; }
  @keyframes cb-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .cb-avatar-img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); box-shadow: 0 0 10px var(--c); object-fit: cover; display: block; position: relative; z-index: 2; background: #000; }

  .cb-crown { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 18px; height: 14px; z-index: 3;
    filter: drop-shadow(0 0 3px #ffd700) drop-shadow(0 0 6px #ffb700);
    animation: cb-bounce 2.4s ease-in-out infinite; }
  .cb-crown svg { width: 100%; height: 100%; display: block; }
  @keyframes cb-bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-6px); } }

  .cb-rank-badge { position: absolute; bottom: -2px; left: -1px; width: 15px; height: 15px; border-radius: 50%; z-index: 3;
    background: var(--c); border: 2px solid #14151d; box-shadow: 0 0 7px var(--c), 0 2px 5px rgba(0,0,0,.55);
    color: #0b0b14; font-weight: 900; font-size: 7.5px; display: flex; align-items: center; justify-content: center; }

  .cb-bar { position: relative; order: 2; flex: 0 1 auto; min-width: 0; height: 26px; border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--c) 34%, transparent);
    box-shadow: 0 4px 12px rgba(0,0,0,.42), 0 0 10px -3px var(--c), inset 0 1px 0 rgba(255,255,255,.07);
    background: linear-gradient(180deg, rgba(8,12,18,.9), rgba(4,6,10,.9));
    display: flex; align-items: center; padding: 0 10px; overflow: hidden;
    opacity: 0; transform: scaleX(0); transform-origin: left center;
    animation: cb-bar-expand .8s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes cb-bar-expand { to { opacity: 1; transform: scaleX(1); } }

  .cb-info { font-weight: 800; font-size: 12px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .cb-score-block { order: 3; flex: 0 0 auto; height: 28px; padding: 0 10px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow: 0 4px 10px rgba(0,0,0,.4), 0 0 10px -3px var(--c);
    background: linear-gradient(180deg, rgba(8,12,18,.9), rgba(4,6,10,.9));
    display: flex; align-items: center; justify-content: center; gap: 4px;
    opacity: 0; transform: scale(.6); animation: cb-score-reveal .5s cubic-bezier(.175,.885,.32,1.275) forwards; }
  @keyframes cb-score-reveal { to { opacity: 1; transform: scale(1); } }

  .cb-score-val { font-weight: 900; font-size: 12px; color: #fbbf24; white-space: nowrap; }
</style>

<div class="canvas432">
  <span class="conn-badge loading" id="connBadge"><span class="dot"></span><span id="connText">Ansluter…</span></span>
  <div id="board"></div>
  <div class="empty-state" id="emptyState" hidden>
    <strong>Ingen på listan än</strong>
    <span>Top Points fylls på när tittare tjänar poäng — väntar på första händelsen.</span>
  </div>
</div>

<script>
  const ACCESS = new URLSearchParams(location.search).get('access') || '';
  const POLL_MS = 4000;
  const RANK_COLORS = ['#FFD700', '#00f2ff', '#ff5e00', '#b24bf3', '#00ff88'];

  function avatarSVG(bg, fg) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="${bg}"/>
      <circle cx="50" cy="38" r="18" fill="${fg}"/>
      <ellipse cx="50" cy="88" rx="30" ry="26" fill="${fg}"/>
    </svg>`;
    return 'data:image/svg+xml;base64,' + btoa(svg);
  }

  function fmt(n) { return Math.round(n).toLocaleString('sv-SE'); }

  function setBadge(state, text) {
    const el = document.getElementById('connBadge');
    el.className = 'conn-badge ' + state;
    document.getElementById('connText').textContent = text;
  }

  function rowHTML(item, index) {
    const color = RANK_COLORS[index] || RANK_COLORS[RANK_COLORS.length - 1];
    const avatar = item.avatarUrl || avatarSVG('#171b26', color);
    const name = item.displayName || (item.viewerId ? '@' + item.viewerId.slice(0, 14) : 'Okänd tittare');
    const rank = index + 1;
    return `
      <div class="cb-row" style="--c:${color}" data-delay="${index * 0.12}">
        <div class="cb-avatar-core" style="animation-delay:${index * 0.12}s">
          ${rank === 1 ? `<div class="cb-crown"><svg viewBox="0 0 640 512" xmlns="http://www.w3.org/2000/svg"><path fill="#ffd700" d="M528 448H112a16 16 0 0 1 0-32h416a16 16 0 0 1 0 32zM571.31 199.36a32 32 0 0 0-35.16 6.94L457.94 285 396 187.63a48.16 48.16 0 0 0-81.06 1.05L256 285l-78.15-78.73a32 32 0 0 0-54.65 22.6L144 400h352l20.8-166.67a32 32 0 0 0-9.49-33.97z"/></svg></div>` : ''}
          <div class="cb-energy-ring">
            <div class="cb-ring-layer a"></div>
            <div class="cb-ring-layer b"></div>
          </div>
          <img class="cb-avatar-img" src="${avatar}" alt="" onerror="this.src='${avatarSVG('#171b26', color)}'">
          <div class="cb-rank-badge">${rank}</div>
        </div>
        <div class="cb-bar" style="animation-delay:${index * 0.12 + 0.1}s">
          <span class="cb-info">${name}</span>
        </div>
        <div class="cb-score-block" style="animation-delay:${index * 0.12 + 0.15}s">
          <span class="cb-score-val">${fmt(item.points)}</span>
        </div>
      </div>
    `;
  }

  let lastSignature = '';

  function render(rows) {
    const board = document.getElementById('board');
    const empty = document.getElementById('emptyState');
    // Voltage's design only ever showed 5 places on overlaylive.app — kept here, the API's own
    // ?limit is what actually caps the fetch (set to 5 below), this slice is just a defensive
    // second cap if a workspace's settings ever change what the endpoint returns.
    rows = rows.slice(0, 5);
    if (!rows.length) { board.innerHTML = ''; empty.hidden = false; lastSignature = ''; return; }
    empty.hidden = true;
    const signature = rows.map(r => r.viewerId + ':' + r.points).join('|');
    if (signature === lastSignature) return;
    lastSignature = signature;
    board.innerHTML = rows.map(rowHTML).join('');
  }

  async function poll() {
    if (!ACCESS) { setBadge('error', 'Ingen ?access=-token i länken'); return; }
    try {
      const res = await fetch(`/api/overlay-access/${encodeURIComponent(ACCESS)}/points?limit=5`, { cache: 'no-store' });
      if (res.status === 402) { setBadge('error', 'Kräver VYRA Premium'); return; }
      if (res.status === 401) { setBadge('error', 'Länken är ogiltig eller har gått ut'); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'okänt fel');
      setBadge('live', 'Live');
      render(data.points || []);
    } catch (e) {
      setBadge('error', 'Tappade anslutningen — försöker igen');
      console.warn('[top-points-voltage] poll misslyckades:', e && e.message);
    }
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
