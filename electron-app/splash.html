<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 520px; height: 340px; overflow: hidden; border-radius: 14px; }
  body {
    font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif;
    background:
      radial-gradient(circle at 20% -10%, #6c159633, transparent 45%),
      radial-gradient(circle at 90% 30%, #b52cff1f, transparent 40%),
      #07040c;
    color: #fff;
    display: flex; flex-direction: column; justify-content: space-between;
    height: 100vh; padding: 34px 36px 26px;
    -webkit-app-region: drag;
    border: 1px solid #2c1d3e;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(145deg, #d94dff, #7922ed);
    box-shadow: 0 0 24px #bc35ff66;
    display: grid; place-items: center;
    font: 800 22px Manrope, sans-serif; color: #fff;
  }
  .name { font: 800 26px Manrope, -apple-system, sans-serif; letter-spacing: .01em; }
  .tag { margin-top: 3px; font-size: 12px; color: #a99cc9; letter-spacing: .04em; }
  .art {
    flex: 1; margin: 22px 0; border-radius: 10px;
    background: linear-gradient(160deg, #150b22, #0a0610);
    border: 1px solid #2c1d3e;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .art::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 20%, #8b3dff29, transparent 55%),
                radial-gradient(circle at 75% 75%, #ff3ec81f, transparent 50%);
  }
  .art span { position: relative; font-size: 13px; color: #7c6f95; letter-spacing: .08em; }
  .foot small { display: block; color: #6b6180; font-size: 10px; line-height: 1.5; }
  .bar { margin-top: 14px; height: 4px; border-radius: 3px; background: #1c1428; overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 40%; border-radius: 3px;
    background: linear-gradient(90deg, #8d24ee, #e251ff);
    animation: sweep 1.3s ease-in-out infinite;
  }
  @keyframes sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark">V</div>
    <div>
      <div class="name">VYRA</div>
      <div class="tag">Desktop App · v1.0.0</div>
    </div>
  </div>
  <div class="art"><span>STARTAR ÖVERLAY-STUDION …</span></div>
  <div class="foot">
    <div class="bar"><i></i></div>
    <small>© 2026 VYRA. Körs lokalt på din dator — inte anslutet till TikTok.</small>
  </div>
</body>
</html>
