<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recognition Card — dev demo</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0611;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: #e9e4f2;
  }
  .demo-layout {
    display: flex;
    height: 100%;
  }
  .demo-controls {
    flex: 0 0 300px;
    padding: 20px;
    overflow-y: auto;
    box-sizing: border-box;
    border-right: 1px solid rgba(255, 255, 255, .08);
  }
  .demo-controls h1 {
    font-size: 16px;
    margin: 0 0 4px;
  }
  .demo-controls p.sub {
    color: #a99dc4;
    margin: 0 0 16px;
    font-size: 12px;
  }
  .demo-controls button {
    display: block;
    width: 100%;
    margin-bottom: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(255, 255, 255, .04);
    color: #f3edff;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
  }
  .demo-controls button:hover {
    background: rgba(255, 255, 255, .09);
  }
  .demo-controls button.danger {
    border-color: rgba(255, 90, 110, .4);
    color: #ffb3bd;
  }
  .demo-stage {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
    /* checkered pattern simulates a transparent OBS Browser Source background */
    background-image:
      linear-gradient(45deg, #2a2530 25%, transparent 25%),
      linear-gradient(-45deg, #2a2530 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2530 75%),
      linear-gradient(-45deg, transparent 75%, #2a2530 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    background-color: #17131f;
  }
  #demoLog {
    margin-top: 16px;
    font-size: 11px;
    color: #a99dc4;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 220px;
    overflow-y: auto;
    border-top: 1px solid rgba(255, 255, 255, .08);
    padding-top: 10px;
  }
</style>
</head>
<body>
  <div class="demo-layout">
    <div class="demo-controls">
      <h1>Recognition Card — dev demo</h1>
      <p class="sub">Dev-only. Ingen TikTok, ingen media.js, ingen studio.html — bara Types + Rules + Card Mapper + Card.</p>

      <button type="button" data-action="join">Join</button>
      <button type="button" data-action="like1">Like 1</button>
      <button type="button" data-action="like250">Like 250</button>
      <button type="button" data-action="like2500">Like 2500</button>
      <button type="button" data-action="share">Share</button>
      <button type="button" data-action="follow">Follow</button>
      <button type="button" data-action="giftSmall">Small Gift</button>
      <button type="button" data-action="giftMedium">Medium Gift</button>
      <button type="button" data-action="giftLarge">Large Gift</button>
      <button type="button" data-action="updateCount">Update Count</button>
      <button type="button" class="danger" data-action="hide">Hide</button>
      <button type="button" class="danger" data-action="destroy">Destroy</button>

      <div id="demoLog"></div>
    </div>
    <div class="demo-stage" id="stage"></div>
  </div>

  <script src="recognition-types.js"></script>
  <script src="recognition-rules.js"></script>
  <script src="recognition-card-mapper.js"></script>
  <script src="recognition-card.js"></script>
  <link rel="stylesheet" href="recognition-card.css">

  <script>
    (function () {
      var log = document.getElementById('demoLog');
      function write(text) {
        var line = document.createElement('div');
        line.textContent = new Date().toLocaleTimeString() + '  ' + text;
        log.insertBefore(line, log.firstChild);
      }

      var mountResult = window.VyraRecognitionCard.mount('#stage');
      write('mount() -> ' + JSON.stringify(mountResult));

      window.VyraRecognitionCard.subscribe(function (event) {
        write('event: ' + event.type + (event.reason ? ' (' + event.reason + ')' : ''));
      });

      var eventCounter = 0;
      function nextId(prefix) {
        eventCounter += 1;
        return prefix + '-' + eventCounter;
      }

      function buildEvent(overrides) {
        overrides = overrides || {};
        var kind = overrides.kind;
        var actor = Object.assign({
          id: 'demo-actor', username: 'robinlarsson', displayName: 'Robin Larsson', avatarUrl: null
        }, overrides.actor || {});
        var gift = overrides.gift === undefined ? null : overrides.gift;
        return {
          id: nextId(kind),
          kind: kind,
          actor: actor,
          gift: gift,
          count: overrides.count !== undefined ? overrides.count : 1,
          coins: overrides.coins !== undefined ? overrides.coins : 0,
          timestamp: Date.now(),
          mergeKey: kind + ':' + actor.id + (gift ? ':' + gift.id : ''),
          mergedCount: overrides.count !== undefined ? overrides.count : 1,
          firstSeen: Date.now(),
          lastSeen: Date.now(),
          sourceEventIds: [nextId(kind + '-src')]
        };
      }

      var lastKind = null;
      var lastCount = 1;

      function showEvent(overrides) {
        var event = buildEvent(overrides);
        var mapped = window.VyraRecognitionCardMapper.map(event);
        write('map() -> ' + mapped.status);
        if (mapped.status !== 'mapped') return;
        lastKind = event.kind;
        lastCount = event.count;
        var result = window.VyraRecognitionCard.show(mapped.model);
        write('show() -> ' + JSON.stringify(result));
      }

      var actions = {
        join: function () { showEvent({ kind: 'join' }); },
        like1: function () { showEvent({ kind: 'like', count: 1 }); },
        like250: function () { showEvent({ kind: 'like', count: 250 }); },
        like2500: function () { showEvent({ kind: 'like', count: 2500 }); },
        share: function () { showEvent({ kind: 'share', count: 3 }); },
        follow: function () { showEvent({ kind: 'follow' }); },
        giftSmall: function () { showEvent({ kind: 'gift', gift: { id: 'rose', name: 'Rose', imageUrl: null }, coins: 10, count: 1 }); },
        giftMedium: function () { showEvent({ kind: 'gift', gift: { id: 'galaxy', name: 'Galaxy', imageUrl: null }, coins: 500, count: 2 }); },
        giftLarge: function () { showEvent({ kind: 'gift', gift: { id: 'universe', name: 'Universe', imageUrl: null }, coins: 5000, count: 1 }); },
        updateCount: function () {
          if (!lastKind) { write('Update Count: inget kort visas an — visa ett kort forst.'); return; }
          lastCount += (lastKind === 'gift' ? 1 : 50);
          var overrides = { kind: lastKind, count: lastCount };
          if (lastKind === 'gift') { overrides.gift = { id: 'rose', name: 'Rose', imageUrl: null }; overrides.coins = 10 * lastCount; }
          var event = buildEvent(overrides);
          var mapped = window.VyraRecognitionCardMapper.map(event);
          if (mapped.status !== 'mapped') { write('Update Count: map() -> ' + mapped.status); return; }
          var result = window.VyraRecognitionCard.update(mapped.model);
          write('update() -> ' + JSON.stringify(result));
        },
        hide: function () {
          var result = window.VyraRecognitionCard.hide('demo-hide-button');
          write('hide() -> ' + JSON.stringify(result));
        },
        destroy: function () {
          var result = window.VyraRecognitionCard.destroy();
          write('destroy() -> ' + JSON.stringify(result));
          lastKind = null;
        }
      };

      document.querySelectorAll('[data-action]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var action = actions[btn.dataset.action];
          if (action) action();
        });
      });
    })();
  </script>
</body>
</html>
